components:
  securitySchemes:
    sessionCookie: {type: apiKey, in: cookie, name: gmedic.sid}
    internalKey: {type: apiKey, in: header, name: x-internal-key, description: Value of the INTERNAL_EVENT_KEY env var}
  schemas:
    Object: {type: object, additionalProperties: true, description: Free-form payload; see the portal form for fields}
    Error:
      type: object
      properties:
        error: {type: string}
        fields: {type: object, additionalProperties: {type: string}, description: Per-field validation messages}
    Ok:
      type: object
      properties:
        ok: {type: boolean}
        message: {type: string}
        id: {type: string}
    LoginRequest:
      type: object
      required: [role, identifier, password]
      properties:
        role: {type: string, enum: [SUPER_ADMIN, RECEPTIONIST, DOCTOR], description: SUPER_ADMIN also accepts Finance / Support / Operations staff}
        identifier: {type: string, description: Email or username}
        password: {type: string, format: password}
        remember: {type: boolean}
        next: {type: string}
    ForgotPasswordRequest:
      type: object
      required: [identifier]
      properties: {identifier: {type: string}}
    InternalEventRequest:
      type: object
      required: [eventKey, appointmentId]
      properties:
        eventKey: {type: string, enum: [NEW_APPOINTMENT, APPOINTMENT_CONFIRMED, APPOINTMENT_CANCELLED, APPOINTMENT_RESCHEDULED, APPOINTMENT_REMINDER, PAYMENT_SUCCESS, PAYMENT_FAILED]}
        appointmentId: {type: string, example: APT10545}
    StatusChange:
      type: object
      properties:
        status: {type: string}
        reason: {type: string}
        note: {type: string}
    Reason: {type: object, properties: {reason: {type: string}}}
    FeeCommission:
      type: object
      required: [bookingModel, commissionType, commissionValue]
      properties:
        bookingModel: {type: string}
        bookingFee: {type: number}
        convenienceFee: {type: number}
        commissionType: {type: string, enum: [PERCENT, FLAT], description: "PERCENT of collection, or FLAT amount per paid appointment"}
        commissionValue: {type: number, minimum: 0, maximum: 100000}
    RefundRequest:
      type: object
      required: [appointmentId, amount, reason]
      properties: {appointmentId: {type: string}, amount: {type: number}, reason: {type: string}}
    RefundDecision:
      type: object
      required: [decision]
      properties: {decision: {type: string, enum: [APPROVED, REJECTED]}, note: {type: string}}
    DisputeResolve:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [UNDER_REVIEW, RESOLVED, REJECTED]}
        resolution: {type: string, description: Required when status is RESOLVED or REJECTED}
    Note: {type: object, required: [note], properties: {note: {type: string, maxLength: 1000}}}
    SettlementGenerate:
      type: object
      required: [hospitalId, periodStart, periodEnd]
      properties: {hospitalId: {type: string}, periodStart: {type: string, format: date}, periodEnd: {type: string, format: date}}
    MarkPaid: {type: object, required: [payoutReference], properties: {payoutReference: {type: string}}}
    Message: {type: object, required: [message], properties: {message: {type: string}}}
    Assign: {type: object, properties: {assignedTo: {type: string, nullable: true}}}
    Priority: {type: object, required: [priority], properties: {priority: {type: string, enum: [LOW, MEDIUM, HIGH, URGENT]}}}
    TicketStatus: {type: object, required: [status], properties: {status: {type: string, enum: [OPEN, IN_PROGRESS, RESOLVED, CLOSED]}}}
    TicketCreate:
      type: object
      required: [subject, description, category]
      properties:
        subject: {type: string}
        description: {type: string}
        category: {type: string, enum: [APPOINTMENT, PAYMENT, REFUND, HOSPITAL, DOCTOR, ACCOUNT, QR, SCHEDULE, TECHNICAL, OTHER]}
        priority: {type: string, enum: [LOW, MEDIUM, HIGH, URGENT]}
        appointmentId: {type: string}
    TemplateWrite:
      type: object
      properties:
        eventKey: {type: string, description: Required on create}
        title: {type: string}
        body: {type: string, description: "May only use {{variables}} defined for the event"}
        channels: {type: array, items: {type: string, enum: [IN_APP, PUSH, SMS, WHATSAPP, EMAIL]}, description: Only IN_APP delivers; others are logged UNAVAILABLE}
    Announcement:
      type: object
      properties: {title: {type: string}, message: {type: string}, audience: {type: string}, hospitalIds: {type: array, items: {type: string}}}
    Banner:
      type: object
      properties: {title: {type: string}, message: {type: string}, ctaLabel: {type: string}, ctaUrl: {type: string}, startsAt: {type: string}, endsAt: {type: string}}
    Availability: {type: object, required: [availability], properties: {availability: {type: string}}}
    DoctorProfileUpdate:
      type: object
      properties:
        bio: {type: string, maxLength: 500}
        languages: {type: string, maxLength: 120}
        yearsExperience: {type: integer, minimum: 0, maximum: 70}
    DoctorSummary:
      type: object
      required: [id, name, specialization, fee, availability]
      properties:
        id: {type: string, example: DOC101}
        name: {type: string, example: Dr. Arun Srinivasan}
        specialization: {type: string, example: Cardiologist}
        fee: {type: integer, description: Consultation fee in rupees, example: 800}
        availability: {type: string, enum: [present, absent]}
    DashboardAppointment:
      type: object
      required: [id, patientId, patientName, date, time, fee, status, paymentStatus]
      properties:
        id: {type: string, example: APT10413}
        hospitalId: {type: string}
        hospitalName: {type: string}
        doctorId: {type: string}
        doctorName: {type: string}
        specialization: {type: string}
        department: {type: string, nullable: true}
        branchName: {type: string, nullable: true}
        tokenCode: {type: string, nullable: true, example: T011}
        transactionId: {type: string, nullable: true}
        patientId: {type: string, example: PAT1026}
        patientName: {type: string}
        patientMobile: {type: string}
        date: {type: string, format: date}
        time: {type: string, description: HH:mm (24h), example: '12:00'}
        fee: {type: integer}
        status: {type: string, enum: [pending, confirmed, completed, cancelled]}
        paymentStatus: {type: string, example: paid, description: paid or pending}
        source: {type: string, example: Gmedic App}
        cancelReason: {type: string, nullable: true}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    DashboardToken:
      type: object
      required: [id, appointmentId, number, code, status]
      properties:
        id: {type: string, example: TK10090}
        hospitalId: {type: string}
        appointmentId: {type: string}
        doctorId: {type: string}
        doctorName: {type: string}
        specialization: {type: string}
        patientName: {type: string}
        date: {type: string, format: date}
        number: {type: integer, example: 11}
        code: {type: string, example: T011}
        status: {type: string, enum: [waiting, called, in_consultation, completed, skipped, cancelled]}
        time: {type: string}
        appointmentStatus: {type: string}
        paymentStatus: {type: string}
        fee: {type: integer}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        calledAt: {type: string, format: date-time, nullable: true}
        completedAt: {type: string, format: date-time, nullable: true}
        cancelledAt: {type: string, format: date-time, nullable: true}
        skippedAt: {type: string, format: date-time, nullable: true}
    DashboardStats:
      type: object
      required: [todaysAppointments, waitingPatients, completedToday, cancelledToday, earningsToday, upcoming]
      properties:
        todaysAppointments: {type: integer}
        waitingPatients: {type: integer}
        completedToday: {type: integer}
        cancelledToday: {type: integer}
        earningsToday: {type: integer, description: Sum of fees of today's paid appointments}
        upcoming: {type: integer, description: Non-cancelled appointments after today}
    DoctorDashboard:
      type: object
      required: [date, doctor, stats, currentToken, nextWaiting, todaysAppointments]
      properties:
        date: {type: string, format: date}
        doctor: {$ref: '#/components/schemas/DoctorSummary'}
        stats: {$ref: '#/components/schemas/DashboardStats'}
        currentToken: {allOf: [{$ref: '#/components/schemas/DashboardToken'}], nullable: true}
        nextWaiting: {type: array, maxItems: 3, items: {$ref: '#/components/schemas/DashboardToken'}}
        todaysAppointments: {type: array, items: {$ref: '#/components/schemas/DashboardAppointment'}}
    DoctorDashboardStats:
      allOf:
        - {$ref: '#/components/schemas/DashboardStats'}
        - type: object
          required: [date]
          properties: {date: {type: string, format: date}}
    DoctorDashboardQueue:
      type: object
      required: [date, currentToken, nextWaiting]
      properties:
        date: {type: string, format: date}
        currentToken: {allOf: [{$ref: '#/components/schemas/DashboardToken'}], nullable: true}
        nextWaiting: {type: array, maxItems: 3, items: {$ref: '#/components/schemas/DashboardToken'}}
    DoctorDashboardAppointments:
      type: object
      required: [date, items]
      properties:
        date: {type: string, format: date}
        items: {type: array, items: {$ref: '#/components/schemas/DashboardAppointment'}}
    DoctorAnalytics:
      type: object
      required: [from, to, totals, byStatus, byDay]
      properties:
        from: {type: string, format: date}
        to: {type: string, format: date}
        totals:
          type: object
          required: [appointments, uniquePatients, earnings]
          properties: {appointments: {type: integer}, uniquePatients: {type: integer}, earnings: {type: integer}}
        byStatus: {type: object, additionalProperties: {type: integer}, example: {completed: 21, cancelled: 1}}
        byDay:
          type: array
          description: Ascending by date; days with no appointments are omitted
          items:
            type: object
            required: [date, booked, completed, cancelled, earnings]
            properties:
              date: {type: string, format: date}
              booked: {type: integer, description: Non-cancelled appointments}
              completed: {type: integer}
              cancelled: {type: integer}
              earnings: {type: integer}
    DoctorEarnings:
      type: object
      required: [from, to, totals, items]
      properties:
        from: {type: string, format: date}
        to: {type: string, format: date}
        totals:
          type: object
          required: [paidAppointments, earnings, pendingAmount]
          properties:
            paidAppointments: {type: integer}
            earnings: {type: integer}
            pendingAmount: {type: integer, description: Fees of non-cancelled appointments still unpaid}
        items:
          type: array
          description: Paid appointments, newest first
          items:
            type: object
            required: [appointmentId, date, time, patientName, fee]
            properties:
              appointmentId: {type: string}
              date: {type: string, format: date}
              time: {type: string}
              patientName: {type: string}
              fee: {type: integer}
              transactionId: {type: string, nullable: true}
    Leave:
      type: object
      required: [id, doctorId, startDate, endDate]
      properties:
        id: {type: integer}
        doctorId: {type: string}
        startDate: {type: string, format: date}
        endDate: {type: string, format: date}
        reason: {type: string, nullable: true}
    LeaveList:
      type: object
      required: [items]
      properties: {items: {type: array, items: {$ref: '#/components/schemas/Leave'}}}
    LeaveCreated:
      type: object
      required: [ok, message, id]
      properties: {ok: {type: boolean}, message: {type: string, example: Leave added.}, id: {type: integer}}
    LeaveCreate:
      type: object
      required: [startDate, endDate]
      properties: {startDate: {type: string, format: date}, endDate: {type: string, format: date}, reason: {type: string, maxLength: 200}}
    ScheduleSlot:
      type: object
      properties: {dayOfWeek: {type: integer}, startTime: {type: string}, endTime: {type: string}, slotMinutes: {type: integer}, capacityPerSlot: {type: integer, minimum: 1, maximum: 50, default: 1, description: Patients per slot}}
    PasswordChange:
      type: object
      required: [currentPassword, newPassword, confirmPassword]
      properties: {currentPassword: {type: string, format: password}, newPassword: {type: string, format: password}, confirmPassword: {type: string, format: password, description: Must equal newPassword}}
