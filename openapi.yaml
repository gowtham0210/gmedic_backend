openapi: 3.0.3
info:
  title: Gmedic Web Portal API
  version: 1.0.0
  description: |
    REST API behind the Gmedic Super Admin, Receptionist and Doctor portals (Next.js route handlers).
    Authentication is a session cookie (`gmedic.sid`) set by `POST /api/auth/login`. Authorisation is enforced on the server:
    admin routes need the named permission (403 otherwise), portal routes are scoped to the signed-in hospital / doctor,
    and users only ever see their own support tickets (404 for anyone else's).
    The access requirement of each operation is given in `x-access`.
    Super Admin appointments are read-only: there is no cancel / reschedule / edit endpoint.
servers:
  - url: http://localhost:3000
    description: Local development
security:
  - sessionCookie: []
tags:
  - name: "Auth"
  - name: "Internal"
  - name: "Admin: Dashboard"
  - name: "Admin: Hospitals"
  - name: "Admin: Doctors"
  - name: "Admin: Receptionists"
  - name: "Admin: QR"
  - name: "Admin: Appointments"
  - name: "Admin: Patients"
  - name: "Admin: Finance"
  - name: "Admin: Support"
  - name: "Admin: Communications"
  - name: "Admin: Settings"
  - name: "Admin: Audit"
  - name: "Receptionist"
  - name: "Doctor"
  - name: "Doctor: Dashboard"
paths:
  /api/auth/login:
    post:
      tags: ["Auth"]
      summary: "Log in (sets the gmedic.sid session cookie)"
      operationId: postApiAuthLogin
      x-access: "public"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Ok'}}}}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/auth/logout:
    post:
      tags: ["Auth"]
      summary: "Log out"
      operationId: postApiAuthLogout
      x-access: "public"
      security: []
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Ok'}}}}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/auth/forgot-password:
    post:
      tags: ["Auth"]
      summary: "Request a password reset"
      operationId: postApiAuthForgotPassword
      x-access: "public"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ForgotPasswordRequest'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Ok'}}}}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/internal/events:
    post:
      tags: ["Internal"]
      summary: "Fire an appointment/payment notification event (patient-app backend). Header x-internal-key required"
      operationId: postApiInternalEvents
      x-access: "internal"
      security:
        - internalKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InternalEventRequest'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Ok'}}}}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
  /api/admin/dashboard:
    get:
      tags: ["Admin: Dashboard"]
      summary: "Dashboard summary"
      operationId: getApiAdminDashboard
      x-access: "any admin"
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
  /api/admin/analytics:
    get:
      tags: ["Admin: Dashboard"]
      summary: "Analytics summary"
      operationId: getApiAdminAnalytics
      x-access: "analytics.view"
      parameters:
        - {name: from, in: query, schema: {type: string}}
        - {name: to, in: query, schema: {type: string}}
        - {name: hospitalId, in: query, schema: {type: string}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
  /api/admin/hospitals:
