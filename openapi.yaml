openapi: 3.0.3
info:
  title: Gmedic Web Portal API
  version: 1.0.0
  description: |
    REST API behind the Gmedic Super Admin, Receptionist and Doctor portals (Next.js route handlers).
    Authentication is a session cookie (`gmedic.sid`) set by `POST /api/auth/login`. Authorisation is enforced on the server:
    admin routes need the named permission (403 otherwise), portal routes are scoped to the signed-in hospital / doctor,
    and users only ever see their own support tickets (404 for anyone else's).
    The access requirement of each operation is given in `x-access`.
    Super Admin appointments are read-only: there is no cancel / reschedule / edit endpoint.
servers:
  - url: http://localhost:3000
    description: Local development
security:
  - sessionCookie: []
tags:
  - name: "Auth"
  - name: "Internal"
  - name: "Admin: Dashboard"
  - name: "Admin: Hospitals"
  - name: "Admin: Doctors"
  - name: "Admin: Receptionists"
  - name: "Admin: QR"
  - name: "Admin: Appointments"
  - name: "Admin: Patients"
  - name: "Admin: Finance"
  - name: "Admin: Support"
  - name: "Admin: Communications"
  - name: "Admin: Settings"
  - name: "Admin: Audit"
  - name: "Receptionist"
paths:
  /api/auth/login:
    post:
      tags: ["Auth"]
      summary: "Log in (sets the gmedic.sid session cookie)"
      operationId: postApiAuthLogin
      x-access: "public"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/LoginResponse'}}}}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Incorrect email/username or password}
        '403': {description: Account is not active}
        '429': {description: Too many failed attempts - wait a few minutes}
  /api/auth/logout:
    post:
      tags: ["Auth"]
      summary: "Log out"
      operationId: postApiAuthLogout
      x-access: "public"
      security: []
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/LogoutResponse'}}}}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/auth/forgot-password:
    post:
      tags: ["Auth"]
      summary: "Request a password reset"
      operationId: postApiAuthForgotPassword
      x-access: "public"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ForgotPasswordRequest'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Ok'}}}}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/internal/events:
    post:
      tags: ["Internal"]
      summary: "Fire an appointment/payment notification event (patient-app backend). Header x-internal-key required"
      operationId: postApiInternalEvents
      x-access: "internal"
      security:
        - internalKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InternalEventRequest'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/InternalEventResult'}}}}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Missing or wrong x-internal-key}
        '404': {description: Unknown appointment}
        '503': {description: INTERNAL_EVENT_KEY is not configured}
  /api/admin/dashboard:
    get:
      tags: ["Admin: Dashboard"]
      summary: "Operational dashboard: KPI cards, 14-day booking and revenue trends, QR funnel, hospital growth, recent activity and pending work"
      operationId: getApiAdminDashboard
      x-access: "dashboard.view"
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/DashboardSummary'}}}}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
  /api/admin/analytics:
    get:
      tags: ["Admin: Dashboard"]
      summary: "Same payload as the dashboard, behind the separate analytics.view permission (so Finance can see trends without the full dashboard). Takes no filters: always platform-wide, last 14 days for trends and 30 days for rates and the QR funnel"
      operationId: getApiAdminAnalytics
      x-access: "analytics.view"
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/DashboardSummary'}}}}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
  /api/admin/hospitals:
    get:
      tags: ["Admin: Hospitals"]
      summary: "List hospitals with doctor counts and a status summary"
      operationId: getApiAdminHospitals
      x-access: "hospitals.view"
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [ONBOARDING, ACTIVE, SUSPENDED, OFFBOARDED]}}
        - {name: kycStatus, in: query, schema: {type: string, enum: [PENDING, UNDER_REVIEW, VERIFIED, REJECTED]}}
        - {name: q, in: query, schema: {type: string}}
        - {name: page, in: query, schema: {type: integer}}
        - {name: pageSize, in: query, schema: {type: integer}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/HospitalList'}}}}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
    post:
      tags: ["Admin: Hospitals"]
      summary: "Onboard a hospital (starts ONBOARDING / KYC PENDING and gets a Main Reception QR code)"
      operationId: postApiAdminHospitals
      x-access: "hospitals.manage"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/HospitalCreate'}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/HospitalResult'}}}}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
  /api/admin/hospitals/{id}:
    get:
      tags: ["Admin: Hospitals"]
      summary: "Hospital detail with branch, doctor, receptionist and appointment counts"
      operationId: getApiAdminHospitalsId
      x-access: "hospitals.view"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/HospitalDetail'}}}}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Not found}
    put:
      tags: ["Admin: Hospitals"]
      summary: "Update hospital details (send only the fields to change)"
      operationId: putApiAdminHospitalsId
      x-access: "hospitals.manage"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/HospitalUpdate'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/HospitalResult'}}}}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Not found}
  /api/admin/hospitals/{id}/status:
    patch:
      tags: ["Admin: Hospitals"]
      summary: "Change status; a reason is required for SUSPENDED and OFFBOARDED. Data is never deleted"
      operationId: patchApiAdminHospitalsIdStatus
      x-access: "hospitals.manage"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/HospitalStatus'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/HospitalResult'}}}}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Not found}
  /api/admin/hospitals/{id}/fees:
    put:
      tags: ["Admin: Hospitals"]
      summary: "Set booking model, fees and COMMISSION (type + value). Every change is recorded in the rate history"
      operationId: putApiAdminHospitalsIdFees
      x-access: "hospitals.manage"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FeeCommission'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/HospitalResult'}}}}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Not found}
  /api/admin/hospitals/{id}/rates:
    get:
      tags: ["Admin: Hospitals"]
      summary: "Fee and commission history, newest first"
      operationId: getApiAdminHospitalsIdRates
      x-access: "hospitals.view"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/RateHistory'}}}}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Not found}
  /api/admin/hospitals/{id}/kyc:
    patch:
      tags: ["Admin: Hospitals"]
      summary: "Set the hospital's KYC status"
      operationId: patchApiAdminHospitalsIdKyc
      x-access: "kyc.manage"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/KycStatus'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/HospitalResult'}}}}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Not found}
  /api/admin/hospitals/{id}/documents:
    get:
      tags: ["Admin: Hospitals"]
      summary: "List KYC documents"
      operationId: getApiAdminHospitalsIdDocuments
      x-access: "kyc.view"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/DocumentList'}}}}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Not found}
    post:
      tags: ["Admin: Hospitals"]
      summary: "Upload a KYC document (multipart; PDF, PNG or JPEG up to 8 MB). Moves KYC from PENDING to UNDER_REVIEW"
      operationId: postApiAdminHospitalsIdDocuments
      x-access: "kyc.manage"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {$ref: '#/components/schemas/DocumentUpload'}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Ok'}}}}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Not found}
  /api/admin/hospitals/{id}/documents/{docId}:
    get:
      tags: ["Admin: Hospitals"]
      summary: "Download / view the stored document file"
      operationId: getApiAdminHospitalsIdDocumentsDocid
      x-access: "kyc.view"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: docId, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: The stored file, content: {application/pdf: {schema: {type: string, format: binary}}, image/png: {schema: {type: string, format: binary}}, image/jpeg: {schema: {type: string, format: binary}}}}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Not found}
    patch:
      tags: ["Admin: Hospitals"]
      summary: "Verify or reject a document (rejection needs a reason)"
      operationId: patchApiAdminHospitalsIdDocumentsDocid
      x-access: "kyc.manage"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: docId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DocumentReview'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Ok'}}}}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Not found}
  /api/admin/hospitals/{id}/branches:
    get:
      tags: ["Admin: Hospitals"]
      summary: "List branches"
      operationId: getApiAdminHospitalsIdBranches
      x-access: "branches.view"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/BranchList'}}}}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Not found}
    post:
      tags: ["Admin: Hospitals"]
      summary: "Add a branch"
      operationId: postApiAdminHospitalsIdBranches
      x-access: "branches.manage"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BranchCreate'}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Ok'}}}}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Not found}
  /api/admin/branches/{id}:
    patch:
      tags: ["Admin: Hospitals"]
      summary: "Activate or deactivate a branch"
      operationId: patchApiAdminBranchesId
      x-access: "branches.manage"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BranchUpdate'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Ok'}}}}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Not found}
  /api/admin/doctors:
    get:
      tags: ["Admin: Doctors"]
      summary: "List doctors"
      operationId: getApiAdminDoctors
      x-access: "doctors.view"
      parameters:
        - {name: hospitalId, in: query, schema: {type: string}}
        - {name: specialization, in: query, schema: {type: string}}
        - {name: verificationStatus, in: query, schema: {type: string, enum: [PENDING, VERIFIED, REJECTED]}}
        - {name: q, in: query, schema: {type: string}}
        - {name: page, in: query, schema: {type: integer}}
        - {name: pageSize, in: query, schema: {type: integer}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/DoctorList'}}}}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
  /api/admin/doctors/{id}:
    get:
      tags: ["Admin: Doctors"]
      summary: "Doctor detail"
      operationId: getApiAdminDoctorsId
      x-access: "doctors.view"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/DoctorDetail'}}}}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Not found}
    put:
      tags: ["Admin: Doctors"]
      summary: "Update doctor"
      operationId: putApiAdminDoctorsId
      x-access: "doctors.manage"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DoctorUpdate'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/DoctorResult'}}}}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Not found}
  /api/admin/doctors/{id}/verification:
    patch:
      tags: ["Admin: Doctors"]
      summary: "Verify / reject a doctor"
      operationId: patchApiAdminDoctorsIdVerification
      x-access: "doctors.verify"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DoctorVerification'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/DoctorResult'}}}}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Not found}
  /api/admin/receptionists:
    get:
      tags: ["Admin: Receptionists"]
      summary: "List receptionists"
      operationId: getApiAdminReceptionists
      x-access: "receptionists.view"
      parameters:
        - {name: hospitalId, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: string, enum: [ACTIVE, INACTIVE, PENDING_APPROVAL, REJECTED]}}
        - {name: q, in: query, schema: {type: string}}
        - {name: page, in: query, schema: {type: integer}}
        - {name: pageSize, in: query, schema: {type: integer}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/ReceptionistList'}}}}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
    post:
      tags: ["Admin: Receptionists"]
      summary: "Create receptionist"
      operationId: postApiAdminReceptionists
      x-access: "receptionists.manage"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReceptionistCreate'}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/ReceptionistCreated'}}}}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
  /api/admin/receptionists/{id}/status:
    patch:
      tags: ["Admin: Receptionists"]
      summary: "Enable / disable receptionist"
      operationId: patchApiAdminReceptionistsIdStatus
      x-access: "receptionists.manage"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ActiveStatus'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Ok'}}}}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Not found}
  /api/admin/receptionists/{id}/reset-password:
    post:
      tags: ["Admin: Receptionists"]
      summary: "Reset password"
      operationId: postApiAdminReceptionistsIdResetPassword
      x-access: "receptionists.manage"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/TempPassword'}}}}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Not found}
  /api/admin/qr:
    get:
      tags: ["Admin: QR"]
      summary: "List QR codes"
      operationId: getApiAdminQr
      x-access: "qr.view"
      parameters:
        - {name: hospitalId, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: string, enum: [ACTIVE, REVOKED]}}
        - {name: q, in: query, schema: {type: string}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/QrList'}}}}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
    post:
      tags: ["Admin: QR"]
      summary: "Create QR code"
      operationId: postApiAdminQr
      x-access: "qr.manage"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/QrCreate'}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Ok'}}}}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
  /api/admin/qr/analytics:
    get:
      tags: ["Admin: QR"]
      summary: "QR scan analytics"
      operationId: getApiAdminQrAnalytics
      x-access: "qr.view"
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/QrAnalytics'}}}}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
  /api/admin/qr/{id}/revoke:
    post:
      tags: ["Admin: QR"]
      summary: "Revoke QR code"
      operationId: postApiAdminQrIdRevoke
      x-access: "qr.manage"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
