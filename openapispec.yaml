        note: {type: string}
    Reason: {type: object, properties: {reason: {type: string}}}
    RefundRequest:
      type: object
      required: [appointmentId, amount, reason]
      description: Receptionist refund request. The amount is in rupees
      properties:
        appointmentId: {type: string, description: A paid appointment of this hospital}
