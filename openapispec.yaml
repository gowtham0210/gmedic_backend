      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/RecWalkInSeats'}}}}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Doctor not found}
    put:
      tags: ["Receptionist"]
      summary: "Hold back seats per slot for walk-ins (one block, or all of the doctor's blocks)"
      description: "Applies at once and only limits new app bookings; appointments already made are kept."
      operationId: putApiDoctorsIdWalkInSeats
      x-access: "receptionist"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, description: "Send walkInSeats, emergencySeats or both", properties: {walkInSeats: {type: integer, minimum: 0, maximum: 50}, emergencySeats: {type: integer, minimum: 0, maximum: 3, description: "Legacy (migration 032): kept as data, no longer used to book anything"}, scheduleId: {type: integer, description: "Omit to apply to every current and upcoming block"}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/RecWalkInSeats'}}}}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Doctor or schedule block not found}
  /api/appointments/{id}:
    get:
      tags: ["Receptionist"]
      summary: "Appointment detail"
      description: "The list fields plus the consultation fee payment (taken at the hospital; the PAID one when there is one, with receipt number and reference), the booking token paid in the app (bookingToken, null for walk-in and phone bookings) and any refund requests."
      operationId: getApiAppointmentsId
      x-access: "receptionist"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/RecAppointmentDetail'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Not found}
    patch:
      tags: ["Receptionist"]
      summary: "Correct appointment details (reason for visit, patient details)"
      description: "Fixes what the desk typed wrong and records who changed it in the audit log. The patient's own details can only be corrected for a patient registered at a front desk; a patient with a Gmedic app account owns their details, so patient fields are refused (409) and only `reason` can change. A change that matches the stored value is a no-op (message 'No changes to save.')."
      operationId: patchApiAppointmentsId
      x-access: "receptionist"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RecAppointmentUpdate'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/AppointmentResult'}}}}
        '400': {description: "Validation error (fields: patient.name, patient.mobile, patient.gender, patient.dateOfBirth)", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Not found}
        '409': {description: The patient has their own app account, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/appointments/{id}/status:
    patch:
      tags: ["Receptionist"]
      summary: "Update appointment status"
      description: "Moves only along the appointment's `nextStatuses`: pending to confirmed, confirmed to pending, and either to completed once the appointment date has come (a future appointment cannot be completed early). Completed, cancelled and no-show appointments are final and refuse every change; cancelling has its own endpoint. The update is conditional on the status the caller saw (a concurrent change returns 400) and is audited. Completing also completes the queue token. Re-sending the current status is a no-op."
      operationId: patchApiAppointmentsIdStatus
      x-access: "receptionist"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AppointmentStatus'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/AppointmentResult'}}}}
        '400': {description: "Invalid status, status not allowed from the current one, final appointment, no-show, or changed concurrently", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Not found}
  /api/appointments/{id}/cancel:
    get:
      tags: ["Receptionist"]
      summary: "Preview cancelling an appointment"
      description: "What a front-desk cancel would refund under the hospital's cancellation rules (never more than is still refundable), and why it is blocked if it is (already cancelled, completed, patient with the doctor, or marked no-show). A fee collected at the front desk is never refunded by Gmedic: refundPaise is 0 and the note says the hospital returns it."
      operationId: getApiAppointmentsIdCancel
      x-access: "receptionist"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: object, properties: {quote: {$ref: '#/components/schemas/AppointmentCancelQuote'}}}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Not found}
    post:
      tags: ["Receptionist"]
      summary: "Cancel appointment"
      description: "Cancels with a reason, withdraws the live queue token, refunds by the same rules as the patient app, notifies the patient, doctor and receptionists, and writes an audit entry. Refused (422) for an appointment that is already cancelled, completed, in consultation or marked as a no-show."
      operationId: postApiAppointmentsIdCancel
      x-access: "receptionist"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [reason], properties: {reason: {type: string, minLength: 1, maxLength: 300}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/AppointmentResult'}, {type: object, properties: {quote: {$ref: '#/components/schemas/AppointmentCancelQuote'}}}]}}}}
        '400': {description: Reason missing or over 300 characters (fields.reason), content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Not found}
        '422': {description: "Cannot be cancelled (already cancelled, completed, in consultation, or a no-show)", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/appointments/{id}/reschedule:
    post:
      tags: ["Receptionist"]
      summary: "Reschedule appointment (same doctor)"
      description: "Moves a confirmed or pending appointment to another slot of the same doctor, keeping its payment. The seat is taken under the front desk's seat rules (the patient app's one-reschedule limit does not bind staff), the queue token moves with it (the old one is removed and the new slot's token number is issued), `rescheduleCount` goes up, and the patient and doctor are notified (APPOINTMENT_RESCHEDULED). Refused with 409 when the appointment is not confirmed/pending, is a no-show, has already been called or is with the doctor, the new day is closed, the slot is full or ended, or the patient already has an appointment with the doctor that day."
      operationId: postApiAppointmentsIdReschedule
      x-access: "receptionist"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RecReschedule'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/AppointmentResult'}}}}
        '400': {description: "Invalid date/time, same slot as now, or not one of the doctor's slots that day", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Not found}
        '409': {description: Cannot be rescheduled (see description), content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/appointments/{id}/no-show:
    post:
      tags: ["Receptionist"]
      summary: "Mark the patient as a no-show"
      description: "Only for a confirmed appointment, only on the day of the appointment, and only once the slot started more than the platform setting no_show_grace_minutes ago. Withdraws the queue token (waiting, called or skipped) so the doctor does not call the patient. It does not complete the appointment and is not a cancellation: nothing is refunded. Refused with 409 when already a no-show, not confirmed, not today, within the grace period, the patient is in consultation, or the appointment changed concurrently."
      operationId: postApiAppointmentsIdNoShow
      x-access: "receptionist"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/AppointmentResult'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Not found}
        '409': {description: Cannot be marked as a no-show (see description), content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    delete:
      tags: ["Receptionist"]
      summary: "Undo a no-show (same day)"
      description: "The patient did come after all. Only on the day of the appointment. Their queue token is restored under the appointment's own token number. Refused with 409 when the appointment is not marked as a no-show or the day has passed."
      operationId: deleteApiAppointmentsIdNoShow
      x-access: "receptionist"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/AppointmentResult'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Not found}
        '409': {description: "Not a no-show, or not the day of the appointment", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/appointments/{id}/payment:
    post:
      tags: ["Receptionist"]
      summary: "Record the fee collected at the front desk"
      description: "Records the consultation fee taken at the hospital: a PAID payment with purpose CONSULTATION on gateway FRONT_DESK for the full fee (a receipt number is issued, the transaction id is FD plus 10 digits, the reference is kept on the payment), and the appointment turns paid. This is also how the fee of a Gmedic app booking is recorded: the app only takes the booking token (purpose TOKEN), which does not make the appointment paid. 409 if the consultation fee was already collected. UPI and Card need a reference of at least 4 characters. This money never passes through Gmedic; a refund of it is the hospital's own to give back."
      operationId: postApiAppointmentsIdPayment
      x-access: "receptionist"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RecDeskPayment'}
      responses:
        '201': {description: Recorded, content: {application/json: {schema: {$ref: '#/components/schemas/AppointmentResult'}}}}
        '400': {description: "Invalid method or missing reference (fields.method, fields.reference)", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Not found}
        '409': {description: The appointment is cancelled or already paid, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/doctors:
    get:
      tags: ["Receptionist"]
      summary: "List hospital doctors"
      description: "Includes deactivated doctors (status INACTIVE); the `summary` present/absent counts leave them out. `availability` filters on today's effective value: a doctor on leave today, or marked absent today, is absent."
      operationId: getApiDoctors
      x-access: "receptionist"
      parameters:
        - {name: q, in: query, schema: {type: string}, description: Name, specialization or doctor id (contains)}
        - {name: specialization, in: query, schema: {type: string}}
        - {name: availability, in: query, schema: {type: string, enum: [present, absent]}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/RecDoctorList'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
    post:
      tags: ["Receptionist"]
      summary: "Add doctor"
      description: "Creates a doctor of this hospital, stored with a single Dr. prefix. A new doctor is pending verification and cannot take bookings until verified and given working hours."
      operationId: postApiDoctors
      x-access: "receptionist"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DoctorCreate'}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/RecDoctorResult'}}}}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
  /api/doctors/{id}:
    get:
      tags: ["Receptionist"]
      summary: "Doctor detail"
      description: "The doctor with booking stats and portal login state, the next 8 appointments from today (`schedule`, all statuses), and the leaves still to come or running with how many appointments are booked inside each."
      operationId: getApiDoctorsId
      x-access: "receptionist"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/RecDoctorDetail'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Not found}
    put:
      tags: ["Receptionist"]
      summary: "Update doctor"
      description: "Only name, specialization, fee and availability can be changed here. Partial: send only what changes."
      operationId: putApiDoctorsId
      x-access: "receptionist"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DoctorEdit'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/RecDoctorResult'}}}}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Not found}
  /api/doctors/{id}/availability:
    patch:
      tags: ["Receptionist"]
      summary: "Set doctor availability"
      description: "Present or absent today. An absent mark lapses by itself the next day; a leave counts as absent everywhere. Does not send a notification (the doctor's own availability endpoint does)."
      operationId: patchApiDoctorsIdAvailability
      x-access: "receptionist"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Availability'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/RecDoctorResult'}}}}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Not found}
  /api/doctors/{id}/status:
    get:
      tags: ["Receptionist"]
      summary: "What deactivating the doctor would leave behind"
      description: "Upcoming confirmed/pending appointments that would still need someone to move or cancel them, and whether the doctor has an active portal login."
      operationId: getApiDoctorsIdStatus
      x-access: "receptionist"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/DoctorStatusImpact'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Not found}
    patch:
      tags: ["Receptionist"]
      summary: "Deactivate or reactivate a doctor"
      description: "Never a delete: appointments, payments and history stay. An INACTIVE doctor cannot be booked in any channel, their portal login is made INACTIVE and their sessions are signed out (reactivating does not re-enable the login), and they are left out of the dashboard and doctors-list present/absent counts. Deactivating needs a reason. Upcoming appointments are not moved or cancelled. Re-sending the current status is a no-op."
      operationId: patchApiDoctorsIdStatus
      x-access: "receptionist"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DoctorStatusChange'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/RecDoctorResult'}}}}
        '400': {description: "Invalid status, or reason missing when deactivating (fields.reason)", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Not found}
  /api/doctors/{id}/login:
    post:
      tags: ["Receptionist"]
      summary: "Invite the doctor to the doctor portal"
      description: "Creates the doctor's portal login (one per doctor) with a temporary password that must be changed at first sign-in. The credentials are returned once. Refused (400) for a deactivated doctor, a doctor who already has a login (reset its password instead), or an email/phone another account already uses (fields.email / fields.phone)."
      operationId: postApiDoctorsIdLogin
      x-access: "receptionist"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DoctorLoginInvite'}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/DoctorLoginCredentials'}}}}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Not found}
  /api/doctors/{id}/login/reset-password:
    post:
      tags: ["Receptionist"]
      summary: "Re-issue an unused doctor-portal invitation"
      description: "Re-issues an invitation the doctor has not used yet: a new temporary password (must be changed at first sign-in), shown once. Refused with 403 once the doctor has signed in; Super Admin resets a used login (POST /api/admin/doctors/{id}/login/reset-password)."
      operationId: postApiDoctorsIdLoginResetPassword
      x-access: "receptionist"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/DoctorLoginCredentials'}}}}
        '400': {description: "No portal login, or the login is not active", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: The doctor has already signed in (only Super Admin can reset a used login)}
        '404': {description: Not found}
  /api/doctors/{id}/schedule:
    get:
      tags: ["Receptionist"]
      summary: "A doctor's weekly working hours"
      description: "Blocks in force today or later (past versions are history). Working hours are a weekly block per day (a lunch break is two blocks). Changes take effect from the next working day (tomorrow, hospital time) and never move or cancel booked appointments; today keeps the old version. The doctor portal has the same screen for the doctor's own hours."
      operationId: getApiDoctorsIdSchedule
      x-access: "receptionist"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/DocScheduleList'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Doctor not found}
    post:
      tags: ["Receptionist"]
      summary: "Add a working-hours block (today when that is safe, otherwise from the next working day; no overlaps)"
      description: "Working hours are a weekly block per day (a lunch break is two blocks). A block for a weekday that is TODAY starts today (`startsToday: true`, `effectiveFrom` = today) when its start time is still ahead, it overlaps no hours already set for that day (including hours that start tomorrow) and nobody is booked or holding a seat at or after its start time today; its slots then open at once and the receptionist, the patient app and the emergency eligibility all read the same effective date. Otherwise, and for any other weekday, it starts tomorrow-based (`startsToday: false`; the message says why, e.g. the start time already passed or patients are already booked later today). Token numbers follow the slots of the day in order, which is why a block is not slipped in before patients already booked later today. The hours must hold at least one whole appointment (400 otherwise). Adding never moves or cancels booked appointments. Editing or removing existing hours still takes effect from the next working day (today keeps the old version). The doctor portal has the same screen for the doctor's own hours."
      operationId: postApiDoctorsIdSchedule
      x-access: "receptionist"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ScheduleSlot'}
      responses:
        '200': {description: Added (id and the date it takes effect), content: {application/json: {schema: {type: object, properties: {ok: {type: boolean}, message: {type: string}, id: {type: integer}, effectiveFrom: {type: string, format: date}}}}}}
        '400': {description: "Invalid day or times, end not after start, duration or capacity out of range, or overlaps another block", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Doctor not found}
  /api/doctors/{id}/schedule/{blockId}:
    patch:
      tags: ["Receptionist"]
      summary: "Edit a working-hours block from the next working day"
      description: "Send any of startTime, endTime, slotMinutes and capacityPerSlot. The change applies from the next working day: today's slots keep the old version and existing bookings are kept. Exception: a block that has not started yet (its effective date is after today, so nobody can have booked into it) on today's weekday starts today under the same conditions as adding it (start time ahead, no overlap, not the replacement of hours that end today, nobody booked or holding a seat at or after its start today); the response then has `startsToday: true`. The result lists bookings left outside the new hours (`outside`, capacity/hours edits) and slots now over capacity (`overbooked`). Hours that overlap another block on the day return 400 (fields.startTime); a block that already ends today cannot be changed (400). Sending nothing that differs is a no-op."
      operationId: patchApiDoctorsIdScheduleBlockId
      x-access: "receptionist"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: blockId, in: path, required: true, schema: {type: integer}, description: "Schedule block id, from the schedule list"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, properties: {startTime: {type: string, example: "09:00", pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'}, endTime: {type: string, example: "13:00", pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'}, slotMinutes: {type: integer, minimum: 5, maximum: 120}, capacityPerSlot: {type: integer, minimum: 1, maximum: 50}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/DocScheduleChange'}}}}
        '400': {description: "Invalid values, overlap, end not after start, or the block already ends today", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Doctor or block not found}
    delete:
      tags: ["Receptionist"]
      summary: "Stop a working-hours block from the next working day (bookings kept)"
      description: "Ends the block today (a version that has not started yet is deleted outright). Appointments already booked on its upcoming days are kept and counted in keptAppointments. Refused (400) when the block already ends today. Use GET .../impact first to show the booking count."
      operationId: deleteApiDoctorsIdScheduleBlockId
      x-access: "receptionist"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: blockId, in: path, required: true, schema: {type: integer}, description: "Schedule block id, from the schedule list"}
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: object, properties: {ok: {type: boolean}, message: {type: string}, removedFrom: {type: string, format: date}, keptAppointments: {type: integer}}}}}}
        '400': {description: The block already ends today, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Doctor or block not found}
  /api/doctors/{id}/schedule/{blockId}/impact:
    get:
      tags: ["Receptionist"]
      summary: "What removing or moving a working-hours block leaves behind"
      description: "Shown before confirming a removal: the date the change takes effect, whether the block already ends today, and the upcoming bookings (from tomorrow) inside the block's hours."
      operationId: getApiDoctorsIdScheduleBlockIdImpact
      x-access: "receptionist"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: blockId, in: path, required: true, schema: {type: integer}, description: "Schedule block id, from the schedule list"}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/ScheduleImpact'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Doctor or block not found}
  /api/doctors/availability:
    patch:
      tags: ["Receptionist"]
      summary: "Bulk availability"
      operationId: patchApiDoctorsAvailability
      x-access: "receptionist"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AvailabilityBulk'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/AvailabilityBulkResult'}}}}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
  /api/tokens:
    get:
      tags: ["Receptionist"]
      summary: "List tokens"
      description: "Tokens of one day (default today). `summary` counts every status and ignores the status filter. Each token lists the moves it can take in `nextStatuses`."
      operationId: getApiTokens
      x-access: "receptionist"
      parameters:
        - {name: date, in: query, schema: {type: string, format: date}, description: Defaults to today}
        - {name: doctorId, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: string, enum: [waiting, called, in_consultation, completed, cancelled, skipped]}}
        - {name: q, in: query, schema: {type: string, maxLength: 80}, description: Token code, patient name or doctor name}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/RecTokenList'}}}}
        '400': {description: Invalid date or status, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
    post:
      tags: ["Receptionist"]
      summary: "Generate token (notifies doctor: TOKEN_GENERATED)"
      description: "Re-issues a queue token. Every booking already gets its token automatically (see POST /api/appointments), so this is only for an appointment whose token was cancelled: it gets its own slot-based number back (T001...). Refused (400) for a cancelled, completed or no-show appointment, an appointment before today, or one that already has a live token (checked under the write lock, so two simultaneous requests get one token). \"Today\" is the hospital's today. Payment is not required."
      operationId: postApiTokens
      x-access: "receptionist"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TokenCreate'}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/TokenResult'}}}}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Appointment not found}
  /api/tokens/eligible:
    get:
      tags: ["Receptionist"]
      summary: "Appointments eligible for a token"
      operationId: getApiTokensEligible
      x-access: "receptionist"
      parameters:
        - {name: date, in: query, schema: {type: string}}
        - {name: doctorId, in: query, schema: {type: string}}
        - {name: q, in: query, schema: {type: string}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/RecTokenEligible'}}}}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
  /api/tokens/{id}:
    get:
      tags: ["Receptionist"]
      summary: "Token detail"
      operationId: getApiTokensId
      x-access: "receptionist"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/RecTokenDetail'}}}}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Not found}
  /api/tokens/{id}/status:
    patch:
      tags: ["Receptionist"]
      summary: "Update token status"
      description: "A token for a later day cannot be called, started or completed (400). Only along the token's `nextStatuses`: waiting to called, skipped or cancelled; called to in_consultation, waiting, skipped or cancelled; in_consultation to completed or cancelled; skipped to waiting, called or cancelled (Recall). Completed and cancelled are final. Completing the token also completes its appointment. Re-sending the current status is a no-op."
      operationId: patchApiTokensIdStatus
      x-access: "receptionist"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TokenStatus'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/TokenResult'}}}}
        '400': {description: "Invalid status, move not allowed, or the token is cancelled", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Not found}
  /api/payments:
    get:
      tags: ["Receptionist"]
      summary: "Hospital payments"
      description: "One row per appointment: paid ones (only PAID payments count as paid; a failed or pending attempt does not) and unpaid pending ones of appointments that are not cancelled. Rows carry the refund state; `refundable` is 0 for fees collected at the front desk. `from`/`to` are appointment dates."
      operationId: getApiPayments
      x-access: "receptionist"
      parameters:
        - {name: q, in: query, schema: {type: string, maxLength: 80}, description: Patient name, transaction id, doctor name or appointment id (contains)}
        - {name: from, in: query, schema: {type: string, format: date}}
        - {name: to, in: query, schema: {type: string, format: date}}
        - {name: doctorId, in: query, schema: {type: string}}
        - {name: paymentStatus, in: query, schema: {type: string, enum: [paid, pending]}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 10}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/RecPaymentList'}}}}
        '400': {description: Invalid date or paymentStatus, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
  /api/refunds:
    get:
      tags: ["Receptionist"]
      summary: "This hospital's refund requests"
      description: "Requests raised by the front desk and what became of them (status, the rejection reason in decisionNote). Admin names are not shown."
      operationId: getApiRefunds
      x-access: "receptionist"
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [PENDING, APPROVED, PROCESSING, COMPLETED, REJECTED]}}
        - {name: q, in: query, schema: {type: string}, description: Refund id, appointment id, patient name or transaction id (contains)}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 15}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/RecRefundList'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
    post:
      tags: ["Receptionist"]
      summary: "Request a refund (Super Admin approves/rejects)"
      description: "For a paid appointment of this hospital. The amount is in rupees with at most 2 decimals (400 otherwise) and cannot exceed what is still refundable on the payment (earlier non-rejected requests count). Above the platform's maker-checker threshold (setting refund_maker_checker_threshold) two other admins must approve. A fee collected at the front desk never reached Gmedic and is refused (the hospital returns it itself), and so is a booking token, which is never refunded. Admins and finance are notified (REFUND_REQUESTED)."
      operationId: postApiRefunds
      x-access: "receptionist"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RefundRequest'}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Ok'}}}}
        '400': {description: "Validation error: no paid payment for the appointment, amount over the paid or still-refundable amount, or fee collected at the desk", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Appointment not found (not this hospital's)}
  /api/hospital:
    get:
      tags: ["Receptionist"]
      summary: "Own hospital profile"
      description: "Includes the hospital's status (ACTIVE, SUSPENDED, ...) with statusReason, logoUrl and about (set by Super Admin), and qrLink (null when the hospital has no active QR code)."
      operationId: getApiHospital
      x-access: "receptionist"
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/RecHospital'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Hospital not found}
    put:
      tags: ["Receptionist"]
      summary: "Update hospital contact details and address"
      description: "The front desk can edit only contact details and address. Name, status, fees, logo and about are managed by Super Admin."
      operationId: putApiHospital
      x-access: "receptionist"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/HospitalProfile'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/RecHospitalResult'}}}}
        '400': {description: "Validation error (fields: phone, email, line1, city, state, pincode)", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Hospital not found}
  /api/hospital/qr.png:
    get:
      tags: ["Receptionist"]
      summary: "Hospital QR (PNG)"
      operationId: getApiHospitalQrPng
      x-access: "receptionist"
      parameters:
        - {name: size, in: query, schema: {type: integer, minimum: 256, maximum: 2048, default: 1024}}
        - {name: download, in: query, schema: {type: string, enum: ['1']}}
      responses:
        '200': {description: OK, content: {image/png: {schema: {type: string, format: binary}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Hospital has no active QR code (every code was revoked), content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/hospital/qr.svg:
    get:
      tags: ["Receptionist"]
      summary: "Hospital QR (SVG)"
      operationId: getApiHospitalQrSvg
      x-access: "receptionist"
      responses:
        '200': {description: OK, content: {image/svg+xml: {schema: {type: string, format: binary}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Hospital has no active QR code (every code was revoked), content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/hospital/qr-poster.svg:
    get:
      tags: ["Receptionist"]
      summary: "QR poster (SVG)"
      operationId: getApiHospitalQrPosterSvg
      x-access: "receptionist"
      parameters:
        - {name: download, in: query, schema: {type: string, enum: ['1']}}
      responses:
        '200': {description: OK, content: {image/svg+xml: {schema: {type: string, format: binary}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Hospital has no active QR code (every code was revoked), content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/profile:
    put:
      tags: ["Receptionist"]
      summary: "Update profile"
      description: "Name (letters, spaces, dots, hyphens and apostrophes) and phone (10 to 15 digits) are both required."
      operationId: putApiProfile
      x-access: "receptionist"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProfileUpdate'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/ProfileResult'}}}}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
  /api/profile/password:
    put:
      tags: ["Receptionist"]
      summary: "Change password"
      operationId: putApiProfilePassword
      x-access: "receptionist"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PasswordChange'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Ok'}}}}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
  /api/notifications:
    get:
      tags: ["Receptionist"]
      summary: "Notifications"
      description: "The signed-in user's stored notifications, newest first (latest 20), with the total unread count. Bookings and reminders are no longer derived from appointments, so each event appears once and read state persists across logins."
      operationId: getApiNotifications
      x-access: "receptionist"
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/NotificationList'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
  /api/notifications/read:
    post:
      tags: ["Receptionist"]
      summary: "Mark notifications read"
      operationId: postApiNotificationsRead
      x-access: "receptionist"
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/NotificationsReadResult'}}}}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
  /api/notifications/{id}/read:
    post:
      tags: ["Receptionist"]
      summary: "Mark one notification read"
      description: "Only the user's own notifications. The id is as returned by the list (n-12) or the bare number."
      operationId: postApiNotificationsIdRead
      x-access: "receptionist"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/NotificationsReadResult'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Not one of the user's notifications}
  /api/support:
    get:
      tags: ["Receptionist"]
      summary: "Front-desk tickets of my hospital"
      description: "Every ticket raised by a receptionist of the caller's hospital, so colleagues can follow up and a ticket outlives the person who raised it (`shared: true`). `mine=1` limits the list to the caller's own tickets. Newest activity first."
      operationId: getApiSupport
      x-access: "support.view_own"
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [OPEN, IN_PROGRESS, RESOLVED, CLOSED]}}
        - {name: q, in: query, schema: {type: string}, description: Subject or ticket number (contains), or an appointment id (exact)}
        - {name: mine, in: query, schema: {type: string, enum: ['1']}, description: Only tickets the caller raised}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/RecTicketList'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
    post:
      tags: ["Receptionist"]
      summary: "Raise a ticket"
      description: "Optionally about an appointment of this hospital (appointmentId; the patient is stored too). Priority may be LOW, MEDIUM or HIGH (default MEDIUM; anything else is treated as MEDIUM). Support admins are notified."
      operationId: postApiSupport
      x-access: "support.create"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TicketCreate'}
      responses:
        '200': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/TicketCreated'}}}}
        '400': {description: "Validation error (fields: category, subject, description, appointmentId)", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
  /api/support/{id}:
    get:
      tags: ["Receptionist"]
      summary: "Ticket with conversation (404 if not a front-desk ticket of my hospital)"
      operationId: getApiSupportId
      x-access: "support.view_own"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/RecTicketDetail'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Not found}
  /api/support/{id}/messages:
    post:
      tags: ["Receptionist"]
      summary: "Reply on a front-desk ticket"
      description: "Any front-desk colleague of the hospital may reply. A reply reopens a RESOLVED ticket; a CLOSED ticket cannot be replied to."
      operationId: postApiSupportIdMessages
      x-access: "support.reply_own"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Message'}
      responses:
        '200': {description: Reply sent, content: {application/json: {schema: {$ref: '#/components/schemas/TicketReply'}}}}
        '400': {description: "Empty or over-long message, or the ticket is closed", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Not found}
  /api/support/{id}/close:
    post:
      tags: ["Receptionist"]
      summary: "Close a front-desk ticket"
      description: "Closing is final (a new ticket can always be opened). Any front-desk colleague of the hospital may close it. Adds a 'Closed by' message to the conversation and notifies the assignee (or the support admins)."
      operationId: postApiSupportIdClose
      x-access: "support.reply_own"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TicketClose'}
      responses:
        '200': {description: Closed, content: {application/json: {schema: {$ref: '#/components/schemas/TicketCloseResult'}}}}
        '400': {description: The ticket is already closed, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Not found}
  /api/doctor/dashboard:
    get:
      tags: ["Doctor: Dashboard"]
      summary: "Dashboard summary (today's stats, queue and appointments)"
      operationId: getApiDoctorDashboard
      x-access: "doctor"
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/DoctorDashboard'}}}}
        '401': {description: Not signed in / session ended}
        '404': {description: "Doctor record not found", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/doctor/dashboard/stats:
    get:
      tags: ["Doctor: Dashboard"]
      summary: "Today's stat tiles"
      operationId: getApiDoctorDashboardStats
      x-access: "doctor"
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/DoctorDashboardStats'}}}}
        '401': {description: Not signed in / session ended}
        '404': {description: "Doctor record not found", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/doctor/dashboard/queue:
    get:
      tags: ["Doctor: Dashboard"]
      summary: "Current and next tokens"
      operationId: getApiDoctorDashboardQueue
      x-access: "doctor"
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/DoctorDashboardQueue'}}}}
        '401': {description: Not signed in / session ended}
        '404': {description: "Doctor record not found", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/doctor/dashboard/appointments:
    get:
      tags: ["Doctor: Dashboard"]
      summary: "Today's appointments"
      operationId: getApiDoctorDashboardAppointments
      x-access: "doctor"
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/DoctorDashboardAppointments'}}}}
        '401': {description: Not signed in / session ended}
        '404': {description: "Doctor record not found", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/doctor/earnings:
    get:
      tags: ["Doctor"]
      summary: "My earnings (paid appointments in a date range)"
      description: "Cancelled appointments are left out (their fee is refunded); the same rule applies to the dashboard earnings and the analytics totals. Without from/to the range ends today at the hospital."
      operationId: getApiDoctorEarnings
      x-access: "doctor"
      parameters:
        - {name: from, in: query, schema: {type: string, format: date}, description: Defaults to 29 days before `to`}
        - {name: to, in: query, schema: {type: string, format: date}, description: Defaults to today}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/DoctorEarnings'}}}}
        '400': {description: "Invalid dates, from after to, or a range over one year", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
  /api/doctor/analytics:
    get:
      tags: ["Doctor: Dashboard"]
      summary: "My analytics summary (appointments, patients, earnings by day)"
      operationId: getApiDoctorAnalytics
      x-access: "doctor"
      parameters:
        - {name: from, in: query, schema: {type: string, format: date}, description: Defaults to 13 days before `to`}
        - {name: to, in: query, schema: {type: string, format: date}, description: Defaults to today}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/DoctorAnalytics'}}}}
        '400': {description: "Invalid dates, from after to, or a range over one year", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
  /api/doctor/appointments:
    get:
      tags: ["Doctor"]
      summary: "My appointments (paged on the server)"
      description: "`counts` are totals over every page for the other filters (the status filter is left out), so tabs always show totals. A no-show is a flag on a confirmed appointment: `status=confirmed` leaves no-shows out and `status=no_show` lists them. `upcoming` counts my confirmed or pending appointments from today on, whatever the filters."
      operationId: getApiDoctorAppointments
      x-access: "doctor"
      parameters:
        - {name: date, in: query, schema: {type: string, format: date}}
        - {name: status, in: query, schema: {type: string, enum: [confirmed, pending, completed, cancelled, no_show]}}
        - {name: paymentStatus, in: query, schema: {type: string, enum: [paid, pending]}}
        - {name: q, in: query, schema: {type: string}, description: "Patient name, appointment ID (partial), the patient ID (exact), or 4+ digits of the patient's mobile number in any format"}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/DocAppointmentList'}}}}
        '401': {description: Not signed in / session ended}
  /api/doctor/appointments/{id}:
    get:
      tags: ["Doctor"]
      summary: "Appointment detail with consultation notes and status history (404 if it is not mine)"
      description: "`canReopen` / `reopenUntil` tell whether a completed appointment can still be reopened (same day, within 10 minutes of completing). `notes` are the saved consultation note versions, newest first."
      operationId: getApiDoctorAppointmentsId
      x-access: "doctor"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/DocAppointmentDetail'}}}}
        '401': {description: Not signed in / session ended}
        '404': {description: Not found}
  /api/doctor/appointments/{id}/cancel:
    get:
      tags: ["Doctor"]
      summary: "What cancelling this appointment would refund, and why it can't be cancelled if so"
      description: "Amounts are in rupees. When the doctor cancels, everything the patient paid online is refunded; money collected at the front desk is returned by the front desk (refund 0)."
      operationId: getApiDoctorAppointmentsIdCancel
      x-access: "doctor"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/DocCancelQuote'}}}}
        '401': {description: Not signed in / session ended}
        '404': {description: Not found}
    post:
      tags: ["Doctor"]
      summary: "Cancel the appointment with a reason"
      description: "Full refund of the online payment, the queue token is withdrawn, and the patient, front desk and doctor are notified. Refused (422) when the appointment is already cancelled or completed, the patient is with the doctor, or it is marked as a no-show."
      operationId: postApiDoctorAppointmentsIdCancel
      x-access: "doctor"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DocAppointmentCancel'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/DocAppointmentResult'}}}}
        '400': {description: "Reason missing (fields.reason)", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '404': {description: Not found}
        '422': {description: "Cannot be cancelled (already cancelled, completed, in consultation, or a no-show)", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/doctor/appointments/{id}/status:
    patch:
      tags: ["Doctor"]
      summary: "Mark an appointment completed (cancelling is forwarded to the cancel action)"
      description: "`completed` is allowed only on or after the appointment date, never for a no-show or an appointment that is already completed or cancelled; it can be undone for 10 minutes with the reopen action. `{status: cancelled, reason}` is still accepted and behaves exactly like POST .../cancel (including its 422)."
      operationId: patchApiDoctorAppointmentsIdStatus
      x-access: "doctor"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DoctorAppointmentStatus'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/DocAppointmentResult'}}}}
        '400': {description: "Not allowed in the current state (before the appointment date, no-show, already completed or cancelled) or reason missing when cancelling", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '404': {description: Not found}
        '422': {description: "Only when {status: cancelled} is sent and the cancel is refused (same rules as POST .../cancel)", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/doctor/appointments/{id}/reopen:
    post:
      tags: ["Doctor"]
      summary: "Undo a completion pressed by mistake"
      description: "Only the doctor of the appointment, on the day, within 10 minutes of completing. The appointment goes back to the status it had before (confirmed, or pending for an unpaid one) and its token back to in consultation; refused (400) while another token of the doctor is in consultation."
      operationId: postApiDoctorAppointmentsIdReopen
      x-access: "doctor"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/DocAppointmentResult'}}}}
        '401': {description: Not signed in / session ended}
        '404': {description: Not found}
        '409': {description: "Not completed, the undo window has passed, or the appointment changed meanwhile", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/doctor/appointments/{id}/no-show:
    post:
      tags: ["Doctor"]
      summary: "Mark the patient as a no-show"
      description: "Same rules as the front desk: a confirmed appointment, on the day, once the platform no-show grace period (no_show_grace_minutes) after the slot start has passed, and not while the patient is in consultation. The waiting token is cancelled; nothing is refunded."
      operationId: postApiDoctorAppointmentsIdNoShow
      x-access: "doctor"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/DocAppointmentResult'}}}}
        '401': {description: Not signed in / session ended}
        '404': {description: Not found}
        '409': {description: "Already a no-show, not confirmed, not today, grace period not over yet, patient in consultation, or the appointment changed meanwhile", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    delete:
      tags: ["Doctor"]
      summary: "Undo a no-show (same day only)"
      description: "The patient's queue token is restored under the appointment's own token number."
      operationId: deleteApiDoctorAppointmentsIdNoShow
      x-access: "doctor"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/DocAppointmentResult'}}}}
        '401': {description: Not signed in / session ended}
        '404': {description: Not found}
        '409': {description: "Not marked as a no-show, or the appointment is not today", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/doctor/appointments/{id}/notes:
    get:
      tags: ["Doctor"]
      summary: "Consultation note versions for the appointment, newest first"
      operationId: getApiDoctorAppointmentsIdNotes
      x-access: "doctor"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/DocNotesList'}}}}
        '401': {description: Not signed in / session ended}
        '404': {description: Not found}
    post:
      tags: ["Doctor"]
      summary: "Save consultation notes as a new version"
      description: "Notes are append-only: each save adds a version and old versions are never changed. Saving identical text is a no-op (`message` says there is nothing to save). Not allowed before the appointment day or for a cancelled appointment."
      operationId: postApiDoctorAppointmentsIdNotes
      x-access: "doctor"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DocNoteWrite'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/DocNotesSaved'}}}}
        '400': {description: "Nothing written, a field over its limit (fields.diagnosis / notes / prescription), appointment cancelled, or before the appointment day", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '404': {description: Not found}
  /api/doctor/availability:
    patch:
      tags: ["Doctor"]
      summary: "Set my availability (notifies receptionists)"
      description: "Absent applies to today only and lapses by itself the next day; an active leave always shows as absent."
      operationId: patchApiDoctorAvailability
      x-access: "doctor"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Availability'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/RecDoctorResult'}}}}
        '400': {description: "Availability is not present or absent", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
  /api/doctor/leaves:
    get:
      tags: ["Doctor"]
      summary: "My leaves"
      description: "Current and upcoming leaves first, then past ones. Withdrawn leaves are not listed. `bookedAppointments` counts confirmed or pending appointments still to happen inside the leave."
      operationId: getApiDoctorLeaves
      x-access: "doctor"
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/LeaveList'}}}}
        '401': {description: Not signed in / session ended}
    post:
      tags: ["Doctor"]
      summary: "Add a leave"
      description: "A leave can't start in the past or overlap another leave. When appointments are already booked on those days the call is refused with 409 and the list in `fields.booked`; repeat it with `confirmBooked: true` to keep them (the front desk is asked to move them) or with `confirmBooked: true, cancelBooked: true` to cancel them with a full refund. The front desk is notified."
      operationId: postApiDoctorLeaves
      x-access: "doctor"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LeaveCreate'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/LeaveCreated'}}}}
        '400': {description: "Invalid dates, start in the past, end before start, reason over 200 characters, or the leave overlaps another one", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '409': {description: "Appointments are booked on the added days and confirmBooked was not sent", content: {application/json: {schema: {$ref: '#/components/schemas/LeaveBookedConflict'}}}}
  /api/doctor/leaves/impact:
    get:
      tags: ["Doctor"]
      summary: "Bookings a new leave (or a change to leave `id`) would run into"
      description: "Preview shown before the doctor confirms. For a change to an existing leave only the days it adds are checked; a leave that has already started keeps its start date."
      operationId: getApiDoctorLeavesImpact
      x-access: "doctor"
      parameters:
        - {name: startDate, in: query, schema: {type: string, format: date}, description: Required unless `id` names a leave that has already started}
        - {name: endDate, in: query, required: true, schema: {type: string, format: date}}
        - {name: id, in: query, schema: {type: integer}, description: An existing leave being changed}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/LeaveImpact'}}}}
        '400': {description: "Invalid dates or a leave that ends in the past", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
  /api/doctor/leaves/{id}:
    patch:
      tags: ["Doctor"]
      summary: "Change a leave's dates or reason"
      description: "A leave that has started keeps its start date (400 if sent different) and can be shortened (end today) or extended; a leave that is over can't be changed. The end date can't be in the past. Extending onto booked days works like POST /api/doctor/leaves: 409 with `fields.booked` until `confirmBooked` is sent (optionally `cancelBooked`). Sending no changes returns `No changes to save.` The front desk is notified."
      operationId: patchApiDoctorLeavesId
      x-access: "doctor"
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LeaveUpdate'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/LeaveChangeResult'}}}}
        '400': {description: "Invalid dates, leave is over, start of a started leave changed, or the new dates overlap another leave", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '404': {description: "Leave not found (or withdrawn)"}
        '409': {description: "Appointments are booked on the added days and confirmBooked was not sent", content: {application/json: {schema: {$ref: '#/components/schemas/LeaveBookedConflict'}}}}
    delete:
      tags: ["Doctor"]
      summary: "Withdraw a leave that has not started"
      description: "A soft delete: the leave is kept as history but no longer counts, so the doctor can be booked on those days again. Refused (400) once the leave has started; change its end date to today instead. The front desk is notified."
      operationId: deleteApiDoctorLeavesId
      x-access: "doctor"
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Ok'}}}}
        '400': {description: "Leave has started or is over", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '404': {description: "Leave not found (or already withdrawn)"}
  /api/doctor/queue:
    get:
      tags: ["Doctor"]
      summary: "My queue for a date (default today)"
      description: "`editable` is true only for today's queue; past and future days are read-only and every queue action on them is refused."
      operationId: getApiDoctorQueue
      x-access: "doctor"
      parameters:
        - {name: date, in: query, schema: {type: string, format: date}, description: Defaults to today}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/DocQueue'}}}}
        '400': {description: "Invalid date", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
  /api/doctor/queue/call-next:
    post:
      tags: ["Doctor"]
      summary: "Call the next waiting patient (today only)"
      operationId: postApiDoctorQueueCallNext
      x-access: "doctor"
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/QueueCallNext'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/DocTokenResult'}}}}
        '400': {description: "Invalid date, not today's queue, or nobody is waiting", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
  /api/doctor/queue/{id}/start:
    post:
      tags: ["Doctor"]
      summary: "Start consultation (today's queue only)"
      description: "One patient at a time: 400 while another token of this doctor is still in consultation (also for POST /api/doctor/queue/{id}/reopen). 'Today' is the hospital's today."
      operationId: postApiDoctorQueueIdStart
      x-access: "doctor"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/DocTokenResult'}}}}
        '400': {description: "Not today's queue, or the token can't move to in consultation from its current status", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '404': {description: "Token not found (or not mine)"}
  /api/doctor/queue/{id}/complete:
    post:
      tags: ["Doctor"]
      summary: "Complete consultation (today's queue only)"
      description: "`undoMinutes` is how long the completion can be taken back with POST /api/doctor/queue/{id}/reopen."
      operationId: postApiDoctorQueueIdComplete
      x-access: "doctor"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/DocTokenResult'}}}}
        '400': {description: "Not today's queue, or the token can't be completed from its current status", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '404': {description: "Token not found (or not mine)"}
  /api/doctor/queue/{id}/skip:
    post:
      tags: ["Doctor"]
      summary: "Skip token (today's queue only)"
      operationId: postApiDoctorQueueIdSkip
      x-access: "doctor"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/DocTokenResult'}}}}
        '400': {description: "Not today's queue, or the token can't be skipped from its current status", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '404': {description: "Token not found (or not mine)"}
  /api/doctor/queue/{id}/recall:
    post:
      tags: ["Doctor"]
      summary: "Call a skipped patient back (today's queue only)"
      operationId: postApiDoctorQueueIdRecall
      x-access: "doctor"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/DocTokenResult'}}}}
        '400': {description: "Not today's queue, or the token can't be called from its current status", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '404': {description: "Token not found (or not mine)"}
  /api/doctor/queue/{id}/reopen:
    post:
      tags: ["Doctor"]
      summary: "Undo Complete pressed by mistake"
      description: "Same day, within 10 minutes of completing. The token goes back to in consultation together with its appointment. Works on a completed token only."
      operationId: postApiDoctorQueueIdReopen
      x-access: "doctor"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/DocTokenResult'}}}}
        '400': {description: "The token is not completed", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '404': {description: "Token not found (or not mine)"}
        '409': {description: "The undo window has passed, or the appointment changed meanwhile", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/doctor/schedule:
    get:
      tags: ["Doctor"]
      summary: "My weekly working hours"
      description: "Blocks in force today or later; versions that have already ended are history and not listed."
      operationId: getApiDoctorSchedule
      x-access: "doctor"
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/DocScheduleList'}}}}
        '401': {description: Not signed in / session ended}
    post:
      tags: ["Doctor"]
      summary: "Add a working-hours block (today when that is safe, otherwise from the next working day; no overlaps)"
      operationId: postApiDoctorSchedule
      x-access: "doctor"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ScheduleSlot'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/DocScheduleCreated'}}}}
        '400': {description: "Invalid day, times, slot length or capacity, or the block overlaps another one on that day", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
  /api/doctor/schedule/{id}:
    patch:
      tags: ["Doctor"]
      summary: "Edit a block's hours, slot length or patients per slot from the next working day"
      description: "Send at least one field (an empty body is a 400 \"Nothing to change\"). `slotMinutes` must be a whole number of 5 to 120, also when creating a block. Takes effect from the next working day (tomorrow, hospital time zone): today's slots and existing bookings are unchanged. Bookings that fall outside the new hours are kept and counted in `outside`; upcoming slots that already hold more bookings than the new capacity are kept and listed in `overbooked`. Refused (400) when the block already ends today, when the new hours overlap another block on that day (fields.startTime) or end before they start (fields.endTime). Changing nothing returns `No changes to save.`"
      operationId: patchApiDoctorScheduleId
      x-access: "doctor"
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DocScheduleEdit'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/DocScheduleChange'}}}}
        '400': {description: "Invalid values, hours overlap another block, or the block already ends today", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '404': {description: "Schedule block not found"}
    delete:
      tags: ["Doctor"]
      summary: "Stop a working-hours block from the next working day (bookings kept)"
      description: "A block that is not in force yet, or one added today that nobody has booked or held a seat in on any date, is deleted outright; otherwise it ends today and stays visible as ending (`endsToday`) until tomorrow. Appointments already booked in its hours are kept and counted in `keptAppointments`. Refused (400) when the block already ends today. Use the impact endpoint to show the count before confirming."
      operationId: deleteApiDoctorScheduleId
      x-access: "doctor"
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/DocScheduleRemoved'}}}}
        '400': {description: "The block already ends today", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '404': {description: "Schedule block not found"}
  /api/doctor/schedule/{id}/impact:
    get:
      tags: ["Doctor"]
      summary: "What removing a working-hours block would leave behind"
      description: "Shown before the doctor confirms a removal: the date it would stop from, whether it already ends today, and the upcoming bookings inside its hours that would stay."
      operationId: getApiDoctorScheduleIdImpact
      x-access: "doctor"
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/ScheduleImpact'}}}}
        '401': {description: Not signed in / session ended}
        '404': {description: "Schedule block not found"}
  /api/doctor/patients:
    get:
      tags: ["Doctor"]
      summary: "Patients who have booked with me (paged)"
      description: "`summary` counts every matching patient, not just the current page."
      operationId: getApiDoctorPatients
      x-access: "doctor"
      parameters:
        - {name: q, in: query, schema: {type: string}, description: "Patient name, exact patient or appointment ID, or 4+ digits of the mobile number"}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/DocPatientList'}}}}
        '401': {description: Not signed in / session ended}
  /api/doctor/patients/{id}:
    get:
      tags: ["Doctor"]
      summary: "Patient detail with gender, date of birth and age (404 if not my patient)"
      operationId: getApiDoctorPatientsId
      x-access: "doctor"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/DocPatientDetail'}}}}
        '401': {description: Not signed in / session ended}
        '404': {description: "Patient not found, or has no appointments with me"}
  /api/doctor/profile:
    get:
      tags: ["Doctor"]
      summary: "My profile"
      operationId: getApiDoctorProfile
      x-access: "doctor"
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/DocProfile'}}}}
        '401': {description: Not signed in / session ended}
        '404': {description: "Doctor profile not found"}
    put:
      tags: ["Doctor"]
      summary: "Update my bio, languages and experience"
      description: "Only the fields sent are changed. `yearsExperience` of null or an empty string clears it (it is never stored as 0); otherwise it must be whole years from 0 to 70."
      operationId: putApiDoctorProfile
      x-access: "doctor"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DoctorProfileUpdate'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/DoctorProfileResult'}}}}
        '400': {description: "Field errors in `fields` (bio, languages, yearsExperience)", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
  /api/doctor/profile/photo:
    post:
      tags: ["Doctor"]
      summary: "Upload my profile photo (multipart `photo`; PNG or JPEG up to 3 MB)"
      description: "Shown to patients right away, like a photo set by Super Admin. PNG, JPEG and WebP up to 3 MB. A new photo replaces the old one."
      operationId: postApiDoctorProfilePhoto
      x-access: "doctor"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {$ref: '#/components/schemas/DocPhotoUpload'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/DoctorProfileResult'}}}}
        '400': {description: "No usable file (fields.photo), wrong type or over 3 MB", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '404': {description: "Doctor profile not found"}
    delete:
      tags: ["Doctor"]
      summary: "Remove my profile photo"
      operationId: deleteApiDoctorProfilePhoto
      x-access: "doctor"
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/DoctorProfileResult'}}}}
        '400': {description: "There is no photo to remove", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '404': {description: "Doctor profile not found"}
  /api/doctor/profile/password:
    put:
      tags: ["Doctor"]
      summary: "Change password"
      operationId: putApiDoctorProfilePassword
      x-access: "doctor"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PasswordChange'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Ok'}}}}
        '400': {description: "Validation error", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
  /api/doctor/notification-preferences:
    get:
      tags: ["Doctor"]
      summary: "My notification preferences"
      description: "Which notices reach the signed-in doctor's bell. Each preference is on unless the doctor turned it off. `alwaysOn` lists notices that can't be switched off (cancelled or moved appointments)."
      operationId: getApiDoctorNotificationPreferences
      x-access: "doctor"
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/NotificationPreferences'}}}}
        '401': {description: Not signed in / session ended}
    put:
      tags: ["Doctor"]
      summary: "Turn notification kinds on or off"
      description: "Only the keys sent change. Keys: new_appointments (NEW_APPOINTMENT), queue_tokens (TOKEN_GENERATED), reminders (APPOINTMENT_REMINDER), support (SUPPORT_TICKET_UPDATED, SUPPORT_TICKET_RESOLVED). A turned-off notice is not created and is logged as SKIPPED in the notification log. Cancelled and rescheduled appointments always reach the doctor."
      operationId: putApiDoctorNotificationPreferences
      x-access: "doctor"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [preferences]
              properties:
                preferences:
                  type: object
                  additionalProperties: {type: boolean}
                  example: {queue_tokens: false}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/NotificationPreferences'}}}}
        '400': {description: "Unknown key or a value that isn't true/false", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
