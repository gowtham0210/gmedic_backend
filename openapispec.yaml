        '400': {description: "Validation error (fields), unknown hospital, or hospital suspended / offboarded", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
  /api/admin/qr/analytics:
    get:
      tags: ["Admin: QR"]
      summary: "QR scan analytics"
      operationId: getApiAdminQrAnalytics
      x-access: "qr.view"
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/QrAnalytics'}}}}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
  /api/admin/qr/{id}:
    patch:
      tags: ["Admin: QR"]
      summary: "Rename a QR code's desk label and/or move it to another branch"
      description: "Active codes only (400 for a revoked one). The link and printed poster stay the same; later scans are counted against the new branch. branchId must be an active branch of the code's hospital; null or blank removes the branch; re-sending the current branch is a no-op. Nothing to change is a 200 'No changes to save.'"
      operationId: patchApiAdminQrId
      x-access: "qr.manage"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/QrUpdate'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Ok'}}}}
        '400': {description: Revoked code or validation error (fields), content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Not found}
  /api/admin/qr/{id}/revoke:
    post:
      tags: ["Admin: QR"]
      summary: "Revoke QR code"
      description: "A reason is required (fields.reason). Only an ACTIVE code can be revoked; revoking an already revoked one (including two admins revoking at once) is a 400 and keeps the first reason"
      operationId: postApiAdminQrIdRevoke
      x-access: "qr.manage"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/QrRevoke'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Ok'}}}}
        '400': {description: "Reason missing (fields.reason) or the code is already revoked", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Not found}
  /api/admin/qr/{id}/reissue:
    post:
      tags: ["Admin: QR"]
      summary: "Reissue QR code"
      description: "One transaction: a replacement code (same hospital, branch and desk label, new key) is created and the old one is revoked with reason 'Reissued', or neither happens. Only an ACTIVE code can be reissued (400 otherwise; generate a new one instead), and the hospital must not be SUSPENDED or OFFBOARDED (400 on fields.hospitalId). The response id is the new code"
      operationId: postApiAdminQrIdReissue
      x-access: "qr.manage"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '201': {description: Created (id is the replacement QR code id), content: {application/json: {schema: {$ref: '#/components/schemas/Ok'}}}}
        '400': {description: "Code not active / already reissued, or hospital suspended or offboarded", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Not found}
  /api/admin/qr/{id}/qr.png:
    get:
      tags: ["Admin: QR"]
      summary: "QR code image (PNG) for an ACTIVE code; 400 if revoked"
      operationId: getApiAdminQrIdQrPng
      x-access: "qr.view"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: size, in: query, schema: {type: integer}}
        - {name: download, in: query, schema: {type: string, enum: [1]}}
      responses:
        '200': {description: OK, content: {image/png: {schema: {type: string, format: binary}}}}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Not found}
  /api/admin/qr/{id}/poster.svg:
    get:
      tags: ["Admin: QR"]
      summary: "Skip the Queue poster (SVG) encoding this code's link; 400 if revoked"
      operationId: getApiAdminQrIdPosterSvg
      x-access: "qr.view"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: download, in: query, schema: {type: string, enum: [1]}}
      responses:
        '200': {description: OK, content: {image/svg+xml: {schema: {type: string, format: binary}}}}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Not found}
  /api/admin/appointments:
    get:
      tags: ["Admin: Appointments"]
      summary: "List appointments"
      description: "Platform-wide, newest first, a page at a time. `counts` are totals over every page for the same filters with the status filter left out (for summary cards). The `id` parameter is a free-text search: patient name, appointment ID, doctor name, the patient ID exactly, or (4+ digits) the patient's mobile in any format."
      operationId: getApiAdminAppointments
      x-access: "appointments.view"
      parameters:
        - {name: id, in: query, description: "Free-text search (see the operation description)", schema: {type: string}}
        - {name: mobile, in: query, description: "Exact patient mobile number", schema: {type: string}}
        - {name: hospitalId, in: query, schema: {type: string}}
        - {name: doctorId, in: query, schema: {type: string}}
        - {name: date, in: query, schema: {type: string, format: date}}
        - {name: from, in: query, schema: {type: string, format: date}}
        - {name: to, in: query, schema: {type: string, format: date}}
        - {name: status, in: query, description: "no_show is a flag on a confirmed appointment, so confirmed leaves no-shows out", schema: {type: string, enum: [pending, confirmed, completed, cancelled, no_show]}}
        - {name: paymentStatus, in: query, schema: {type: string, enum: [paid, pending]}}
        - {name: page, in: query, schema: {type: integer}}
        - {name: pageSize, in: query, description: "1-100, default 15", schema: {type: integer}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/AppointmentList'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
  /api/admin/appointments/{id}:
    get:
      tags: ["Admin: Appointments"]
      summary: "Appointment detail with status history and refunds"
      operationId: getApiAdminAppointmentsId
      x-access: "appointments.view"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/AppointmentDetail'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Not found}
  /api/admin/appointments/{id}/cancel:
    get:
      tags: ["Admin: Appointments"]
      summary: "Preview an admin cancellation"
      description: "What cancelling would do, for the confirm dialog: why it is blocked (already cancelled, completed, in consultation, or a no-show; otherwise null), what the hospital's cancellation policy would refund Gmedic refunds nothing: the booking token is non-refundable, so refundPaise and fullRefundPaise are always 0 and `note` says so (and whether the consultation fee was paid at the hospital, which the hospital returns itself). Amounts are in paise."
      operationId: getApiAdminAppointmentsIdCancel
      x-access: "appointments.cancel"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: object, properties: {quote: {$ref: '#/components/schemas/AdminCancelQuote'}}}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Not found}
    post:
      tags: ["Admin: Appointments"]
      summary: "Cancel an appointment (escalation)"
      description: "Super Admin only. For an appointment nobody else can handle, for example after a hospital is offboarded or a doctor is rejected. Same cancel path as the patient app and the front desk: stores the reason, frees the seat, withdraws the live queue token, refunds, notifies and writes an audit entry (APPOINTMENT_CANCELLED_BY_ADMIN). Nothing is refunded: the booking token is non-refundable, and a consultation fee paid at the hospital is returned by the hospital. There is no reschedule or edit."
      operationId: postApiAdminAppointmentsIdCancel
      x-access: "appointments.cancel"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminAppointmentCancel'}
      responses:
        '200': {description: Cancelled, content: {application/json: {schema: {$ref: '#/components/schemas/AdminAppointmentCancelResult'}}}}
        '400': {description: "Validation error: reason missing or over 300 characters (fields.reason)", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Not found}
        '422': {description: "Cannot be cancelled: already cancelled, completed, in consultation, or marked no-show", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/admin/patients/search:
    get:
      tags: ["Admin: Patients"]
      summary: "Search patients"
      description: "Three ways to search. `mobile`, `patientId` or `appointmentId` (checked in that order of precedence: patientId, then mobile, then appointmentId) looks up exactly one patient and returns at most one item with no paging fields. `q` (2+ characters, else an empty page) matches name or mobile, is paged (pageSize up to 50, default 10, ordered by name) and returns total, page, pageSize and pages. LIKE wildcards in `q` are matched literally."
      operationId: getApiAdminPatientsSearch
      x-access: "patients.view"
      parameters:
        - {name: q, in: query, description: "Name or mobile fragment, 2+ characters", schema: {type: string}}
        - {name: mobile, in: query, description: "Exact mobile number", schema: {type: string}}
        - {name: patientId, in: query, schema: {type: string}}
        - {name: appointmentId, in: query, description: "Finds the patient the appointment belongs to", schema: {type: string}}
        - {name: page, in: query, description: "Only with q", schema: {type: integer}}
        - {name: pageSize, in: query, description: "Only with q; 1-50, default 10", schema: {type: integer}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/PatientSearch'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
  /api/admin/patients/{id}:
    get:
      tags: ["Admin: Patients"]
      summary: "Patient detail"
      description: "The patient profile with the app account (null for a patient added at a hospital front desk), the other profiles on the same account, consent records, the hospitals the patient is currently linked to (removed links are left out) and the latest 25 appointments, payments and refunds."
      operationId: getApiAdminPatientsId
      x-access: "patients.view"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/PatientDetail'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Not found}
  /api/admin/patients/{id}/block:
    post:
      tags: ["Admin: Patients"]
      summary: "Block a patient's app account"
      description: "Super Admin only. Acts on the Gmedic app account the patient signs in with (which can hold several family profiles): the account is deactivated, its sessions end, held slots are released and it cannot sign in until unblocked. Audited (PATIENT_BLOCKED). 400 when the patient's data was erased, has no app account (added at a front desk), or the account is already blocked."
      operationId: postApiAdminPatientsIdBlock
      x-access: "patients.manage"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PatientBlock'}
      responses:
        '200': {description: Blocked, content: {application/json: {schema: {$ref: '#/components/schemas/PatientAccountResult'}}}}
        '400': {description: "Validation error: reason missing (fields.reason), no app account, erased patient or already blocked", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Not found}
  /api/admin/patients/{id}/unblock:
    post:
      tags: ["Admin: Patients"]
      summary: "Unblock a patient's app account"
      description: "Super Admin only. Reactivates the account so the patient can sign in again. Audited (PATIENT_UNBLOCKED). No request body. 400 when the patient has no app account, was erased, or the account is not blocked."
      operationId: postApiAdminPatientsIdUnblock
      x-access: "patients.manage"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Unblocked, content: {application/json: {schema: {$ref: '#/components/schemas/PatientAccountResult'}}}}
        '400': {description: "No app account, erased patient or account not blocked", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Not found}
  /api/admin/patients/{id}/erase:
    post:
      tags: ["Admin: Patients"]
      summary: "Erase a patient's personal data"
      description: "Super Admin only, irreversible. Nothing is hard-deleted: the app's own delete-account anonymisation runs on the account and every profile on it (names, mobile, email and date of birth removed; sign-ins, one-time codes and push tokens end), consents are withdrawn, and hospitals keep visit and payment records without the patient's details. Upcoming confirmed appointments of every profile on the account (whoever booked them) are cancelled first and refunded by the usual policy; any that cannot be cancelled (for example the visit is under way) stay and are listed in notCancelled. `confirm` must equal the patient ID. Audited (PATIENT_ERASED)."
      operationId: postApiAdminPatientsIdErase
      x-access: "patients.manage"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PatientErase'}
      responses:
        '200': {description: Erased, content: {application/json: {schema: {$ref: '#/components/schemas/PatientEraseResult'}}}}
        '400': {description: "Validation error: confirm does not match the patient ID (fields.confirm), no app account, or already erased", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Not found}
  /api/admin/payments:
    get:
      tags: ["Admin: Finance"]
      summary: "List payments"
      description: "Money movement, newest first: real payment attempts only (a pending appointment with no gateway attempt has no row). `from`/`to` are PAYMENT dates (paid date, or created date if it was never paid), not appointment dates. `q` matches patient name, transaction ID, doctor name, payment ID or appointment ID. `status` is case-insensitive. The summary covers every page of the filtered result."
      operationId: getApiAdminPayments
      x-access: "payments.view"
      parameters:
        - {name: hospitalId, in: query, schema: {type: string}}
        - {name: doctorId, in: query, schema: {type: string}}
        - {name: from, in: query, description: "Payment date, inclusive", schema: {type: string, format: date}}
        - {name: to, in: query, description: "Payment date, inclusive", schema: {type: string, format: date}}
        - {name: status, in: query, schema: {type: string, enum: [PAID, PENDING, FAILED]}}
        - {name: purpose, in: query, description: "TOKEN: booking tokens paid in the app (Gmedic's revenue); CONSULTATION: fees collected at hospitals", schema: {type: string, enum: [TOKEN, CONSULTATION]}}
        - {name: q, in: query, schema: {type: string}}
        - {name: page, in: query, schema: {type: integer}}
        - {name: pageSize, in: query, description: "1-100, default 15", schema: {type: integer}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/PaymentList'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
  /api/admin/payments/{id}:
    get:
      tags: ["Admin: Finance"]
      summary: "Payment detail"
      description: "One payment with its money breakdown (consultation fee, convenience fee, tax), how much has been refunded and is still refundable, and its refunds, disputes and the latest 20 gateway webhook events."
      operationId: getApiAdminPaymentsId
      x-access: "payments.view"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/PaymentDetail'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Not found}
  /api/admin/refunds:
    get:
      tags: ["Admin: Finance"]
      summary: "List refunds"
      description: "Refund requests from receptionists, admins and dispute decisions, newest first. `q` matches refund ID, appointment ID, patient name or transaction ID. `me` is the signed-in admin's ID (a requester cannot give the approvals of a refund above the threshold). Each item shows who requested it and how many approvals it needs and has."
      operationId: getApiAdminRefunds
      x-access: "refunds.view"
      parameters:
        - {name: hospitalId, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: string, enum: [PENDING, APPROVED, REJECTED, PROCESSING, COMPLETED]}}
        - {name: q, in: query, description: "Refund ID, appointment ID, patient name or transaction ID", schema: {type: string}}
        - {name: page, in: query, schema: {type: integer}}
        - {name: pageSize, in: query, description: "1-100, default 15", schema: {type: integer}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/RefundList'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
    post:
      tags: ["Admin: Finance"]
      summary: "Raise a refund"
      description: "Refuses with 400 for a booking token (payment purpose TOKEN, the only money Gmedic takes online): it is never refunded. Kept for payments that are not booking tokens. An admin raises a refund on any appointment's PAID payment, for example to clean up after an offboarded hospital. It is created PENDING and goes through the same approval as a receptionist's request: above the platform's refund_maker_checker_threshold (default 2000) it needs two other admins, otherwise one. The amount cannot exceed what is still refundable on the payment (refunds that are not rejected count). 400 when the appointment has no paid payment or the fee was collected at the front desk (the hospital returns that itself). Finance and Super Admin are notified."
      operationId: postApiAdminRefunds
      x-access: "refunds.manage"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminRefundCreate'}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Ok'}}}}
        '400': {description: "Validation error: fields appointmentId, amount (1-100000, within the refundable amount) or reason (5-255 characters)", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
  /api/admin/refunds/{id}/decision:
    post:
      tags: ["Admin: Finance"]
      summary: "Approve or reject a refund"
      description: "Only a PENDING refund can be decided (otherwise 400). REJECTED needs a note of at least 3 characters (the requester is told why). Above the maker-checker threshold a refund needs two approvals from two different admins, neither of them the requester: the first approval is recorded, the refund stays PENDING and the response has finished false; the second completes it. Below the threshold one approval completes it. Updates are conditional on the refund still being PENDING, so two admins acting at once cannot both win. With no live gateway connected the payout is simulated as completed at once."
      operationId: postApiAdminRefundsIdDecision
      x-access: "refunds.approve"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RefundDecision'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/RefundDecisionResult'}}}}
        '400': {description: "Already decided; invalid decision; rejecting without a note (fields.note); the requester approving a refund above the threshold; the same admin giving both approvals", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Not found}
  /api/admin/disputes:
    get:
      tags: ["Admin: Finance"]
      summary: "List disputes"
      description: "Payment disputes (chargebacks and admin-recorded complaints), newest first. `q` matches dispute ID, payment ID, transaction ID, appointment ID or patient name. `refundThreshold` is the platform's maker-checker refund threshold: resolving a dispute above it creates a refund that two other admins must approve."
      operationId: getApiAdminDisputes
      x-access: "disputes.view"
      parameters:
        - {name: hospitalId, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: string, enum: [OPEN, UNDER_REVIEW, RESOLVED, REJECTED]}}
        - {name: q, in: query, description: "Dispute, payment, transaction or appointment ID, or patient name", schema: {type: string}}
        - {name: page, in: query, schema: {type: integer}}
        - {name: pageSize, in: query, description: "1-100, default 20", schema: {type: integer}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/DisputeList'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
    post:
      tags: ["Admin: Finance"]
      summary: "Record a dispute"
      description: "Records a dispute against one PAID payment, found by payment ID, transaction ID or appointment ID (case-insensitive). The amount defaults to the whole payment and cannot exceed it. One live (OPEN or UNDER_REVIEW) dispute per payment. Gateway chargebacks arrive through the webhook inbox instead and open disputes the same way."
      operationId: postApiAdminDisputes
      x-access: "disputes.manage"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DisputeCreate'}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Ok'}}}}
        '400': {description: "Validation error: reference missing or no paid payment matches (fields.reference), amount (fields.amount), reason of 5-255 characters (fields.reason), or the payment already has an open dispute", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
  /api/admin/disputes/{id}/resolve:
    post:
      tags: ["Admin: Finance"]
      summary: "Mark under review / resolve / reject (resolution note required to close)"
      description: "RESOLVED means in the patient's favour. A booking token (payment purpose TOKEN) is never refunded, so for one no refund is created (refund null). For any other payment a refund of the disputed amount (capped at what is still refundable on the payment) is created. Up to the maker-checker threshold the decision is itself the approval and the refund is COMPLETED at once; above it the refund is created PENDING for two other admins to approve on the Refunds page. RESOLVED is refused while another PENDING refund (not from a dispute) exists on the payment, so the patient is not refunded twice. If the payment is already fully refunded no refund is created (refund null). REJECTED changes no money. A decided dispute (RESOLVED or REJECTED) cannot be changed; UNDER_REVIEW on an already-under-review dispute is a no-op."
      operationId: postApiAdminDisputesIdResolve
      x-access: "disputes.manage"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DisputeResolve'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/DisputeResolveResult'}}}}
        '400': {description: "Already decided; invalid outcome; resolution note missing for RESOLVED or REJECTED (fields.resolution); another refund on the payment is still waiting for approval", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Not found}
  /api/admin/disputes/{id}/notes:
    get:
      tags: ["Admin: Finance"]
      summary: "List internal notes"
      operationId: getApiAdminDisputesIdNotes
      x-access: "disputes.view"
