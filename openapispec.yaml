          format: date-time
          description: ISO date-time; defaults to now on create, keeps the current start when omitted on update
        endsAt:
          type: string
          format: date-time
          nullable: true
          description: Optional ISO date-time, after startsAt and in the future; omitted on update removes the end
    Availability: {type: object, required: [availability], properties: {availability: {type: string, enum: [present, absent]}}}
