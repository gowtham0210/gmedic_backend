      type: object
      required: [id, name, specialization, fee, availability]
      properties:
        id: {type: string, example: DOC101}
        name: {type: string, example: Dr. Arun Srinivasan}
        specialization: {type: string, example: Cardiologist}
        fee: {type: integer, description: Consultation fee in rupees, example: 800}
        availability: {type: string, enum: [present, absent]}
    DashboardAppointment:
      type: object
