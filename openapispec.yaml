    Note: {type: object, required: [note], properties: {note: {type: string, maxLength: 1000}}}
    MarkPaid: {type: object, required: [payoutReference], properties: {payoutReference: {type: string, maxLength: 100}}}
    Message: {type: object, required: [message], properties: {message: {type: string, minLength: 1, maxLength: 2000}}}
    Assign: {type: object, properties: {assignedTo: {type: string, nullable: true}}}
    Priority: {type: object, required: [priority], properties: {priority: {type: string, enum: [LOW, MEDIUM, HIGH, URGENT]}}}
    TicketStatus: {type: object, required: [status], properties: {status: {type: string, enum: [OPEN, IN_PROGRESS, RESOLVED, CLOSED]}}}
    TicketCreate:
      type: object
      required: [subject, description, category]
      properties:
        subject: {type: string, minLength: 3, maxLength: 160}
        description: {type: string, minLength: 5, maxLength: 2000}
        category: {type: string, enum: [APPOINTMENT, PAYMENT, REFUND, HOSPITAL, DOCTOR, ACCOUNT, QR, SCHEDULE, TECHNICAL, OTHER]}
        priority: {type: string, enum: [LOW, MEDIUM, HIGH], default: MEDIUM, description: Other values are treated as MEDIUM (only staff can set URGENT)}
        appointmentId: {type: string, description: "An appointment of the caller's hospital (doctors: one of their own); 400 fields.appointmentId otherwise"}
    TemplateWrite:
      type: object
