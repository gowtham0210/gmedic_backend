  /api/admin/webhooks/{id}/resync:
    post:
      tags: ["Admin: Finance"]
      summary: "Re-sync a webhook"
      description: "Re-applies the stored event to the platform's records and only then marks it PROCESSED/SYNCED; each retry increments retryCount. Supported events: payment.captured (marks the payment paid), payment.failed, refund.processed (completes an approved/processing refund) and charge.dispute.created / payment.dispute.created (opens a dispute for an admin to decide). Idempotent: an effect already in place counts as processed. If it cannot be applied (unsupported event, no matching payment or refund, conflicting state) the event stays FAILED with failureReason set and the call returns 400. An event that is already synced returns 200 with 'Already synced', changing nothing. Audited (WEBHOOK_RESYNCED / WEBHOOK_RESYNC_FAILED)."
