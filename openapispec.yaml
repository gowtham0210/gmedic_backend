            username: {type: string}
            email: {type: string}
            phone: {type: string, nullable: true}
            hospitalId: {type: string, nullable: true, description: Always null for admin accounts}
            status: {type: string}
            passwordChangedAt: {type: string, format: date-time, nullable: true}
            createdAt: {type: string, format: date-time}
    AdminProfileUpdate:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 3, maxLength: 60, description: Letters, spaces, dots, apostrophes and hyphens}
        phone: {type: string, description: "Optional, 10-15 digits. A blank or omitted phone leaves the stored number unchanged"}
    AdminProfileResult:
      type: object
      properties:
        ok: {type: boolean}
        message: {type: string}
        user: {$ref: '#/components/schemas/AdminProfile/properties/user'}
    AppointmentListItem:
      type: object
      properties:
        id: {type: string}
        hospitalId: {type: string}
        hospitalName: {type: string}
        doctorId: {type: string}
        doctorName: {type: string}
        specialization: {type: string}
        department: {type: string, nullable: true}
        branchName: {type: string, nullable: true}
        tokenNo: {type: integer, nullable: true}
        tokenCode: {type: string, nullable: true}
        transactionId: {type: string, nullable: true, description: Latest payment's transaction ID}
        patientId: {type: string, nullable: true}
        patientName: {type: string, nullable: true}
        patientMobile: {type: string, nullable: true}
        date: {type: string, format: date}
        time: {type: string}
        fee: {type: number}
        status: {type: string, enum: [confirmed, pending, completed, cancelled]}
        paymentStatus: {type: string, enum: [paid, pending]}
        source: {type: string, description: "Booking channel, for example Gmedic App, Walk-in or Phone"}
        cancelReason: {type: string, nullable: true}
        noShow: {type: boolean, description: Marked no-show (a flag on a confirmed appointment)}
        emergency: {type: boolean, description: "Emergency walk-in over a full slot (token E01, E02, ...; seen first)"}
        emergencyReason: {type: string, nullable: true, description: "Why the emergency was booked (3-300 characters). Null on regular appointments and on emergencies booked before migration 033"}
        emergencyWalkIn: {type: boolean, description: "An emergency walk-in registered without a slot (E001...). Never shown to the patient app"}
        triage: {type: string, nullable: true, enum: [CRITICAL, URGENT, SEMI_URGENT, NON_URGENT], description: "Clinical priority set by a doctor; null while the walk-in is awaiting triage"}
        triagedAt: {type: string, format: date-time, nullable: true}
        bookedById: {type: string, nullable: true, description: ID of the user who booked it (the receptionist, for a front-desk booking)}
        reason: {type: string, nullable: true, description: Reason for visit}
        bookedBy: {type: string, nullable: true, description: Name of the user who booked it}
        rescheduleCount: {type: integer}
        nextStatuses: {type: array, items: {type: string}, description: "Statuses the front desk could move it to by hand (informational for admins, who cannot change status)"}
        patientEditable: {type: boolean, description: True for a front-desk patient without an app account}
        patientGender: {type: string, nullable: true}
        patientDateOfBirth: {type: string, format: date, nullable: true}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    AdminRefundBrief:
      type: object
      properties:
        id: {type: string}
        amount: {type: number}
        status: {type: string, enum: [PENDING, APPROVED, REJECTED, PROCESSING, COMPLETED]}
        reason: {type: string, nullable: true}
        createdAt: {type: string, format: date-time}
    AdminDisputeBrief:
      type: object
      properties:
        id: {type: string}
        amount: {type: number}
        status: {type: string, enum: [OPEN, UNDER_REVIEW, RESOLVED, REJECTED]}
        reason: {type: string, nullable: true}
        createdAt: {type: string, format: date-time}
    AdminCancelQuote:
      type: object
      description: "What cancelling does to the money, in paise. The POST response omits blocker, fullRefundPaise and hospitalName."
      properties:
        blocker: {type: string, nullable: true, description: Why it cannot be cancelled; null when it can}
        paidPaise: {type: integer, description: Amount the patient paid}
        alreadyRefundedPaise: {type: integer, description: Refunded or waiting to be (rejected refunds do not count)}
        withinFreeWindow: {type: boolean}
        refundPaise: {type: integer, description: "Refund under the hospital's cancellation policy (with refund FULL on POST: everything still refundable)"}
        fullRefundPaise: {type: integer, description: Everything the patient paid that is still refundable}
        note: {type: string}
        hospitalName: {type: string}
    AdminAppointmentCancel:
      type: object
      required: [reason]
      properties:
        reason: {type: string, maxLength: 300}
    AdminAppointmentCancelResult:
      type: object
      properties:
        ok: {type: boolean}
        message: {type: string}
        appointment: {$ref: '#/components/schemas/AppointmentListItem'}
        quote: {$ref: '#/components/schemas/AdminCancelQuote'}
    PatientAccount:
      type: object
      description: The Gmedic app account the patient signs in with
      properties:
        id: {type: string}
        status: {type: string}
        blocked: {type: boolean}
        blockedReason: {type: string, nullable: true}
        blockedAt: {type: string, format: date-time, nullable: true}
        blockedBy: {type: string, nullable: true}
        lastLoginAt: {type: string, format: date-time, nullable: true}
        upcomingAppointments: {type: integer, description: Confirmed appointments from today on across the account}
    PatientBlock:
      type: object
      required: [reason]
      properties:
        reason: {type: string, maxLength: 300}
    PatientAccountResult:
      type: object
      properties:
        ok: {type: boolean}
        message: {type: string}
        account: {$ref: '#/components/schemas/PatientAccount'}
    PatientErase:
      type: object
      required: [confirm]
      properties:
        confirm: {type: string, description: "The patient ID, typed to confirm (case-insensitive)"}
    PatientEraseResult:
      type: object
      properties:
        ok: {type: boolean}
        message: {type: string}
        cancelled: {type: integer, description: Upcoming appointments cancelled (and refunded by the usual rules)}
        notCancelled: {type: array, items: {type: string}, description: Appointment IDs that could not be cancelled and stay on record}
    PaymentListItem:
      type: object
      properties:
        id: {type: string}
        purpose: {type: string, enum: [TOKEN, CONSULTATION], description: "TOKEN: the booking token paid in the app (Gmedic's, never refunded); CONSULTATION: the doctor's fee paid at the hospital"}
        appointmentId: {type: string}
        hospitalId: {type: string}
        hospitalName: {type: string}
        patientName: {type: string, nullable: true}
        doctorId: {type: string}
        doctorName: {type: string}
        specialization: {type: string}
        date: {type: string, format: date, description: Appointment date}
        time: {type: string}
        fee: {type: number, description: Payment amount}
        appointmentStatus: {type: string}
        paymentStatus: {type: string, enum: [PAID, FAILED, PENDING]}
        payment:
          type: object
          nullable: true
          description: Only for a PAID payment
          properties:
            method: {type: string, nullable: true}
            transactionId: {type: string, nullable: true}
            paidAt: {type: string, format: date-time, nullable: true}
            receiptNumber: {type: string, nullable: true}
            gateway: {type: string, nullable: true}
        refunded: {type: number, description: Refunded or waiting to be (rejected refunds do not count)}
        refundStatus: {type: string, nullable: true, enum: [PENDING, APPROVED, REJECTED, PROCESSING, COMPLETED], description: Status of the newest refund request}
        createdAt: {type: string, format: date-time}
    PaymentDetail:
      type: object
      properties:
        payment:
          allOf:
            - $ref: '#/components/schemas/PaymentListItem'
            - type: object
              properties:
                amount: {type: number}
                consultationAmount: {type: number, nullable: true}
                convenienceFee: {type: number}
                taxAmount: {type: number}
                currency: {type: string}
                method: {type: string, nullable: true}
                gateway: {type: string, nullable: true}
                gatewayOrderId: {type: string, nullable: true}
                gatewayStatus: {type: string, nullable: true}
                transactionId: {type: string, nullable: true}
                receiptNumber: {type: string, nullable: true}
                failureReason: {type: string, nullable: true}
                paidAt: {type: string, format: date-time, nullable: true}
                refundable: {type: number, description: Amount still refundable (payment amount less refunds that are not rejected)}
                refunds: {type: array, items: {$ref: '#/components/schemas/AdminRefundBrief'}}
                disputes: {type: array, items: {$ref: '#/components/schemas/AdminDisputeBrief'}}
                events:
                  type: array
                  description: Latest 20 gateway webhook events for this payment or transaction
                  items:
                    type: object
                    properties:
                      id: {type: integer}
                      eventType: {type: string}
                      status: {type: string}
                      syncStatus: {type: string}
                      failureReason: {type: string, nullable: true}
                      receivedAt: {type: string, format: date-time}
    AdminRefundCreate:
      type: object
      required: [appointmentId, amount, reason]
      properties:
        appointmentId: {type: string, description: Appointment with a PAID payment taken through Gmedic}
        amount: {type: number, minimum: 1, maximum: 100000, description: In rupees; at most what is still refundable on the payment}
        reason: {type: string, minLength: 5, maxLength: 255}
    RefundDecisionResult:
      type: object
      properties:
        ok: {type: boolean}
        message: {type: string}
        finished: {type: boolean, description: "False when this was the first of two approvals and the refund is still PENDING"}
    DisputeCreate:
      type: object
      required: [reference, reason]
      properties:
        reference: {type: string, description: "Payment ID, transaction ID or appointment ID of a PAID payment"}
        amount: {type: number, description: Disputed amount; defaults to the whole payment and cannot exceed it}
        reason: {type: string, minLength: 5, maxLength: 255}
    DisputeResolveResult:
      type: object
      properties:
        ok: {type: boolean}
        message: {type: string}
        refund:
          type: object
          nullable: true
          description: Only present when status is RESOLVED, and null if nothing more could be refunded
          properties:
            id: {type: string}
            amount: {type: number}
            pending: {type: boolean, description: True when it is above the maker-checker threshold and awaits two other admins' approval}
    AdminTicket:
      type: object
      properties:
        id:
          type: string
        ticketNumber:
          type: string
          example: SUP-1001
        createdBy:
          type: string
        createdByName:
          type: string
          nullable: true
        createdByRole:
          type: string
          enum:
          - PATIENT
          - DOCTOR
          - RECEPTIONIST
          - ADMIN
        hospitalId:
          type: string
          nullable: true
        hospitalName:
          type: string
          nullable: true
        appointmentId:
          type: string
          nullable: true
          description: Appointment the ticket was raised about, if any
        category:
          type: string
          enum:
          - APPOINTMENT
          - PAYMENT
          - REFUND
          - HOSPITAL
          - DOCTOR
          - ACCOUNT
          - QR
          - SCHEDULE
          - TECHNICAL
          - OTHER
        subject:
          type: string
        description:
          type: string
        priority:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
          - URGENT
        status:
          type: string
          enum:
          - OPEN
          - IN_PROGRESS
          - RESOLVED
          - CLOSED
        assignedTo:
          type: string
          nullable: true
        assigneeName:
          type: string
          nullable: true
        slaDueAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        resolvedAt:
          type: string
          format: date-time
          nullable: true
        closedAt:
          type: string
          format: date-time
          nullable: true
    TicketNotes:
      type: object
      properties:
        notes:
          type: array
          description: Staff-only internal notes, oldest first
          items:
            type: object
            properties:
              id:
                type: integer
              userName:
                type: string
              note:
                type: string
              createdAt:
                type: string
                format: date-time
    BannerStatus:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
          - ARCHIVED
          description: ARCHIVED is final (the banner can no longer be edited or changed)
    FeatureFlagSet:
      type: object
      required:
      - flagKey
      - enabled
      properties:
        flagKey:
          type: string
          enum:
          - live_queue
          - rotating_qr
          description: rotating_qr is not implemented yet and cannot be turned on
        hospitalId:
          type: string
          description: Omit to set the platform default; give a hospital id to set that hospital's override
        enabled:
          type: boolean
    PatientAppVersionCheck:
      type: object
      properties:
        platform:
          type: string
          enum:
          - ANDROID
          - IOS
        version:
          type: string
          example: 1.3.0
        latestVersion:
          type: string
        minSupportedVersion:
          type: string
        updateRequired:
          type: boolean
          description: forceUpdate is on and the installed version is below minSupportedVersion
        updateAvailable:
          type: boolean
          description: The installed version is below latestVersion
        message:
          type: string
          nullable: true
          description: Message set by the admin, if any
    RecAppointment:
      type: object
      description: One appointment as the front desk sees it (list rows, dashboard rows and the base of the detail)
      properties:
        id: {type: string, example: APT10531}
        hospitalId: {type: string}
        hospitalName: {type: string}
        doctorId: {type: string}
        doctorName: {type: string}
        specialization: {type: string}
        department: {type: string, nullable: true}
        branchName: {type: string, nullable: true}
        tokenNo: {type: integer, nullable: true}
        tokenCode: {type: string, nullable: true, example: T003, description: The live token if there is one, else the token number given at booking}
        transactionId: {type: string, nullable: true, description: Transaction id of the latest payment attempt}
        patientId: {type: string}
        patientName: {type: string}
        patientMobile: {type: string, nullable: true, description: Null for a person registered without a number of their own}
        date: {type: string, format: date}
        time: {type: string, example: "10:30"}
        fee: {type: number}
        status: {type: string, enum: [confirmed, pending, completed, cancelled]}
        paymentStatus: {type: string, enum: [paid, pending]}
        source: {type: string, enum: [Gmedic App, Walk-in, Phone], description: How the booking came in}
        cancelReason: {type: string, nullable: true}
        noShow: {type: boolean, description: The patient did not come (a flag on a confirmed appointment; it is final for the day)}
        emergency: {type: boolean, description: "Emergency walk-in over a full slot (token E01, E02, ...; seen first)"}
        emergencyReason: {type: string, nullable: true, description: "Why the emergency was booked (3-300 characters). Null on regular appointments and on emergencies booked before migration 033"}
        emergencyWalkIn: {type: boolean, description: "An emergency walk-in registered without a slot (E001...). Never shown to the patient app"}
        triage: {type: string, nullable: true, enum: [CRITICAL, URGENT, SEMI_URGENT, NON_URGENT], description: "Clinical priority set by a doctor; null while the walk-in is awaiting triage"}
        triagedAt: {type: string, format: date-time, nullable: true}
        bookedById: {type: string, nullable: true, description: ID of the user who booked it (the receptionist, for a front-desk booking)}
        reason: {type: string, nullable: true, description: Reason for visit, up to 300 characters}
        bookedBy: {type: string, nullable: true, description: Name of the staff member or patient who booked it}
        rescheduleCount: {type: integer}
        nextStatuses:
          type: array
          items: {type: string, enum: [confirmed, pending, completed]}
          description: The statuses PATCH .../status will accept now. Empty for completed, cancelled and no-show appointments; completed is offered only from the appointment date on
        patientEditable: {type: boolean, description: "False when the patient has their own Gmedic app account, so only the reason for visit can be corrected here"}
        patientGender: {type: string, enum: [MALE, FEMALE, OTHER], nullable: true}
        patientDateOfBirth: {type: string, format: date, nullable: true}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    RecAppointmentPayment:
      type: object
      description: The appointment's payment, the PAID one when there is one, else the latest attempt
      properties:
        id: {type: string, example: PAY20443}
        method: {type: string, nullable: true, description: "UPI, Card, Net Banking, Wallet or Cash"}
        transactionId: {type: string, nullable: true}
        paidAt: {type: string, format: date-time, nullable: true}
        amount: {type: number}
        status: {type: string, description: "PAID, PENDING or FAILED"}
        gateway: {type: string, nullable: true, description: "FRONT_DESK when taken at the desk, otherwise the online gateway"}
        receiptNumber: {type: string, nullable: true}
        reference: {type: string, nullable: true, description: UPI reference or card slip number typed at the desk (desk payments only)}
        atDesk: {type: boolean, description: Collected at the front desk. Such money never reaches Gmedic, so Gmedic does not refund it}
    RecAppointmentUpdate:
      type: object
      description: Send only what changes. Patient fields are accepted only for a patient without a Gmedic app account
      properties:
        reason: {type: string, maxLength: 300, nullable: true, description: Reason for visit; empty clears it}
        patient:
          type: object
          properties:
            name: {type: string, minLength: 2, maxLength: 80}
            mobile: {type: string, nullable: true, description: "A 10-digit mobile number not used by another patient; empty clears it"}
            gender: {type: string, enum: [male, female, other], nullable: true}
            dateOfBirth: {type: string, format: date, nullable: true, description: A date in the past}
    RecReschedule:
      type: object
      required: [date, time]
      properties:
        date: {type: string, format: date}
        time: {type: string, example: "10:30", pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', description: Start of one of the doctor's slots on that date. The doctor stays the same}
    RecDeskPayment:
      type: object
      required: [method]
      properties:
        method: {type: string, enum: [Cash, UPI, Card], description: Case-insensitive}
        reference: {type: string, maxLength: 60, description: UPI reference or card slip/approval number. Required (at least 4 characters) for UPI and Card}
    RecPatientLookup:
      type: object
      properties:
        patient:
          type: object
          nullable: true
          description: The patient who owns the number, or null when unknown
          properties:
            id: {type: string, example: PAT1001}
            name: {type: string}
            mobile: {type: string}
            gender: {type: string, enum: [MALE, FEMALE, OTHER], nullable: true}
            dateOfBirth: {type: string, format: date, nullable: true}
            appointmentsHere: {type: integer, description: Appointments at the caller's hospital}
            lastVisit: {type: string, format: date, nullable: true}
        sharing:
          type: array
          description: People registered without a number of their own who use this one
          items:
            type: object
            properties:
              id: {type: string}
              name: {type: string}
    RecDoctor:
      type: object
      description: A doctor of the caller's hospital. availability is today's effective value (absent while on leave or marked absent today)
      properties:
        id: {type: string, example: DOC101}
        hospitalId: {type: string}
        branchId: {type: string, nullable: true}
        name: {type: string}
        photoUrl: {type: string, nullable: true}
        department: {type: string, nullable: true}
        specialization: {type: string}
        registrationNumber: {type: string, nullable: true}
        qualifications: {type: string, nullable: true}
        fee: {type: number}
        availability: {type: string, enum: [present, absent]}
        onLeave: {type: boolean}
        leaveNote: {type: string, nullable: true, description: "The leave reason, or 'Marked absent today'"}
        availabilityUpdatedAt: {type: string, format: date-time, nullable: true}
        workingBlocks: {type: integer, nullable: true, description: Weekly working-hour blocks in force from today; 0 means the doctor cannot take bookings yet}
        verificationStatus: {type: string, enum: [PENDING, VERIFIED, REJECTED]}
        verificationNote: {type: string, nullable: true}
        status: {type: string, enum: [ACTIVE, INACTIVE], description: INACTIVE doctors have left the hospital and cannot be booked}
        statusReason: {type: string, nullable: true}
        bio: {type: string, nullable: true}
        yearsExperience: {type: integer, nullable: true}
        languages: {type: string, nullable: true, description: Comma-separated}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        todayAppointments: {type: integer, description: "Non-cancelled appointments today (list only)"}
        stats:
          type: object
          description: Present on detail, update and status responses
          properties:
            today: {type: integer}
            upcoming: {type: integer}
            completed: {type: integer}
        portalLogin:
          type: object
          nullable: true
          description: "Doctor portal login state (detail only); null when not invited yet"
          properties:
            status: {type: string, enum: [ACTIVE, INACTIVE]}
            email: {type: string}
            lastLoginAt: {type: string, format: date-time, nullable: true}
            mustChangePassword: {type: boolean}
    DoctorStatusChange:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [ACTIVE, INACTIVE]}
        reason: {type: string, maxLength: 300, description: Required when deactivating}
    DoctorStatusImpact:
      type: object
      properties:
        upcomingAppointments: {type: integer, description: Confirmed or pending appointments from today that still need to be moved or cancelled}
        firstDate: {type: string, format: date, nullable: true}
        lastDate: {type: string, format: date, nullable: true}
        activeLogin: {type: boolean, description: The doctor has an active doctor-portal login that deactivating would lock}
    DoctorLoginInvite:
      type: object
      required: [email]
      properties:
        email: {type: string, format: email, maxLength: 120, description: The sign-in email; unique across all accounts}
        phone: {type: string, description: "Optional, 10 to 15 digits; unique across all accounts"}
    DoctorLoginCredentials:
      type: object
      properties:
        ok: {type: boolean}
        message: {type: string}
        credentials:
          type: object
          description: Shown once. The doctor must change the password at first sign-in
          properties:
            login: {type: string, description: The sign-in email}
            tempPassword: {type: string}
    RecToken:
      type: object
      properties:
        id: {type: string, example: TK10104}
        hospitalId: {type: string}
        appointmentId: {type: string}
        doctorId: {type: string}
        doctorName: {type: string}
        specialization: {type: string}
        patientName: {type: string, nullable: true}
        date: {type: string, format: date}
        number: {type: integer}
        code: {type: string, example: T001, description: "T001... for an appointment, E001... for an emergency walk-in (E01... for the older slot emergencies)"}
        emergency: {type: boolean, description: "An emergency booked into a full slot before migration 032 was closed (history); called first, as before"}
        walkIn: {type: boolean, description: "An emergency walk-in (separate E001... token, no slot)"}
        kind: {type: string, enum: [NORMAL, EMERGENCY], description: "Which number sequence the token is in"}
        triage: {type: string, nullable: true, enum: [CRITICAL, URGENT, SEMI_URGENT, NON_URGENT], description: "Set by a doctor"}
        awaitingTriage: {type: boolean, description: "A walk-in nobody has assessed yet: shown to the doctor as such, never treated as urgent"}
        triagedAt: {type: string, format: date-time, nullable: true}
        emergencyReason: {type: string, nullable: true}
        registeredAt: {type: string, format: date-time, nullable: true, description: "Walk-ins only"}
        arrivedAt: {type: integer, description: "Epoch ms the patient started waiting: registration for a walk-in, the slot start for an appointment"}
        status: {type: string, enum: [waiting, called, in_consultation, completed, cancelled, skipped]}
        nextStatuses:
          type: array
          items: {type: string, enum: [waiting, called, in_consultation, completed, cancelled, skipped]}
          description: The moves PATCH .../status will accept now. Empty for completed and cancelled
        time: {type: string, nullable: true, description: The appointment's slot time}
        appointmentStatus: {type: string, nullable: true}
        paymentStatus: {type: string, nullable: true}
        fee: {type: number, nullable: true}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        calledAt: {type: string, format: date-time, nullable: true}
        completedAt: {type: string, format: date-time, nullable: true}
        cancelledAt: {type: string, format: date-time, nullable: true}
        skippedAt: {type: string, format: date-time, nullable: true}
    RecRefundList:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              id: {type: string, example: REF1}
              appointmentId: {type: string}
              patientName: {type: string, nullable: true}
              amount: {type: number}
              reason: {type: string}
              status: {type: string, enum: [PENDING, APPROVED, PROCESSING, COMPLETED, REJECTED]}
              decisionNote: {type: string, nullable: true, description: The reason given when rejected}
              createdAt: {type: string, format: date-time}
              disputeId: {type: string, nullable: true, description: Set when the refund came out of a dispute}
              awaitingSecondApproval: {type: boolean, description: Above the maker-checker threshold and still pending}
        total: {type: integer}
        page: {type: integer}
        pageSize: {type: integer}
        pages: {type: integer}
    RecTicket:
      type: object
      properties:
        id: {type: string, example: TKT1}
        ticketNumber: {type: string, example: SUP-1001}
        createdBy: {type: string}
        createdByName: {type: string}
        createdByRole: {type: string, enum: [DOCTOR, RECEPTIONIST, ADMIN]}
        hospitalId: {type: string, nullable: true}
        hospitalName: {type: string, nullable: true}
        appointmentId: {type: string, nullable: true, description: The appointment the ticket is about}
        category: {type: string}
        subject: {type: string}
        description: {type: string}
        priority: {type: string, enum: [LOW, MEDIUM, HIGH, URGENT]}
        status: {type: string, enum: [OPEN, IN_PROGRESS, RESOLVED, CLOSED]}
        assignedTo: {type: string, nullable: true}
        assigneeName: {type: string, nullable: true}
        slaDueAt: {type: string, format: date-time}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        resolvedAt: {type: string, format: date-time, nullable: true}
        closedAt: {type: string, format: date-time, nullable: true}
    TicketClose:
      type: object
      properties:
        reason: {type: string, maxLength: 300, description: Optional; added to the 'Closed by' message in the conversation}
    TicketCloseResult:
      type: object
      properties:
        ok: {type: boolean}
        message: {type: string}
        ticket: {$ref: '#/components/schemas/RecTicket'}
        messages: {type: array, items: {type: object, additionalProperties: true}, description: The full conversation including the 'Closed by' message}
    DocAppointmentCancel:
      type: object
      required: [reason]
      properties:
        reason: {type: string, minLength: 1, maxLength: 300, description: Shown to the patient and kept on the appointment; longer text is cut to 300 characters}
    DocCancelQuote:
      type: object
      required: [blocker, refund, paid, note]
      properties:
        blocker: {type: string, nullable: true, description: Why the appointment can't be cancelled (already cancelled or completed, patient in consultation, no-show); null when it can}
        refund: {type: number, description: Rupees refunded to the patient if the doctor cancels now (everything paid online, minus refunds already made; 0 for money collected at the desk)}
        paid: {type: number, description: Rupees the patient paid}
        note: {type: string}
    DocAppointmentResult:
      type: object
      properties:
        ok: {type: boolean}
        message: {type: string}
        appointment: {$ref: '#/components/schemas/DocAppointmentDetail/properties/appointment'}
    DocNote:
      type: object
      description: One saved version of the consultation notes (versions are never edited)
      properties:
        version: {type: integer, minimum: 1}
        diagnosis: {type: string, nullable: true}
        notes: {type: string, nullable: true}
        prescription: {type: string, nullable: true}
        createdBy: {type: string, nullable: true, description: Name of the user who saved this version}
        createdAt: {type: string, format: date-time}
    DocNoteWrite:
      type: object
      description: Send at least one of the three fields; omitted fields are saved as empty. Text is trimmed
      properties:
        diagnosis: {type: string, maxLength: 500}
        notes: {type: string, maxLength: 4000}
        prescription: {type: string, maxLength: 2000}
    DocNotesList:
      type: object
      properties:
        notes: {type: array, description: Newest version first, items: {$ref: '#/components/schemas/DocNote'}}
    DocNotesSaved:
      type: object
      properties:
        ok: {type: boolean}
        message: {type: string, example: Consultation notes saved.}
        notes: {type: array, description: All versions after the save, newest first, items: {$ref: '#/components/schemas/DocNote'}}
    DocTokenResult:
      type: object
      properties:
        ok: {type: boolean}
        message: {type: string}
        token: {$ref: '#/components/schemas/DashboardToken'}
        undoMinutes: {type: integer, description: "Only on complete: minutes during which the completion can be undone (10), 0 when the token has no appointment"}
    DocDoctor:
      type: object
      description: The doctor record as the doctor portal sees it
      properties:
        id: {type: string, example: DOC101}
        hospitalId: {type: string}
        branchId: {type: string, nullable: true}
        name: {type: string}
        photoUrl: {type: string, nullable: true, description: Public URL under /api/doctor-photos/}
        department: {type: string, nullable: true}
        specialization: {type: string}
        registrationNumber: {type: string, nullable: true}
        qualifications: {type: string, nullable: true}
        fee: {type: integer}
        availability: {type: string, enum: [present, absent], description: Effective availability today (absent while on leave or marked absent today)}
        onLeave: {type: boolean}
        leaveNote: {type: string, nullable: true}
        availabilityUpdatedAt: {type: string, format: date-time, nullable: true}
        workingBlocks: {type: integer, nullable: true, description: Working-hour blocks in force today or later}
        verificationStatus: {type: string, enum: [PENDING, VERIFIED, REJECTED]}
        verificationNote: {type: string, nullable: true}
        status: {type: string, enum: [ACTIVE, INACTIVE]}
        statusReason: {type: string, nullable: true}
        bio: {type: string, nullable: true}
        yearsExperience: {type: integer, nullable: true}
        languages: {type: string, nullable: true}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    DocPhotoUpload:
      type: object
      required: [photo]
      properties:
        photo: {type: string, format: binary, description: "PNG or JPEG image up to 3 MB"}
    LeaveBooking:
      type: object
      properties:
        id: {type: string, description: Appointment ID}
        date: {type: string, format: date}
        time: {type: string}
        patientName: {type: string, nullable: true}
        paid: {type: boolean}
    LeaveImpact:
      type: object
      required: [booked]
      properties:
        booked: {type: array, description: Appointments booked on the days the leave would add, in date order, items: {$ref: '#/components/schemas/LeaveBooking'}}
    LeaveBookedConflict:
      type: object
      properties:
        error: {type: string}
        fields:
          type: object
          properties:
            booked: {type: array, items: {$ref: '#/components/schemas/LeaveBooking'}}
    LeaveUpdate:
      type: object
      description: Fields left out keep their current value
      properties:
        startDate: {type: string, format: date, description: Can't be changed once the leave has started}
        endDate: {type: string, format: date, description: Today or later}
        reason: {type: string, nullable: true, maxLength: 200}
        confirmBooked: {type: boolean, description: Needed when the change adds days that have booked appointments}
        cancelBooked: {type: boolean, description: Together with confirmBooked, cancels those appointments with a full refund}
    LeaveChangeResult:
      type: object
      properties:
        ok: {type: boolean}
        message: {type: string, example: Leave updated.}
        booked: {type: integer, description: Appointments booked on the added days (absent when nothing changed)}
        cancelled: {type: integer}
        kept: {type: integer}
    DocScheduleEdit:
      type: object
      minProperties: 1
      description: Any of these; the rest keep their value. Capacity alone is the quick "patients per slot" change
      properties:
        startTime: {type: string, example: "09:00", pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'}
        endTime: {type: string, example: "13:00", pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', description: Must be after startTime}
        slotMinutes: {type: integer, minimum: 5, maximum: 120}
        capacityPerSlot: {type: integer, minimum: 1, maximum: 50}
    DocScheduleBlock:
      type: object
      properties:
        id: {type: integer}
        doctorId: {type: string}
        dayOfWeek: {type: integer, minimum: 0, maximum: 6, description: 0 = Sunday}
        startTime: {type: string, example: "09:00"}
        endTime: {type: string, example: "13:00"}
        slotMinutes: {type: integer}
        capacityPerSlot: {type: integer}
        walkInSeats: {type: integer, description: Seats per slot held back for the front desk}
        effectiveFrom: {type: string, format: date, nullable: true}
        effectiveTo: {type: string, format: date, nullable: true, description: Last day this version applies; null while open-ended}
    DocScheduleCreated:
      type: object
      properties:
        ok: {type: boolean}
        message: {type: string, example: "Working hours added from 2026-10-13."}
        id: {type: integer, description: ID of the new block}
        effectiveFrom: {type: string, format: date, description: Next working day (tomorrow at the hospital)}
    ScheduleImpact:
      type: object
      required: [removedFrom, endsToday, bookings]
      description: What removing a working-hours block leaves behind
      properties:
        removedFrom: {type: string, format: date, description: The day the block would stop applying (tomorrow at the hospital)}
        endsToday: {type: boolean, description: The block already ends today, so it can't be removed or changed again}
        bookings:
          type: object
          description: Upcoming confirmed or pending appointments (from tomorrow on) inside the block's hours; they are kept
          properties:
            count: {type: integer}
            firstDate: {type: string, format: date, nullable: true}
            lastDate: {type: string, format: date, nullable: true}
    DocScheduleRemoved:
      type: object
      properties:
        ok: {type: boolean}
        message: {type: string}
        removedFrom: {type: string, format: date}
        keptAppointments: {type: integer, description: Non-cancelled appointments from tomorrow on inside the block's hours; they are kept}
    DocTicket:
      type: object
      properties:
        id: {type: string}
        ticketNumber: {type: string, example: SUP-1002}
        createdBy: {type: string}
        createdByName: {type: string}
        createdByRole: {type: string}
        hospitalId: {type: string, nullable: true}
        hospitalName: {type: string, nullable: true}
        appointmentId: {type: string, nullable: true, description: The appointment the ticket is about}
        category: {type: string}
        subject: {type: string}
        description: {type: string}
        priority: {type: string, enum: [LOW, MEDIUM, HIGH, URGENT]}
        status: {type: string, enum: [OPEN, IN_PROGRESS, RESOLVED, CLOSED]}
        assignedTo: {type: string, nullable: true}
        assigneeName: {type: string, nullable: true}
        slaDueAt: {type: string, format: date-time}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        resolvedAt: {type: string, format: date-time, nullable: true}
        closedAt: {type: string, format: date-time, nullable: true}
    DocTicketCloseResult:
      allOf:
        - {$ref: '#/components/schemas/DocTicketDetail'}
        - type: object
          properties:
            ok: {type: boolean}
            message: {type: string, example: Ticket SUP-1002 closed.}
