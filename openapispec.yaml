                properties:
                  id:
                    type: string
                  amount:
                    type: number
                  hospitalName:
                    type: string
            supportTickets:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  subject:
                    type: string
                  priority:
                    type: string
              description: OPEN or IN_PROGRESS tickets, most urgent SLA first (up to 5)
            paymentIssues:
