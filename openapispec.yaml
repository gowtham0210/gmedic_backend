openapi: 3.0.3
info:
  title: Gmedic Web Portal API
  version: 1.0.0
  description: |
    REST API behind the Gmedic Super Admin, Receptionist and Doctor portals (Next.js route handlers).
    Authentication is a session cookie (`gmedic.sid`) set by `POST /api/auth/login`. Authorisation is enforced on the server:
    admin routes need the named permission (403 otherwise), portal routes are scoped to the signed-in hospital / doctor,
    doctors only see their own support tickets and receptionists those raised by receptionists of their hospital (404 for anyone else's).
    The access requirement of each operation is given in `x-access`.
    Super Admin appointments are read-only apart from one escalation: cancel (`POST /api/admin/appointments/{id}/cancel`, Super Admin only). There is no admin reschedule or edit endpoint.
    Money (booking-token model): a Gmedic app booking is confirmed by paying only the booking token (platform setting
    booking_token_amount, ₹5; payment purpose TOKEN). Gmedic keeps it and it is never refunded, whoever cancels. The whole
    consultation fee is paid at the hospital and recorded at the front desk (purpose CONSULTATION); only that makes an
    appointment `paid`. There are no hospital settlements or payouts.
    The Patient tag is the API of the Gmedic patient app: it signs in with a one-time code and a bearer token, money is in paise,
    and every booking, payment and cancellation is written to the same database the portals read. Fee quotes always have
    feeModel/model `tokenFee`, no convenience fee or GST, and payAtHospitalPaise equal to the consultation fee.
servers:
  - url: http://localhost:3000
    description: Local development
security:
  - sessionCookie: []
tags:
  - name: "Auth"
  - name: "Internal"
  - name: "Admin: Dashboard"
  - name: "Admin: Hospitals"
  - name: "Admin: Doctors"
  - name: "Admin: Receptionists"
  - name: "Admin: QR"
  - name: "Admin: Appointments"
  - name: "Admin: Patients"
  - name: "Admin: Finance"
  - name: "Admin: Support"
  - name: "Admin: Communications"
  - name: "Admin: Settings"
  - name: "Admin: Audit"
  - name: "Admin: Team"
  - name: "Receptionist"
  - name: "Doctor"
  - name: "Doctor: Dashboard"
  - name: "Patient"
  - name: "Public"
paths:
  /api/auth/login:
    post:
      tags: ["Auth"]
      summary: "Log in (sets the gmedic.sid session cookie)"
      operationId: postApiAuthLogin
      x-access: "public"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/LoginResponse'}}}}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Incorrect email/username or password}
        '403': {description: Account is not active}
        '429': {description: Too many failed attempts - wait a few minutes}
  /api/auth/logout:
    post:
      tags: ["Auth"]
      summary: "Log out"
      operationId: postApiAuthLogout
      x-access: "public"
      security: []
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/LogoutResponse'}}}}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/auth/forgot-password:
    post:
      tags: ["Auth"]
      summary: "Request a password reset"
      operationId: postApiAuthForgotPassword
      x-access: "public"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ForgotPasswordRequest'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Ok'}}}}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/internal/events:
    post:
      tags: ["Internal"]
      summary: "Fire an appointment/payment notification event (patient-app backend). Header x-internal-key required"
      operationId: postApiInternalEvents
      x-access: "internal"
      security:
        - internalKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InternalEventRequest'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/InternalEventResult'}}}}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Missing or wrong x-internal-key}
        '404': {description: Unknown appointment}
        '503': {description: INTERNAL_EVENT_KEY is not configured}
  /api/admin/dashboard:
    get:
      tags: ["Admin: Dashboard"]
      summary: "Operational dashboard: KPI cards, 14-day booking and revenue trends, QR funnel, hospital growth, recent activity and pending work"
      operationId: getApiAdminDashboard
      x-access: "dashboard.view"
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/DashboardSummary'}}}}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
  /api/admin/analytics:
    get:
      tags: ["Admin: Dashboard"]
      summary: "Same payload as the dashboard, behind the separate analytics.view permission (so Finance can see trends without the full dashboard). Takes no filters: always platform-wide, last 14 days for trends and 30 days for rates and the QR funnel"
      operationId: getApiAdminAnalytics
      x-access: "analytics.view"
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/DashboardSummary'}}}}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
  /api/admin/hospitals:
    get:
      tags: ["Admin: Hospitals"]
      summary: "List hospitals with doctor counts and a status summary"
      operationId: getApiAdminHospitals
      x-access: "hospitals.view"
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [ONBOARDING, ACTIVE, SUSPENDED, OFFBOARDED]}}
        - {name: kycStatus, in: query, schema: {type: string, enum: [PENDING, UNDER_REVIEW, VERIFIED, REJECTED]}}
        - {name: q, in: query, schema: {type: string}}
        - {name: page, in: query, schema: {type: integer}}
        - {name: pageSize, in: query, schema: {type: integer}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/HospitalList'}}}}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
    post:
      tags: ["Admin: Hospitals"]
      summary: "Onboard a hospital (starts ONBOARDING / KYC PENDING and gets a Main Reception QR code)"
      operationId: postApiAdminHospitals
      x-access: "hospitals.manage"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/HospitalCreate'}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/HospitalResult'}}}}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
  /api/admin/hospital-options:
    get:
      tags: ["Admin: Hospitals"]
      summary: "Light hospital list for dropdowns (id, name, status, city), sorted by name, not paged"
      description: "Any signed-in admin role may call it, including Support (no hospitals.view needed). Capped at 2000 hospitals. Screens that create records should hide the statuses that can't take them"
      operationId: getApiAdminHospitalOptions
      x-access: "admin"
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/HospitalOptions'}}}}
        '401': {description: Not signed in / session ended}
  /api/admin/hospitals/{id}:
    get:
      tags: ["Admin: Hospitals"]
      summary: "Hospital detail with KYC checklist and branch, doctor, receptionist and appointment counts"
      operationId: getApiAdminHospitalsId
      x-access: "hospitals.view"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/HospitalDetail'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Not found}
    put:
      tags: ["Admin: Hospitals"]
      summary: "Update hospital details (send only the fields to change)"
      description: "Also edits the About text shown in the patient app and the hospital's portal (max 600 characters; blank clears it). A GSTIN or registration number already used by another hospital is a 400 on that field. On a hospital with Verified KYC, changing or removing the GSTIN / registration number sends KYC back to UNDER_REVIEW (response kycReviewRequired: true). The logo is changed with POST/DELETE /api/admin/hospitals/{id}/logo"
      operationId: putApiAdminHospitalsId
      x-access: "hospitals.manage"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/HospitalUpdate'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/HospitalResult'}}}}
        '400': {description: Validation error (fields), content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Not found}
  /api/admin/hospitals/{id}/status:
    patch:
      tags: ["Admin: Hospitals"]
      summary: "Change status; a reason is required for SUSPENDED and OFFBOARDED. Data is never deleted"
      description: "Allowed moves (the hospital's nextStatuses): ONBOARDING to ACTIVE or OFFBOARDED, ACTIVE to SUSPENDED or OFFBOARDED, SUSPENDED to ACTIVE or OFFBOARDED. OFFBOARDED is final and nothing can move back to ONBOARDING; any other move is a 400. ACTIVE needs KYC VERIFIED. Offboarding deactivates every active receptionist and doctor login of the hospital (their sessions end) and revokes its active QR codes; GET /api/admin/hospitals/{id}/offboard-impact previews the counts, and the success message repeats them. Sending the current status is a 200 'No changes to save.'"
      operationId: patchApiAdminHospitalsIdStatus
      x-access: "hospitals.manage"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/HospitalStatus'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/HospitalResult'}}}}
        '400': {description: "Invalid status, a move not allowed from the current status, KYC not verified (ACTIVE), or reason missing for SUSPENDED / OFFBOARDED (fields.reason)", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Not found}
  /api/admin/hospitals/{id}/offboard-impact:
    get:
      tags: ["Admin: Hospitals"]
      summary: "What offboarding the hospital would lock (active staff logins and live QR codes)"
      operationId: getApiAdminHospitalsIdOffboardImpact
      x-access: "hospitals.view"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/OffboardImpact'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Not found}
  /api/admin/hospitals/{id}/policy:
    get:
      tags: ["Admin: Hospitals"]
      summary: "Booking policy (cancellation window, refund %, booking window) with the platform defaults"
      description: "A hospital without its own policy row gets the platform defaults (policy.custom is false)"
      operationId: getApiAdminHospitalsIdPolicy
      x-access: "hospitals.view"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/HospitalPolicyView'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Not found}
    put:
      tags: ["Admin: Hospitals"]
      summary: "Save the hospital's booking policy"
      description: "All three values are required. The policy applies to new cancellations and bookings in the patient app"
      operationId: putApiAdminHospitalsIdPolicy
      x-access: "hospitals.manage"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/HospitalPolicyValues'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/HospitalPolicyResult'}}}}
        '400': {description: Validation error (fields), content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Not found}
  /api/admin/hospitals/{id}/kyc:
    patch:
      tags: ["Admin: Hospitals"]
      summary: "Set the hospital's KYC status"
      description: "REJECTED needs a reason (fields.reason). VERIFIED is refused (400) until every document in the KYC checklist is VERIFIED (licence, registration and bank proof, plus the GST certificate when the hospital has a GSTIN); withdrawn documents do not count. The reason (max 300 characters) is stored as the hospital's kycReason. Sending the current status is a 200 'No changes to save.' (no kycChecklist in that case)"
      operationId: patchApiAdminHospitalsIdKyc
      x-access: "kyc.manage"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/KycStatus'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/KycResult'}}}}
        '400': {description: "Invalid status, reason missing for REJECTED (fields.reason), or documents still to verify", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Not found}
  /api/admin/hospitals/{id}/documents:
    get:
      tags: ["Admin: Hospitals"]
      summary: "List KYC documents"
      operationId: getApiAdminHospitalsIdDocuments
      x-access: "kyc.view"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/DocumentList'}}}}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Not found}
    post:
      tags: ["Admin: Hospitals"]
      summary: "Upload a KYC document (multipart; PDF, PNG or JPEG up to 8 MB). Moves KYC from PENDING to UNDER_REVIEW"
      operationId: postApiAdminHospitalsIdDocuments
      x-access: "kyc.manage"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {$ref: '#/components/schemas/DocumentUpload'}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Ok'}}}}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Not found}
  /api/admin/hospitals/{id}/documents/{docId}:
    get:
      tags: ["Admin: Hospitals"]
      summary: "Download / view the stored document file"
      operationId: getApiAdminHospitalsIdDocumentsDocid
      x-access: "kyc.view"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: docId, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: The stored file, content: {application/pdf: {schema: {type: string, format: binary}}, image/png: {schema: {type: string, format: binary}}, image/jpeg: {schema: {type: string, format: binary}}}}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Not found}
    patch:
      tags: ["Admin: Hospitals"]
      summary: "Verify or reject a document (rejection needs a reason)"
      description: "A WITHDRAWN document can't be reviewed (400): upload a new copy instead. Verifying documents does not change the hospital's KYC status by itself; use PATCH /api/admin/hospitals/{id}/kyc"
      operationId: patchApiAdminHospitalsIdDocumentsDocid
      x-access: "kyc.manage"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: docId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DocumentReview'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Ok'}}}}
        '400': {description: "Invalid status, reason missing for REJECTED (fields.reason), or the document is withdrawn", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Not found}
  /api/admin/hospitals/{id}/documents/{docId}/withdraw:
    post:
      tags: ["Admin: Hospitals"]
      summary: "Withdraw a KYC document (uploaded by mistake or superseded)"
      description: "The row and file are kept for audit but the document no longer counts towards KYC and shows as WITHDRAWN in the list. A reason is required. If the hospital's KYC is VERIFIED and the withdrawn document was VERIFIED and leaves the checklist incomplete, KYC goes back to UNDER_REVIEW (kycReason records why) and the message says so. Withdrawing an already withdrawn document is a 400"
      operationId: postApiAdminHospitalsIdDocumentsDocidWithdraw
      x-access: "kyc.manage"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: docId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DocumentWithdraw'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Ok'}}}}
        '400': {description: "Reason missing (fields.reason) or the document is already withdrawn", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Hospital or document not found}
  /api/admin/hospitals/{id}/branches:
    get:
      tags: ["Admin: Hospitals"]
      summary: "List branches"
      operationId: getApiAdminHospitalsIdBranches
      x-access: "branches.view"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/BranchList'}}}}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Not found}
    post:
      tags: ["Admin: Hospitals"]
      summary: "Add a branch"
      operationId: postApiAdminHospitalsIdBranches
      x-access: "branches.manage"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BranchCreate'}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Ok'}}}}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Not found}
  /api/admin/hospitals/{id}/departments:
    get:
      tags: ["Admin: Hospitals"]
      summary: "List the hospital's departments with doctor counts (archived last)"
      operationId: getApiAdminHospitalsIdDepartments
      x-access: "hospitals.view"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/AdminDepartmentList'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Not found}
    post:
      tags: ["Admin: Hospitals"]
      summary: "Add a department"
      description: "Names are unique per hospital (400 on fields.name when it already exists)"
      operationId: postApiAdminHospitalsIdDepartments
      x-access: "hospitals.manage"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DepartmentCreate'}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Ok'}}}}
        '400': {description: Validation error (fields), content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Not found}
  /api/admin/hospitals/{id}/logo:
    post:
      tags: ["Admin: Hospitals"]
      summary: "Upload or replace the hospital logo (multipart `logo`; PNG or JPEG up to 3 MB)"
      description: "The logo is shown in the patient app and the hospital's portal, and served publicly at GET /api/hospital-logos/{file}. The previous file is deleted once nothing points at it. The shared multipart parser accepts PDF, PNG, JPEG and WebP parts up to 8 MB; a missing or oversized (over 8 MB) file is dropped there and answers 'Choose a logo to upload.', and an image between 3 and 8 MB answers 400 'The logo must be 3 MB or smaller.'"
      operationId: postApiAdminHospitalsIdLogo
      x-access: "hospitals.manage"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {$ref: '#/components/schemas/HospitalLogoUpload'}
      responses:
        '200': {description: OK (hospital.logoUrl is the new /api/hospital-logos/... URL), content: {application/json: {schema: {$ref: '#/components/schemas/HospitalResult'}}}}
        '400': {description: "No usable file (fields.logo) or too large", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Not found}
    delete:
      tags: ["Admin: Hospitals"]
      summary: "Remove the hospital logo"
      operationId: deleteApiAdminHospitalsIdLogo
      x-access: "hospitals.manage"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/HospitalResult'}}}}
        '400': {description: The hospital has no logo, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Not found}
  /api/admin/branches/{id}:
    patch:
      tags: ["Admin: Hospitals"]
      summary: "Edit a branch's details and/or activate or deactivate it"
      description: "Send only the fields to change; a blank contactPerson clears it. Use GET /api/admin/branches/{id}/usage to show what a deactivation affects. Deactivating does not touch the doctors or QR codes already tied to the branch, but a deactivated branch can no longer be chosen for a doctor or QR code"
      operationId: patchApiAdminBranchesId
      x-access: "branches.manage"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BranchUpdate'}
      responses:
        '200': {description: "OK (message: 'Branch activated.', 'Branch deactivated.' or 'Branch details saved.')", content: {application/json: {schema: {$ref: '#/components/schemas/Ok'}}}}
        '400': {description: Invalid status or validation error (fields), content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Not found}
