        '4XX': {description: "Error. The body is { error, code }; code is a stable value such as INVALID_OTP, NOT_SIGNED_IN, NOT_LINKED, QR_INVALID, QR_REVOKED, QR_SUSPENDED, SLOT_UNAVAILABLE, DUPLICATE_BOOKING, HOLD_EXPIRED, PAYMENT_DECLINED, PAYMENT_TIMEOUT, PAYMENT_LATE_REFUNDED, LIMIT_REACHED, POLICY or VALIDATION", content: {application/json: {schema: {$ref: '#/components/schemas/PatientError'}}}}
  /api/patient/doctors/{id}/quote:
    get:
      tags: ["Patient"]
      summary: "What the patient pays now and later, in paise"
      operationId: getApiPatientDoctorsIdQuote
      x-access: "patient"
      security:
        - patientBearer: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/FeeBreakdown'}}}}
        '4XX': {description: "Error. The body is { error, code }; code is a stable value such as INVALID_OTP, NOT_SIGNED_IN, NOT_LINKED, QR_INVALID, QR_REVOKED, QR_SUSPENDED, SLOT_UNAVAILABLE, DUPLICATE_BOOKING, HOLD_EXPIRED, PAYMENT_DECLINED, PAYMENT_TIMEOUT, PAYMENT_LATE_REFUNDED, LIMIT_REACHED, POLICY or VALIDATION", content: {application/json: {schema: {$ref: '#/components/schemas/PatientError'}}}}
  /api/patient/holds:
    post:
      tags: ["Patient"]
      summary: "Hold one seat for the booking hold time (10 minutes) while the patient pays"
      operationId: postApiPatientHolds
      x-access: "patient"
      security:
        - patientBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/HoldRequest'}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Hold'}}}}
        '4XX': {description: "Error. The body is { error, code }; code is a stable value such as INVALID_OTP, NOT_SIGNED_IN, NOT_LINKED, QR_INVALID, QR_REVOKED, QR_SUSPENDED, SLOT_UNAVAILABLE, DUPLICATE_BOOKING, HOLD_EXPIRED, PAYMENT_DECLINED, PAYMENT_TIMEOUT, PAYMENT_LATE_REFUNDED, LIMIT_REACHED, POLICY or VALIDATION", content: {application/json: {schema: {$ref: '#/components/schemas/PatientError'}}}}
  /api/patient/holds/{id}:
    delete:
      tags: ["Patient"]
      summary: "Release a hold"
      operationId: deleteApiPatientHoldsId
      x-access: "patient"
      security:
        - patientBearer: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Ok'}}}}
        '4XX': {description: "Error. The body is { error, code }; code is a stable value such as INVALID_OTP, NOT_SIGNED_IN, NOT_LINKED, QR_INVALID, QR_REVOKED, QR_SUSPENDED, SLOT_UNAVAILABLE, DUPLICATE_BOOKING, HOLD_EXPIRED, PAYMENT_DECLINED, PAYMENT_TIMEOUT, PAYMENT_LATE_REFUNDED, LIMIT_REACHED, POLICY or VALIDATION", content: {application/json: {schema: {$ref: '#/components/schemas/PatientError'}}}}
  /api/patient/holds/{id}/pay:
    post:
      tags: ["Patient"]
      summary: "Pay through the simulated gateway and confirm the appointment. The same idempotencyKey never charges twice"
      description: "Charges only the booking token (booking_token_amount). The appointment gets its slot-based token number (appointment.token; seat n of a slot gets that slot's n-th number) and its queue token is issued at once; there is no check-in step."
      operationId: postApiPatientHoldsIdPay
      x-access: "patient"
      security:
        - patientBearer: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PayRequest'}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/AppointmentView'}}}}
        '4XX': {description: "Error. The body is { error, code }; code is a stable value such as INVALID_OTP, NOT_SIGNED_IN, NOT_LINKED, QR_INVALID, QR_REVOKED, QR_SUSPENDED, SLOT_UNAVAILABLE, DUPLICATE_BOOKING, HOLD_EXPIRED, PAYMENT_DECLINED, PAYMENT_TIMEOUT, PAYMENT_LATE_REFUNDED, LIMIT_REACHED, POLICY or VALIDATION", content: {application/json: {schema: {$ref: '#/components/schemas/PatientError'}}}}
  /api/patient/appointments:
    get:
      tags: ["Patient"]
      summary: "My appointments and my family's"
      operationId: getApiPatientAppointments
      x-access: "patient"
      security:
        - patientBearer: []
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/AppointmentViewList'}}}}
        '4XX': {description: "Error. The body is { error, code }; code is a stable value such as INVALID_OTP, NOT_SIGNED_IN, NOT_LINKED, QR_INVALID, QR_REVOKED, QR_SUSPENDED, SLOT_UNAVAILABLE, DUPLICATE_BOOKING, HOLD_EXPIRED, PAYMENT_DECLINED, PAYMENT_TIMEOUT, PAYMENT_LATE_REFUNDED, LIMIT_REACHED, POLICY or VALIDATION", content: {application/json: {schema: {$ref: '#/components/schemas/PatientError'}}}}
  /api/patient/appointments/{id}:
    get:
      tags: ["Patient"]
      summary: "One appointment with its hospital and doctor"
      operationId: getApiPatientAppointmentsId
      x-access: "patient"
      security:
        - patientBearer: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/AppointmentView'}}}}
        '4XX': {description: "Error. The body is { error, code }; code is a stable value such as INVALID_OTP, NOT_SIGNED_IN, NOT_LINKED, QR_INVALID, QR_REVOKED, QR_SUSPENDED, SLOT_UNAVAILABLE, DUPLICATE_BOOKING, HOLD_EXPIRED, PAYMENT_DECLINED, PAYMENT_TIMEOUT, PAYMENT_LATE_REFUNDED, LIMIT_REACHED, POLICY or VALIDATION", content: {application/json: {schema: {$ref: '#/components/schemas/PatientError'}}}}
  /api/patient/appointments/{id}/cancel-quote:
    get:
      tags: ["Patient"]
      summary: "How much would be refunded if cancelled now"
      operationId: getApiPatientAppointmentsIdCancelQuote
      x-access: "patient"
      security:
        - patientBearer: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/RefundQuote'}}}}
        '4XX': {description: "Error. The body is { error, code }; code is a stable value such as INVALID_OTP, NOT_SIGNED_IN, NOT_LINKED, QR_INVALID, QR_REVOKED, QR_SUSPENDED, SLOT_UNAVAILABLE, DUPLICATE_BOOKING, HOLD_EXPIRED, PAYMENT_DECLINED, PAYMENT_TIMEOUT, PAYMENT_LATE_REFUNDED, LIMIT_REACHED, POLICY or VALIDATION", content: {application/json: {schema: {$ref: '#/components/schemas/PatientError'}}}}
  /api/patient/appointments/{id}/cancel:
    post:
      tags: ["Patient"]
      summary: "Cancel a confirmed appointment (refund per the hospital's policy)"
      operationId: postApiPatientAppointmentsIdCancel
      x-access: "patient"
      security:
        - patientBearer: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CancelRequest'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/AppointmentView'}}}}
        '4XX': {description: "Error. The body is { error, code }; code is a stable value such as INVALID_OTP, NOT_SIGNED_IN, NOT_LINKED, QR_INVALID, QR_REVOKED, QR_SUSPENDED, SLOT_UNAVAILABLE, DUPLICATE_BOOKING, HOLD_EXPIRED, PAYMENT_DECLINED, PAYMENT_TIMEOUT, PAYMENT_LATE_REFUNDED, LIMIT_REACHED, POLICY or VALIDATION", content: {application/json: {schema: {$ref: '#/components/schemas/PatientError'}}}}
  /api/patient/appointments/{id}/reschedule-check:
    get:
      tags: ["Patient"]
      summary: "Why rescheduling is not allowed, or null when it is"
      operationId: getApiPatientAppointmentsIdRescheduleCheck
      x-access: "patient"
      security:
        - patientBearer: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/RescheduleBlocker'}}}}
        '4XX': {description: "Error. The body is { error, code }; code is a stable value such as INVALID_OTP, NOT_SIGNED_IN, NOT_LINKED, QR_INVALID, QR_REVOKED, QR_SUSPENDED, SLOT_UNAVAILABLE, DUPLICATE_BOOKING, HOLD_EXPIRED, PAYMENT_DECLINED, PAYMENT_TIMEOUT, PAYMENT_LATE_REFUNDED, LIMIT_REACHED, POLICY or VALIDATION", content: {application/json: {schema: {$ref: '#/components/schemas/PatientError'}}}}
  /api/patient/appointments/{id}/reschedule:
    post:
      tags: ["Patient"]
      summary: "Move to another slot of the same doctor (once, up to 2 hours before)"
      description: "The appointment takes the new slot's token number and its queue token moves with it. Refused once the patient has been called or is with the doctor."
      operationId: postApiPatientAppointmentsIdReschedule
      x-access: "patient"
      security:
        - patientBearer: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RescheduleRequest'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/AppointmentView'}}}}
        '4XX': {description: "Error. The body is { error, code }; code is a stable value such as INVALID_OTP, NOT_SIGNED_IN, NOT_LINKED, QR_INVALID, QR_REVOKED, QR_SUSPENDED, SLOT_UNAVAILABLE, DUPLICATE_BOOKING, HOLD_EXPIRED, PAYMENT_DECLINED, PAYMENT_TIMEOUT, PAYMENT_LATE_REFUNDED, LIMIT_REACHED, POLICY or VALIDATION", content: {application/json: {schema: {$ref: '#/components/schemas/PatientError'}}}}
  /api/patient/notifications:
    get:
      tags: ["Patient"]
      summary: "Booking, payment and cancellation notifications"
      operationId: getApiPatientNotifications
      x-access: "patient"
      security:
        - patientBearer: []
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/PatientNotifications'}}}}
        '4XX': {description: "Error. The body is { error, code }; code is a stable value such as INVALID_OTP, NOT_SIGNED_IN, NOT_LINKED, QR_INVALID, QR_REVOKED, QR_SUSPENDED, SLOT_UNAVAILABLE, DUPLICATE_BOOKING, HOLD_EXPIRED, PAYMENT_DECLINED, PAYMENT_TIMEOUT, PAYMENT_LATE_REFUNDED, LIMIT_REACHED, POLICY or VALIDATION", content: {application/json: {schema: {$ref: '#/components/schemas/PatientError'}}}}
  /api/patient/notifications/read:
    post:
      tags: ["Patient"]
      summary: "Mark all notifications read"
      operationId: postApiPatientNotificationsRead
      x-access: "patient"
      security:
        - patientBearer: []
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/NotificationsReadResult'}}}}
        '4XX': {description: "Error. The body is { error, code }; code is a stable value such as INVALID_OTP, NOT_SIGNED_IN, NOT_LINKED, QR_INVALID, QR_REVOKED, QR_SUSPENDED, SLOT_UNAVAILABLE, DUPLICATE_BOOKING, HOLD_EXPIRED, PAYMENT_DECLINED, PAYMENT_TIMEOUT, PAYMENT_LATE_REFUNDED, LIMIT_REACHED, POLICY or VALIDATION", content: {application/json: {schema: {$ref: '#/components/schemas/PatientError'}}}}
  /api/patient/app-version:
    get:
      tags: ["Patient"]
      summary: "Check whether the installed app build is too old or a newer one is available (no sign-in needed)"
      description: "Called at app start-up, before sign-in. updateRequired is true only when the admin turned on forceUpdate for the platform and the installed version is below minSupportedVersion; updateAvailable is true whenever the installed version is below latestVersion. Unknown platform returns 422 UNKNOWN_PLATFORM; a version that is not x.y.z returns 422 INVALID_VERSION."
      operationId: getApiPatientAppVersion
      x-access: "public"
      security: []
      parameters:
        - {name: platform, in: query, required: true, description: "Case-insensitive", schema: {type: string, enum: [ANDROID, IOS]}}
        - {name: version, in: query, required: true, description: "Installed version as x.y.z", schema: {type: string, example: 1.3.0}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/PatientAppVersionCheck'}}}}
        '4XX': {description: "Error. The body is { error, code }; code is a stable value such as INVALID_OTP, NOT_SIGNED_IN, NOT_LINKED, QR_INVALID, QR_REVOKED, QR_SUSPENDED, SLOT_UNAVAILABLE, DUPLICATE_BOOKING, HOLD_EXPIRED, PAYMENT_DECLINED, PAYMENT_TIMEOUT, PAYMENT_LATE_REFUNDED, LIMIT_REACHED, POLICY or VALIDATION", content: {application/json: {schema: {$ref: '#/components/schemas/PatientError'}}}}
  /api/doctor-photos/{file}:
    get:
      tags: ["Public"]
      summary: "Doctor profile photo (public image file)"
      description: "Used by the portals and the patient app via the photoUrl on a doctor. Only a file that some doctor's photo currently points at is served (404 otherwise). Cached for a day."
      operationId: getApiDoctorPhotosFile
      x-access: "public"
      security: []
      parameters:
        - {name: file, in: path, required: true, schema: {type: string}, description: File name as given in photoUrl}
      responses:
        '200':
          description: The image
          headers:
            Cache-Control: {schema: {type: string, example: "public, max-age=86400"}}
          content:
            image/png: {schema: {type: string, format: binary}}
            image/jpeg: {schema: {type: string, format: binary}}
            image/webp: {schema: {type: string, format: binary}}
        '404': {description: Not found, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/hospital-logos/{file}:
    get:
      tags: ["Public"]
      summary: "Hospital logo image (no sign-in)"
      description: "Only files that a hospital's logoUrl points at are served (404 otherwise). Cached for a day. logoUrl values in hospital JSON are paths of this form (relative to the API host)"
      operationId: getApiHospitalLogosFile
      x-access: "public"
      security: []
      parameters:
        - {name: file, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: The logo image, content: {image/png: {schema: {type: string, format: binary}}, image/jpeg: {schema: {type: string, format: binary}}}}
        '404': {description: No hospital uses this file, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
components:
  securitySchemes:
    sessionCookie: {type: apiKey, in: cookie, name: gmedic.sid}
    internalKey: {type: apiKey, in: header, name: x-internal-key, description: Value of the INTERNAL_EVENT_KEY env var}
    patientBearer: {type: http, scheme: bearer, description: Token returned by POST /api/patient/auth/verify}
  schemas:
    PatientError:
      type: object
      required: [error, code]
      properties:
        error: {type: string, description: A message that can be shown to the patient}
        code: {type: string}
        fields: {type: object, additionalProperties: {type: string}}
    PatientOtpRequest:
      type: object
      required: [phone]
      properties:
        phone: {type: string, example: "9876543210", description: 10-digit Indian mobile number (+91 / 0 prefixes are accepted)}
    PatientOtpSent:
      type: object
      properties:
        ok: {type: boolean}
        expiresInSeconds: {type: integer, example: 300}
        mode: {type: string, enum: [dev], description: In dev mode the code is PATIENT_DEV_OTP. Without an SMS provider the real mode answers 501}
    PatientVerifyRequest:
      type: object
      required: [phone, code]
      properties:
        phone: {type: string}
        code: {type: string, example: "123456"}
    PatientUser:
      type: object
      properties:
        id: {type: string, example: USR2001}
        phone: {type: string}
        name: {type: string, nullable: true}
        dob: {type: string, format: date, nullable: true}
        gender: {type: string, enum: [male, female, other, null], nullable: true}
        profileComplete: {type: boolean}
    PatientSession:
      type: object
      properties:
        token: {type: string, description: Send as Authorization Bearer <token>}
        user: {$ref: '#/components/schemas/PatientUser'}
    PatientProfileUpdate:
      type: object
      required: [name, dob, gender]
      properties:
        name: {type: string, minLength: 2, maxLength: 60}
        dob: {type: string, format: date}
        gender: {type: string, enum: [male, female, other]}
    FamilyMember:
      type: object
      properties:
        id: {type: string, description: "The account holder's own entry uses the user id"}
        name: {type: string}
        relation: {type: string, enum: [self, spouse, child, parent, sibling, other]}
        dob: {type: string, format: date, nullable: true}
        gender: {type: string, enum: [male, female, other]}
    FamilyMemberCreate:
      type: object
      required: [name, relation, dob, gender]
      properties:
        name: {type: string}
        relation: {type: string, enum: [spouse, child, parent, sibling, other]}
        dob: {type: string, format: date}
        gender: {type: string, enum: [male, female, other]}
    FamilyMemberUpdate:
      type: object
      description: Send only the fields to change
      properties:
        name: {type: string}
        relation: {type: string, enum: [spouse, child, parent, sibling, other]}
        dob: {type: string, format: date}
        gender: {type: string, enum: [male, female, other]}
    FamilyList:
      type: object
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/FamilyMember'}}
    QrResolveRequest:
      type: object
      required: [raw]
      properties:
        raw: {type: string, example: "https://gmedic.app/h/HSP001?k=a55cbe027beac2cfbcf40d82", description: "A scanned QR payload, a gmedic:// deep link or a bare hospital code"}
    PatientHospital:
      type: object
      properties:
        id: {type: string, example: HSP001}
        code: {type: string, example: HSP001}
        name: {type: string}
        kind: {type: string, example: Multispecialty hospital}
        address: {type: string}
        area: {type: string}
        phone: {type: string}
        lat: {type: number}
        lng: {type: number}
        feeModel: {type: string, enum: [fullPrepay, bookingFee, tokenFee]}
        bookingFeePaise: {type: integer}
        tokenFeePaise: {type: integer}
        convenienceFeePaise: {type: integer}
        status: {type: string, enum: [active, suspended]}
        brandColor: {type: integer, description: ARGB colour}
        initials: {type: string}
        gstin: {type: string}
        about: {type: string}
        logoUrl: {type: string, nullable: true, example: /api/hospital-logos/1760000000000-ab12cd34.png, description: "Hospital logo path relative to the API host (GET /api/hospital-logos/{file}); null when none is set"}
    PatientHospitalList:
      type: object
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/PatientHospital'}}
    QrResolution:
      type: object
      properties:
        hospital: {$ref: '#/components/schemas/PatientHospital'}
        alreadyLinked: {type: boolean}
        qrKeyId: {type: string, description: Pass back to the link endpoint}
    LinkRequest:
      type: object
      required: [qrKeyId]
      properties:
        qrKeyId: {type: string}
    DepartmentList:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties: {id: {type: string}, hospitalId: {type: string}, name: {type: string}, icon: {type: string, example: heart}}
    ScheduleSession:
      type: object
      properties:
        weekday: {type: integer, minimum: 1, maximum: 7, description: 1 = Monday ... 7 = Sunday}
        startMinute: {type: integer, description: Minutes after midnight}
        endMinute: {type: integer}
        slotMinutes: {type: integer}
        perSlot: {type: integer, description: Patients per slot}
    PatientDoctor:
      type: object
      properties:
        id: {type: string}
        hospitalId: {type: string}
        departmentId: {type: string}
        name: {type: string}
        qualifications: {type: string}
        specialty: {type: string}
        experienceYears: {type: integer}
        languages: {type: array, items: {type: string}}
        feePaise: {type: integer}
        gender: {type: string, enum: [male, female, other]}
        about: {type: string}
        schedule: {type: array, items: {$ref: '#/components/schemas/ScheduleSession'}}
        onLeave: {type: boolean}
        leaveNote: {type: string, nullable: true}
    DoctorSummaryList:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              doctor: {$ref: '#/components/schemas/PatientDoctor'}
              nextAvailable: {type: string, format: date-time, nullable: true}
    PatientSlot:
      type: object
      properties:
        id: {type: string, example: DOC101_202610081030}
        doctorId: {type: string}
        start: {type: string, format: date-time, description: Hospital local time with its UTC offset}
        end: {type: string, format: date-time}
        status: {type: string, enum: [available, full, unavailable]}
        seatsLeft: {type: integer}
        capacity: {type: integer}
    SlotList:
      type: object
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/PatientSlot'}}
    NextAvailableDay:
      type: object
      properties:
        date: {type: string, format: date, nullable: true}
    FeeBreakdown:
      type: object
      properties:
        model: {type: string, enum: [fullPrepay, bookingFee, tokenFee]}
        consultationPaise: {type: integer}
        payNowBasePaise: {type: integer}
        convenienceFeePaise: {type: integer}
        gstPaise: {type: integer}
        totalNowPaise: {type: integer}
        payAtHospitalPaise: {type: integer}
        payNowLabel: {type: string}
    HoldRequest:
      type: object
      required: [slotId, patientId]
      properties:
        slotId: {type: string}
        patientId: {type: string, description: "The user id for the account holder, or a family member's id"}
    Hold:
      type: object
      properties:
        id: {type: string}
        slot: {$ref: '#/components/schemas/PatientSlot'}
        patientId: {type: string}
        expiresAt: {type: string, format: date-time}
        ttlSeconds: {type: integer, example: 600}
    PayRequest:
      type: object
      required: [method, idempotencyKey]
      properties:
        method: {type: string, enum: [upi, card, netbanking, wallet]}
        idempotencyKey: {type: string, minLength: 8, maxLength: 80, description: A new random value per payment attempt; reuse it only to retry the same attempt}
        reason: {type: string, maxLength: 300, description: Reason for the visit}
    PatientAppointment:
      type: object
      properties:
        id: {type: string, example: APT10557}
        code: {type: string, example: GM-0007MQ}
        hospitalId: {type: string}
        doctorId: {type: string}
        patient: {$ref: '#/components/schemas/FamilyMember'}
        start: {type: string, format: date-time}
        end: {type: string, format: date-time}
        token: {type: integer, description: "Number in the doctor's queue for the day, never reused"}
        status: {type: string, enum: [confirmed, checkedIn, inConsultation, completed, cancelled, noShow]}
        fees: {$ref: '#/components/schemas/FeeBreakdown'}
        payment:
          type: object
          nullable: true
          properties:
            id: {type: string}
            gatewayRef: {type: string}
            amountPaise: {type: integer}
            method: {type: string, enum: [upi, card, netbanking, wallet]}
            paidAt: {type: string, format: date-time}
            status: {type: string, enum: [paid, refunded, partiallyRefunded]}
        createdAt: {type: string, format: date-time}
        reason: {type: string, nullable: true}
        refund:
          type: object
          nullable: true
          properties:
            amountPaise: {type: integer}
            status: {type: string, enum: [initiated, completed]}
            createdAt: {type: string, format: date-time}
            reason: {type: string}
        rescheduleCount: {type: integer}
        queueAhead: {type: integer, nullable: true, description: Patients ahead once the patient is checked in}
        currentToken: {type: string, nullable: true, description: "Token code the doctor is attending now (status in_consultation) on this appointment day, e.g. T005. Null when nobody is in consultation, the appointment is closed, or live_queue is off."}
        cancelledAt: {type: string, format: date-time, nullable: true}
        cancelReason: {type: string, nullable: true}
        checkedInAt: {type: string, format: date-time, nullable: true}
    AppointmentView:
      type: object
      properties:
        appointment: {$ref: '#/components/schemas/PatientAppointment'}
        hospital: {$ref: '#/components/schemas/PatientHospital'}
        doctor: {$ref: '#/components/schemas/PatientDoctor'}
    AppointmentViewList:
      type: object
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/AppointmentView'}}
    RefundQuote:
      type: object
      properties:
        refundPaise: {type: integer}
        paidPaise: {type: integer}
        withinFreeWindow: {type: boolean}
        note: {type: string}
    CancelRequest:
      type: object
      properties:
        reason: {type: string, maxLength: 300}
    RescheduleBlocker:
      type: object
      properties:
        blocker: {type: string, nullable: true}
    RescheduleRequest:
      type: object
      required: [slotId]
      properties:
        slotId: {type: string}
    PatientNotifications:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              id: {type: string}
              type: {type: string, example: system}
              eventKey: {type: string, example: APPOINTMENT_CONFIRMED}
              title: {type: string}
              body: {type: string}
              link: {type: string, nullable: true}
              at: {type: string, format: date-time}
              unread: {type: boolean}
        unread: {type: integer}
    DoctorAppointmentStatus:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [completed, cancelled], description: "`completed` only (on or after the appointment date). `cancelled` is still accepted for older clients and is forwarded to the cancel action, which needs `reason`"}
        reason: {type: string, maxLength: 300, description: Required when status is cancelled}
    QueueCallNext:
      type: object
      description: Calls the lowest-numbered waiting token. Only today's queue can be worked
      properties:
        date: {type: string, format: date, description: Defaults to today; any other day is refused with 400}
    DoctorProfileUpdate:
      type: object
      description: A doctor can edit only these fields (specialization, fee and registration stay admin-managed). Only the fields sent are changed
      properties:
        bio: {type: string, maxLength: 500}
        languages: {type: string, maxLength: 120, example: "English, Hindi, Tamil", description: Comma-separated}
        yearsExperience: {type: integer, nullable: true, minimum: 0, maximum: 70, description: "Whole years. null or an empty string clears the value (it is never stored as 0)"}
    DoctorProfileResult:
      type: object
      properties:
        ok: {type: boolean}
        message: {type: string}
        doctor: {$ref: '#/components/schemas/DocDoctor'}
    NotificationList:
      type: object
      properties:
        items:
          type: array
          description: The user's stored notifications, newest first (latest 20). Shared by the receptionist and doctor portals
          items:
            type: object
            required: [id, type, unread]
            properties:
              id: {type: string, example: n-12, description: "Pass to POST /api/notifications/{id}/read"}
              type: {type: string, enum: [system]}
              eventKey: {type: string, example: NEW_APPOINTMENT}
              title: {type: string}
              body: {type: string}
              link: {type: string, nullable: true, description: Portal page to open}
              at: {type: string, format: date-time}
              unread: {type: boolean}
        unread: {type: integer, description: Total unread, not only those listed}
    AppointmentStatus:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [confirmed, pending, completed], description: "Must be one of the appointment's nextStatuses. Cancelling uses POST /api/appointments/{id}/cancel (sending cancelled returns 400). Completed, cancelled and no-show appointments are final. Completing also completes the queue token and is allowed only from the appointment date on."}
    AppointmentCancelQuote:
      type: object
      properties:
        blocker: {type: string, nullable: true, description: "Why it cannot be cancelled (already cancelled, completed, in consultation, marked no-show); null when it can"}
        refundPaise: {type: integer, description: "Refund that cancelling now would give, never more than is still refundable. 0 for a fee collected at the desk"}
        paidPaise: {type: integer}
        alreadyRefundedPaise: {type: integer, description: Non-rejected refunds already requested or paid on the payment}
        withinFreeWindow: {type: boolean}
        note: {type: string}
    AppointmentResult:
      type: object
      properties:
        ok: {type: boolean}
        message: {type: string}
        appointment: {$ref: '#/components/schemas/RecAppointmentDetail/properties/appointment'}
    DoctorCreate:
      type: object
      required: [name, specialization, fee, availability]
      properties:
        name: {type: string, minLength: 3, maxLength: 60, pattern: "^(dr\\.?\\s*)?[A-Za-z][A-Za-z .'-]*$", description: "Letters, spaces, dots, apostrophes and hyphens. Stored with a single Dr. prefix"}
        specialization: {type: string, description: One of the configured specializations}
        fee: {type: integer, minimum: 50, maximum: 20000}
        availability: {type: string, enum: [present, absent]}
    DoctorEdit:
      type: object
      description: Same fields as DoctorCreate, all optional (send only what changes)
      properties:
        name: {type: string, minLength: 3, maxLength: 60}
        specialization: {type: string}
        fee: {type: integer, minimum: 50, maximum: 20000}
        availability: {type: string, enum: [present, absent]}
    RecDoctorResult:
      type: object
      properties:
        ok: {type: boolean}
        message: {type: string}
        doctor: {$ref: '#/components/schemas/RecDoctor'}
    AvailabilityBulk:
      type: object
      required: [changes]
      properties:
        changes:
          type: array
          items:
            type: object
            required: [id, availability]
            properties: {id: {type: string, example: DOC101}, availability: {type: string, enum: [present, absent]}}
    AvailabilityBulkResult:
      type: object
      properties:
        ok: {type: boolean}
        message: {type: string}
        updated: {type: array, items: {type: string}, description: Ids of doctors that actually changed}
    TokenCreate:
      type: object
      required: [appointmentId]
      description: The appointment must not be cancelled, completed or a no-show, must be dated today or later, and must not already have a live token. Payment is not required
      properties:
        appointmentId: {type: string, example: APT10555}
    TokenStatus:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [waiting, called, in_consultation, completed, cancelled, skipped], description: Must be one of the token's nextStatuses. A cancelled or completed token cannot be changed}
    TokenResult:
      type: object
      properties:
        ok: {type: boolean}
        message: {type: string}
        token: {$ref: '#/components/schemas/RecToken'}
    HospitalProfile:
      type: object
      required: [phone, email, address]
      description: The receptionist can edit contact details and address only, not the hospital's name, fees, status, logo or about
      properties:
        phone: {type: string, description: 10 to 15 digits}
        email: {type: string, format: email}
        address:
          type: object
          required: [line1, city, state, pincode]
          properties:
            line1: {type: string, minLength: 5, maxLength: 160}
            city: {type: string, maxLength: 60, description: "Letters, spaces, dots, apostrophes and hyphens"}
            state: {type: string, maxLength: 60, description: "Letters, spaces, dots, apostrophes and hyphens"}
            pincode: {type: string, pattern: '^[0-9]{6}$'}
    RecHospitalResult:
      type: object
      properties:
        ok: {type: boolean}
        message: {type: string}
        hospital: {$ref: '#/components/schemas/RecHospital/properties/hospital'}
    ProfileUpdate:
      type: object
      required: [name, phone]
      properties:
        name: {type: string, minLength: 3, maxLength: 60, pattern: "^[A-Za-z][A-Za-z .'-]*$"}
        phone: {type: string, description: 10 to 15 digits}
    ProfileResult:
      type: object
      properties:
        ok: {type: boolean}
        message: {type: string}
        user: {$ref: '#/components/schemas/RecMe/properties/user'}
    NotificationsReadResult:
      type: object
      properties:
        ok: {type: boolean}
        unread: {type: integer}
    TicketCreated:
      type: object
      properties:
        ok: {type: boolean}
        message: {type: string}
        ticket: {$ref: '#/components/schemas/RecTicket'}
    TicketReply:
      type: object
      properties:
        ok: {type: boolean}
        message: {type: string}
        messages: {type: array, items: {type: object, additionalProperties: true}, description: The full conversation after the reply}
    AnnouncementCreate:
      type: object
      required:
      - title
      - message
      description: Used to create a draft (POST) and to correct one (PATCH). target ALL (default) reaches every hospital; SELECTED needs hospitalIds.
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 160
        message:
          type: string
          minLength: 5
          maxLength: 1000
        target:
          type: string
          enum:
          - ALL
          - SELECTED
          default: ALL
        hospitalIds:
          type: array
          items:
            type: string
          description: Required (at least one existing hospital) when target is SELECTED; ignored for ALL
    AnnouncementStatus:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [PUBLISHED, ARCHIVED], description: "PUBLISHED needs communications.announcements.publish, ARCHIVED needs ...archive; an archived announcement cannot be republished"}
    TemplateStatus:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [ACTIVE, INACTIVE], description: Enable or disable the template (separate permissions)}
    ActiveStatus:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [ACTIVE, INACTIVE]}
    DoctorUpdate:
      type: object
      description: Send only the fields to change
      properties:
        name: {type: string, minLength: 3, maxLength: 80, description: "Letters, spaces, dots, apostrophes and hyphens; a leading \"Dr.\" is added if missing"}
        bio: {type: string, maxLength: 1000, description: About text; empty clears it}
        specialization: {type: string, description: One of the configured specializations}
        fee: {type: integer, minimum: 50, maximum: 20000}
        department: {type: string, maxLength: 80, description: Created in the departments table if new; empty clears it}
        qualifications: {type: string, maxLength: 160}
        registrationNumber: {type: string, maxLength: 40, description: Unique across doctors; empty clears it}
        branchId: {type: string, nullable: true, description: An active branch of the doctor's hospital; empty or null clears it}
    DoctorVerification:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [PENDING, VERIFIED, REJECTED]}
        note: {type: string, description: Required when REJECTED}
    DoctorResult:
      type: object
      properties:
        ok: {type: boolean}
        message: {type: string}
        doctor: {$ref: '#/components/schemas/AdminDoctor'}
        reverificationRequired: {type: boolean, description: "Update only: true when a VERIFIED doctor's registration number changed, which moves verification back to PENDING"}
    ReceptionistCreate:
      type: object
      required: [name, email, phone, hospitalId]
      properties:
        name: {type: string, minLength: 3, maxLength: 60}
        email: {type: string, format: email, description: Must not belong to another account}
        phone: {type: string, description: 10-15 digits; compared by its last 10 digits with every other account}
        hospitalId: {type: string, example: HSP001, description: Any hospital that is not OFFBOARDED}
    ReceptionistCreated:
      type: object
      properties:
        ok: {type: boolean}
        message: {type: string}
        credentials: {$ref: '#/components/schemas/LoginCredentials'}
        receptionist:
          type: object
          description: Kept for older clients; use credentials
          properties: {id: {type: string}, username: {type: string}, tempPassword: {type: string, description: Shown once; the user must change it at first login}}
    TempPassword:
      type: object
      properties:
        ok: {type: boolean}
        message: {type: string}
        tempPassword: {type: string, description: Same value as credentials.tempPassword (older clients)}
        credentials: {$ref: '#/components/schemas/LoginCredentials'}
    QrCreate:
      type: object
      required: [hospitalId, deskLabel]
      properties:
        hospitalId: {type: string}
        deskLabel: {type: string, maxLength: 60}
        branchId: {type: string, nullable: true, description: "Optional: an active branch of the same hospital; blank / null means no branch"}
    QrRevoke:
      type: object
      required: [reason]
      properties:
        reason: {type: string}
    SettingUpdate:
      type: object
      required:
      - key
      - value
      properties:
        key:
          type: string
          enum:
          - booking_window_days
          - appointment_hold_minutes
          - cancellation_cutoff_hours
          - no_show_grace_minutes
          - refund_maker_checker_threshold
          example: appointment_hold_minutes
        value:
          type: integer
          description: Whole number within the setting's min and max (see GET /api/admin/settings); a numeric string is accepted
    AppVersionUpdate:
      type: object
      description: 'Partial update: only the fields sent change. minSupportedVersion cannot be above latestVersion.'
      properties:
        minSupportedVersion:
          type: string
          pattern: ^\d+\.\d+\.\d+$
          example: 1.2.0
        latestVersion:
          type: string
          pattern: ^\d+\.\d+\.\d+$
          example: 1.4.0
        forceUpdate:
          type: boolean
          description: When true, builds below minSupportedVersion must update (updateRequired in GET /api/patient/app-version)
        updateMessage:
          type: string
          maxLength: 300
          description: Empty string clears it
    LoginResponse:
      type: object
      properties:
        ok: {type: boolean}
        redirect: {type: string, example: /admin/dashboard, description: Where the portal sends the user next (honours a safe `next`)}
    LogoutResponse:
      type: object
      properties: {ok: {type: boolean}, redirect: {type: string, example: "/login?loggedOut=1"}}
    InternalEventResult:
      type: object
      properties:
        ok: {type: boolean}
        event: {type: string, example: New Appointment}
        delivered: {type: integer, description: Recipients that got an in-app notification}
        results: {type: array, items: {type: object, additionalProperties: true}, description: "One entry per recipient: DELIVERED, SKIPPED, FAILED or UNAVAILABLE"}
    DisputeNotes:
      type: object
      properties:
        notes:
          type: array
          items:
            type: object
            properties: {id: {type: integer}, userName: {type: string}, note: {type: string}, createdAt: {type: string, format: date-time}}
    NotificationLogs:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: true
            description: Delivery attempt (eventKey, recipient, channel, status DELIVERED / SKIPPED / FAILED / UNAVAILABLE, failureReason, createdAt)
        total: {type: integer}
        page: {type: integer}
        pageSize: {type: integer}
        pages: {type: integer}
    Hospital:
      type: object
      properties:
        id: {type: string, example: HSP001}
        name: {type: string}
        address: {type: object, properties: {line1: {type: string}, city: {type: string}, state: {type: string}, pincode: {type: string}}}
        contactPerson: {type: string, nullable: true}
        phone: {type: string}
        email: {type: string}
        gstin: {type: string, nullable: true}
        registrationNumber: {type: string, nullable: true}
        logoUrl: {type: string, nullable: true, description: "Logo path relative to the API host (GET /api/hospital-logos/{file}); null when none is set"}
        about: {type: string, nullable: true, description: "Shown in the patient app and the hospital's portal (max 600 characters)"}
        status: {type: string, enum: [ONBOARDING, ACTIVE, SUSPENDED, OFFBOARDED]}
        statusReason: {type: string, nullable: true}
        kycStatus: {type: string, enum: [PENDING, UNDER_REVIEW, VERIFIED, REJECTED]}
        nextStatuses: {type: array, items: {type: string, enum: [ACTIVE, SUSPENDED, OFFBOARDED]}, description: "Statuses PATCH /status accepts from the current one (empty once OFFBOARDED)"}
        kycReason: {type: string, nullable: true, description: "Reason given with the last KYC decision (rejection reason, or why Verified went back to review)"}
        kycDecidedAt: {type: string, format: date-time, nullable: true}
        bookingModel: {type: string, enum: [FULL_PREPAY, BOOKING_FEE, TOKEN]}
        bookingFee: {type: number}
        convenienceFee: {type: number}
        commissionType: {type: string, enum: [PERCENT, FLAT]}
        commissionValue: {type: number}
        currency: {type: string, example: INR}
        timezone: {type: string, example: Asia/Kolkata}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    HospitalList:
      type: object
      properties:
        items:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/Hospital'
              - {type: object, properties: {doctorCount: {type: integer}}}
        total: {type: integer}
        page: {type: integer}
        pageSize: {type: integer}
        pages: {type: integer}
        summary: {type: object, description: Hospital count per status across the platform, properties: {ONBOARDING: {type: integer}, ACTIVE: {type: integer}, SUSPENDED: {type: integer}, OFFBOARDED: {type: integer}}}
    HospitalDetail:
      type: object
      properties:
        hospital: {$ref: '#/components/schemas/Hospital'}
        kycChecklist: {$ref: '#/components/schemas/KycChecklist'}
        stats: {type: object, properties: {branches: {type: integer}, doctors: {type: integer}, receptionists: {type: integer}, appointments: {type: integer}}}
    HospitalResult:
      type: object
      properties:
        ok: {type: boolean}
        message: {type: string}
        hospital: {$ref: '#/components/schemas/Hospital'}
        kycReviewRequired: {type: boolean, description: "True when a GSTIN / registration change sent Verified KYC back to Under review"}
    HospitalCreate:
      type: object
      required: [name, phone, email, line1, city, state, pincode]
      properties:
        name: {type: string, minLength: 3, maxLength: 120}
        phone: {type: string, example: "+91 98765 43210"}
        email: {type: string, format: email}
        contactPerson: {type: string, maxLength: 80}
        line1: {type: string, minLength: 5, maxLength: 160, description: Street address}
        city: {type: string, maxLength: 60}
        state: {type: string, maxLength: 60}
        pincode: {type: string, pattern: '^[0-9]{6}$'}
        gstin: {type: string, pattern: '^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]$', description: "Optional at creation; a KYC detail usually added later via PUT /api/admin/hospitals/{id}"}
        registrationNumber: {type: string, maxLength: 40}
    HospitalUpdate:
      type: object
      description: Same fields as HospitalCreate plus about, all optional
      properties:
        name: {type: string}
        phone: {type: string}
        email: {type: string, format: email}
        contactPerson: {type: string, description: "Blank clears it"}
        line1: {type: string}
        city: {type: string}
        state: {type: string}
        pincode: {type: string, pattern: '^[0-9]{6}$'}
        about: {type: string, maxLength: 600, description: "Shown in the patient app and the hospital's portal; blank clears it"}
        gstin: {type: string, pattern: '^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]$', description: "Blank keeps the stored GSTIN; use clear to remove it."}
        registrationNumber: {type: string, maxLength: 40, description: "Blank keeps the stored number; use clear to remove it."}
        clear:
          type: array
          items: {type: string, enum: [gstin, registrationNumber]}
          description: "Removes these identifiers (stored as null). Cannot be combined with a new value for the same field. On Verified KYC, changing or removing either sends KYC back to UNDER_REVIEW."
    HospitalStatus:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [ONBOARDING, ACTIVE, SUSPENDED, OFFBOARDED], description: "Must be one of the hospital's nextStatuses (ONBOARDING is never a valid target)"}
        reason: {type: string, maxLength: 300, description: "Required for SUSPENDED and OFFBOARDED (longer text is cut to 300 characters)"}
    KycStatus:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [PENDING, UNDER_REVIEW, VERIFIED, REJECTED]}
        reason: {type: string, maxLength: 300, description: "Required for REJECTED (longer text is cut to 300 characters)"}
    DocumentUpload:
      type: object
      required: [docType, file]
      properties:
        docType: {type: string, enum: [LICENCE, BANK_PROOF, GST_CERTIFICATE, REGISTRATION]}
        file: {type: string, format: binary, description: "PDF, PNG or JPEG up to 8 MB"}
    DocumentReview:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [VERIFIED, REJECTED]}
        reason: {type: string, description: Required when REJECTED}
    DocumentList:
      type: object
      properties:
        documents:
          type: array
          description: Newest first; withdrawn documents are included
          items:
            type: object
            properties:
              id: {type: string, example: DOC1}
              docType: {type: string}
              fileName: {type: string}
              status: {type: string, enum: [PENDING, VERIFIED, REJECTED, WITHDRAWN]}
              rejectionReason: {type: string, nullable: true}
              reviewerName: {type: string, nullable: true}
              reviewedAt: {type: string, format: date-time, nullable: true}
              createdAt: {type: string, format: date-time}
              withdrawnReason: {type: string, nullable: true}
              withdrawnAt: {type: string, format: date-time, nullable: true}
    BranchList:
      type: object
      properties:
        branches:
          type: array
          items:
            type: object
            properties: {id: {type: string, example: BR1}, name: {type: string}, address: {type: string}, contactPerson: {type: string, nullable: true}, phone: {type: string}, status: {type: string, enum: [ACTIVE, INACTIVE]}}
    BranchCreate:
      type: object
      required: [name, address, phone]
      properties:
        name: {type: string, minLength: 2, maxLength: 120}
        address: {type: string, minLength: 5, maxLength: 255}
        phone: {type: string}
        contactPerson: {type: string, maxLength: 80}
    BranchUpdate:
      type: object
      description: Send only the fields to change
      properties:
        name: {type: string, minLength: 2, maxLength: 120}
        address: {type: string, minLength: 5, maxLength: 255}
        phone: {type: string}
        contactPerson: {type: string, maxLength: 80, description: "Blank clears it"}
        status: {type: string, enum: [ACTIVE, INACTIVE]}
    DashboardSummary:
      type: object
      required:
      - cards
      - bookingTrend
      - revenueTrend
      - qrFunnel
      - hospitalGrowth
      - recentHospitals
      - recentAppointments
      - pending
      properties:
        cards:
          type: object
          properties:
            totalHospitals:
              type: integer
            activeHospitals:
              type: integer
            suspendedHospitals:
              type: integer
            totalDoctors:
              type: integer
            totalReceptionists:
              type: integer
            totalPatients:
              type: integer
            todayAppointments:
              type: integer
              description: Non-cancelled appointments dated today
            todayRevenue:
              type: number
              description: PAID payments captured today (INR)
            paymentSuccessRate:
              type: integer
              minimum: 0
              maximum: 100
              description: Paid / (paid + failed) over the last 30 days; 100 when there were no attempts
            pendingKyc:
              type: integer
              description: Hospitals with KYC PENDING or UNDER_REVIEW
            pendingRefunds:
              type: integer
            todayQrScans:
              type: integer
            pendingDoctorVerification:
              type: integer
              description: Doctors awaiting verification
            openSupportTickets:
              type: integer
              description: Tickets still OPEN (not yet picked up); In Progress tickets are not counted, so it matches the Support page Open tab the dashboard links to
            failedPayments:
              type: integer
              description: Payments with status FAILED (all time)
        bookingTrend:
          type: array
          description: Last 14 days, one row per appointment date that has data
          items:
            type: object
            properties:
              date:
                type: string
                format: date
              booked:
                type: integer
              completed:
                type: integer
              cancelled:
                type: integer
        revenueTrend:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                format: date
              gross:
                type: number
              refunded:
                type: number
        qrFunnel:
          type: object
          description: QR funnel over the last 30 days, counted in scans at every stage so each is a subset of the previous one
          properties:
            scans:
              type: integer
              description: All QR scans
            linked:
              type: integer
              description: Scans that linked the patient to the hospital (LINKED or ALREADY_LINKED)
            bookings:
