        '404': {description: Unknown platform}
  /api/admin/audit-logs:
    get:
      tags: ["Admin: Audit"]
      summary: "Audit logs"
      description: "Newest first. q matches the summary, user name or entity id (LIKE wildcards are escaped). from and to are dates (to includes that whole day). pageSize defaults to 30 (max 100). The response also returns the distinct actions, entity types and users seen in the log, to fill the filters."
      operationId: getApiAdminAuditLogs
      x-access: "audit_logs.view"
      parameters:
        - {name: action, in: query, schema: {type: string}}
        - {name: entityType, in: query, schema: {type: string}}
        - {name: userId, in: query, schema: {type: string}}
        - {name: q, in: query, schema: {type: string}}
        - {name: from, in: query, description: "On or after this date (YYYY-MM-DD)", schema: {type: string}}
        - {name: to, in: query, description: "On or before this date (YYYY-MM-DD)", schema: {type: string}}
        - {name: page, in: query, schema: {type: integer}}
        - {name: pageSize, in: query, schema: {type: integer}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/AuditLogList'}}}}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
  /api/admin/audit-logs/export:
    get:
      tags: ["Admin: Audit"]
      summary: "Export audit logs as CSV"
      description: "Same filters as the list (action, entityType, userId, q, from, to; no paging). Returns the newest 10,000 matching entries as a UTF-8 CSV download (gmedic-audit-log-YYYY-MM-DD.csv) with columns When (UTC), User, Role, Action, Entity type, Entity ID, Summary, IP address. Cells starting with = + - @ are prefixed with an apostrophe so spreadsheets do not run them. Every export is itself recorded as AUDIT_LOG_EXPORTED."
      operationId: getApiAdminAuditLogsExport
      x-access: "audit_logs.view"
      parameters:
        - {name: action, in: query, schema: {type: string}}
        - {name: entityType, in: query, schema: {type: string}}
        - {name: userId, in: query, schema: {type: string}}
        - {name: q, in: query, schema: {type: string}}
        - {name: from, in: query, description: "On or after this date (YYYY-MM-DD)", schema: {type: string}}
        - {name: to, in: query, description: "On or before this date (YYYY-MM-DD)", schema: {type: string}}
      responses:
        '200':
          description: CSV file (Content-Disposition attachment, Cache-Control no-store)
          content:
            text/csv:
              schema: {type: string}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
  /api/emergency/options:
    get:
      tags: ["Receptionist"]
      summary: "What the Emergency Walk-in form offers"
      description: "Departments with their doctors, and for each doctor whether an emergency walk-in can be registered right now (active, verified, present, not on leave, working today and before the end of their last working block of the day; a present doctor whose hours start later today is eligible now) and why not. Also whether this receptionist is allowed (`allowed`, read from the database), the hospital's emergency intake state and the current workload warning."
      operationId: getApiEmergencyOptions
      x-access: "receptionist"
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/EmergencyOptions'}}}}
        '401': {description: Not signed in / session ended}
  /api/emergency/summary:
    get:
      tags: ["Receptionist"]
      summary: "Today's emergency walk-in counts and the active list"
      description: "Counted by the server from the real appointments and queue tokens; nothing is entered by hand. Every patient is in exactly one group, so the three groups add up to `activeTotal`: awaiting triage (open and no triage yet), waiting for consultation (open and assessed by a doctor) and under consultation. Completed patients are counted in `completedToday`; cancelled patients are counted nowhere. `warning` is true at or above `threshold` (the system setting emergency_walkin_warning_threshold, default 10) and carries `escalation` instructions; it never refuses a registration."
      operationId: getApiEmergencySummary
      x-access: "receptionist"
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/EmergencySummary'}}}}
        '401': {description: Not signed in / session ended}
  /api/emergency/walk-ins:
    post:
      tags: ["Receptionist"]
      summary: "Register an emergency walk-in (no slot)"
      description: "Registers a patient who cannot wait, without choosing a slot. It takes no seat of any slot and gives an emergency token (E001, E002, ... per doctor per day, never reused). Server-side rules: the receptionist must be active, of this hospital and allowed (users.can_book_emergency, checked in the database; otherwise 403, audited); `emergencyReason` 3-300 characters; the hospital is active and its emergency intake is not paused; the doctor is in the department, can be booked like for a normal appointment (active, verified, not marked absent, not on leave) and is working today (before the end of their last working block of the day; a present doctor whose hours start later today is eligible now). Availability is read again inside the registration, so a stale screen cannot get through. There is no walk-in limit: no count refuses a registration (the response carries a `workload` warning instead). A refusal for the hospital or the doctor is a 409 whose message carries the hospital's escalation and referral instructions and fields.alternatives lists other doctors who can take the patient. The patient is registered by mobile number exactly as in POST /api/appointments (same 409 questions about a shared number). Triage is not set here: a doctor assesses it later, until then the walk-in is awaiting triage. Recorded in the audit log (EMERGENCY_WALKIN_REGISTERED) with the reason, the receptionist and the time."
      operationId: postApiEmergencyWalkIns
      x-access: "receptionist"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EmergencyWalkInRequest'}
      responses:
        '201': {description: Registered, content: {application/json: {schema: {$ref: '#/components/schemas/EmergencyWalkInResult'}}}}
        '400': {description: "Validation error (reason, department, doctor, patient)", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: "Not allowed to register emergency walk-ins (no permission, inactive, or another hospital)"}
        '404': {description: Doctor not found (not one of this hospital's doctors)}
        '409': {description: "Intake paused, doctor unavailable (absent, on leave, deactivated or outside working hours), hospital not active, the patient is already registered as an active walk-in, or the number belongs to another patient", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/doctor/queue/{id}/triage:
    patch:
      tags: ["Doctor"]
      summary: "Assess the triage priority of an emergency walk-in"
      description: "Only a doctor, only for their own walk-in on today's queue that is not completed or cancelled. Every assignment or change is audited (TRIAGE_ASSIGNED / TRIAGE_CHANGED) with the previous value."
      operationId: patchApiDoctorQueueIdTriage
      x-access: "doctor"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TriageRequest'}
      responses:
        '200': {description: OK}
        '400': {description: "Unknown priority, or not today's queue", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '404': {description: Token not found}
        '409': {description: "Not an emergency walk-in, or already completed or cancelled"}
  /api/doctor/queue/{id}/call:
    post:
      tags: ["Doctor"]
      summary: "Call a particular waiting or skipped patient"
      description: "The suggested order (critical first, then walk-ins awaiting triage, urgent, semi-urgent, then appointments and non-urgent walk-ins by time) is only a suggestion; the doctor can call anyone. Calling someone other than the suggested patient, or a walk-in nobody has assessed, is audited as QUEUE_OVERRIDE. A patient in consultation is never touched."
      operationId: postApiDoctorQueueIdCall
      x-access: "doctor"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        content:
          application/json:
            schema: {type: object, properties: {note: {type: string, maxLength: 200}}}
      responses:
        '200': {description: OK}
        '400': {description: "Not today's queue, or the patient cannot be called"}
        '401': {description: Not signed in / session ended}
        '404': {description: Token not found}
  /api/admin/hospitals/{id}/emergency-intake:
    get:
      tags: ["Admin: Hospitals"]
      summary: "Emergency intake settings of a hospital"
      operationId: getApiAdminHospitalsIdEmergencyIntake
      x-access: "hospitals.view"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: object, properties: {intake: {$ref: '#/components/schemas/EmergencyIntake'}}}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Hospital not found}
    put:
      tags: ["Admin: Hospitals"]
      summary: "Pause or resume emergency walk-ins and set the escalation and referral instructions"
      description: "Super Admin and Operations (hospitals.manage) only; never the receptionist. Pausing or resuming needs a reason (3-300 characters); who changed it and when is kept on the hospital and in the audit log (EMERGENCY_INTAKE_PAUSED / _RESUMED, EMERGENCY_REFERRAL_UPDATED). There is no walk-in count to configure: sending `walkInLimit` returns 400. Nothing has to be set for emergency walk-ins to work; the workload warning level is a system setting."
      operationId: putApiAdminHospitalsIdEmergencyIntake
      x-access: "hospitals.manage"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EmergencyIntakeUpdate'}
      responses:
        '200': {description: OK}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Hospital not found}
  /api/me:
    get:
      tags: ["Receptionist"]
      summary: "Current user"
      operationId: getApiMe
      x-access: "receptionist"
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/RecMe'}}}}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
  /api/dashboard:
    get:
      tags: ["Receptionist"]
      summary: "Dashboard summary"
      operationId: getApiDashboard
      x-access: "receptionist"
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/RecDashboard'}}}}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
  /api/search:
    get:
      tags: ["Receptionist"]
      summary: "Global search (doctors and patients of this hospital)"
      description: "Needs at least 2 characters (trimmed to 60), otherwise both lists come back empty. Doctors: up to 5, matched on name, specialization or id. Patients: up to 6 who have an appointment here, matched on name (contains), patient id (exact) or, with 4 or more digits, mobile number in any format. Two people with the same name are two results (grouped by patient id)."
      operationId: getApiSearch
      x-access: "receptionist"
      parameters:
        - {name: q, in: query, schema: {type: string, minLength: 2, maxLength: 60}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/RecSearch'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
  /api/patients/lookup:
    get:
      tags: ["Receptionist"]
      summary: "Look up a patient by mobile number"
      description: "Who is on file for a number, so the front desk can pick them instead of retyping. `sharing` lists patients registered without a number of their own who use this one (e.g. family members). Returns `patient: null` when the number is unknown. A patient who has never visited this hospital comes back masked (`masked: true`, name like \"A****** M*****\", no id, mobile, gender, date of birth or relatives)."
      operationId: getApiPatientsLookup
      x-access: "receptionist"
      parameters:
        - {name: mobile, in: query, required: true, schema: {type: string}, description: A 10-digit Indian mobile number (+91 and spaces are accepted)}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/RecPatientLookup'}}}}
        '400': {description: Not a valid 10-digit mobile number (fields.mobile), content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
  /api/appointments:
    get:
      tags: ["Receptionist"]
      summary: "List appointments"
      description: "Paged in SQL. `counts` are totals per status tab over every page and ignore the status filter; a no-show is counted under no_show, not confirmed."
      operationId: getApiAppointments
      x-access: "receptionist"
      parameters:
        - {name: q, in: query, schema: {type: string, maxLength: 80}, description: "Patient name, appointment id or doctor name (contains); patient id (exact); with 4 or more digits also the patient's mobile in any format"}
        - {name: date, in: query, schema: {type: string, format: date}}
        - {name: from, in: query, schema: {type: string, format: date}}
        - {name: to, in: query, schema: {type: string, format: date}}
        - {name: doctorId, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: string, enum: [confirmed, pending, completed, cancelled, no_show]}, description: "A no-show is a flag on a confirmed appointment: confirmed leaves no-shows out and no_show lists them"}
        - {name: paymentStatus, in: query, schema: {type: string, enum: [paid, pending]}}
        - {name: sort, in: query, schema: {type: string, enum: [date_asc, date_desc], default: date_desc}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 10}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/RecAppointmentList'}}}}
        '400': {description: "Invalid date, status or paymentStatus", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
    post:
      tags: ["Receptionist"]
      summary: "Book a walk-in or phone appointment (shares seats and tokens with the patient app)"
      description: "Takes a seat in the slot, gives the booking its slot-based token number and issues its queue token (status waiting), all in one transaction. Token numbers follow the doctor's day in slot order: each slot owns as many numbers as it has seats, so with 6 per slot the first slot is T001-T006 and the next T007-T012, and seat n of a slot gets that slot's n-th number whatever the channel or booking order (a cancelled seat's number goes to its next booking; if a capacity cut leaves that number held, the next number after the day's planned capacity is used). Front-desk bookings may use the slot's walk-in seats as well as any online seat still free. Give `patientId` for an existing patient, or `patient` (found or registered by mobile number). `channel: phone` records the source as Phone, otherwise Walk-in; the booking user is recorded in `bookedBy`. A known number given with a different name returns 409 (fields.existingPatientName, existingPatientKnown, and existingPatientId only for a patient already known at this hospital; a patient not yet seen here is shown with a masked name); re-send with that `patientId` (or `patient.samePerson: true` when no id was returned), or with `patient.differentPerson: true` to register a separate person who shares the number. `patientId` is only accepted for a patient with an appointment or link at this hospital (else 400). Names match when the words of one are the leading words of the other ('Riya' = 'Riya Sharma', 'Raj' is not 'Rajesh'). Booking the same patient with the same doctor on the same day twice returns 409, also under concurrent requests. `emergency: true` is no longer accepted here: it returns 410 with fields.useInstead = /api/emergency/walk-ins. An emergency is registered with POST /api/emergency/walk-ins, which needs no slot and takes no seat of this endpoint's slots. Emergency appointments booked into a full slot before that change (migration 032) stay as history. A regular booking into a full slot returns 409 with fields.slotFull."
      operationId: postApiAppointments
      x-access: "receptionist"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RecBookAppointment'}
      responses:
        '201': {description: Booked, content: {application/json: {schema: {$ref: '#/components/schemas/RecBookResult'}}}}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Doctor not found (not one of this hospital's doctors)}
        '410': {description: "`emergency: true` was sent: emergencies are registered with POST /api/emergency/walk-ins instead (fields.useInstead)", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '409': {description: "Day closed (hospital not active, doctor deactivated, unverified, branch inactive, on leave or absent, outside the booking window), slot full or already ended, the patient already has an appointment with the doctor that day (fields.appointmentId), or the number belongs to another patient (fields.existingPatientId); emergency refused (fields.emergency: slot not full, no emergency seats, emergency seats taken, not today, or by phone)", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/doctors/{id}/slots:
    get:
      tags: ["Receptionist"]
      summary: "A doctor's slots on a date with live seat counts for the front desk and the app"
      operationId: getApiDoctorsIdSlots
      x-access: "receptionist"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: date, in: query, required: true, schema: {type: string, format: date}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/RecDoctorSlots'}}}}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '403': {description: Role lacks the required permission}
        '404': {description: Doctor not found}
  /api/doctors/{id}/slots/stream:
    get:
      tags: ["Receptionist"]
      summary: "The same slots, live (Server-Sent Events)"
      description: "text/event-stream. Sends a `slots` event with the GET /api/doctors/{id}/slots body on connect and again within about a second whenever it changes (a booking at any counter or in the patient app, a cancellation, an app hold lapsing, a slot ending). On an error after connecting it sends a `problem` event ({error}) and closes. The stream closes itself after 5 minutes; EventSource reconnects (retry 3 s) and the session is checked again."
      operationId: getApiDoctorsIdSlotsStream
      x-access: "receptionist"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: date, in: query, required: true, schema: {type: string, format: date}}
      responses:
        '200': {description: "Event stream; each `slots` event's data is a RecDoctorSlots", content: {text/event-stream: {schema: {type: string}}}}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Not signed in / session ended}
        '404': {description: Doctor not found}
  /api/doctors/{id}/walk-in-seats:
    get:
      tags: ["Receptionist"]
      summary: "Seats per slot held back for walk-ins, per schedule block"
      operationId: getApiDoctorsIdWalkInSeats
