<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 250" fill="none">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DDF3F6"/>
      <stop offset="1" stop-color="#F3FBFC" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E7F1F5"/>
    </linearGradient>
    <linearGradient id="wallSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D6E6EE"/>
      <stop offset="1" stop-color="#EAF3F7"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5FB8D0"/>
      <stop offset="1" stop-color="#2D7F9E"/>
    </linearGradient>
    <linearGradient id="glassLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9ED6E4"/>
      <stop offset="1" stop-color="#5DA9C1"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14B8A6"/>
      <stop offset="1" stop-color="#0A8F8C"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5CC49A"/>
      <stop offset="1" stop-color="#2E9A74"/>
    </linearGradient>
    <linearGradient id="leafDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3FAE86"/>
      <stop offset="1" stop-color="#1F7F5F"/>
    </linearGradient>
    <pattern id="win" width="22" height="20" patternUnits="userSpaceOnUse">
      <rect x="3" y="3" width="16" height="13" rx="2" fill="url(#glassLight)"/>
      <rect x="3" y="3" width="7" height="13" rx="1.5" fill="#FFFFFF" opacity=".28"/>
    </pattern>
    <pattern id="winSide" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect x="3" y="3" width="14" height="13" rx="2" fill="url(#glass)" opacity=".85"/>
    </pattern>
  </defs>

  <!-- sky & sun glow -->
  <rect width="520" height="250" fill="url(#sky)"/>
  <circle cx="420" cy="58" r="70" fill="#FFFFFF" opacity=".55"/>
  <ellipse cx="120" cy="40" rx="44" ry="10" fill="#FFFFFF" opacity=".8"/>
  <ellipse cx="146" cy="33" rx="26" ry="9" fill="#FFFFFF" opacity=".8"/>

  <!-- left wing -->
  <path d="M40 118 L150 104 L150 222 L40 222 Z" fill="url(#wallSide)"/>
  <rect x="48" y="122" width="96" height="92" fill="url(#winSide)"/>

  <!-- main block -->
  <rect x="150" y="70" width="250" height="152" fill="url(#wall)"/>
  <rect x="150" y="70" width="250" height="8" fill="#CFE2EA"/>
  <rect x="162" y="88" width="226" height="100" fill="url(#win)"/>

  <!-- central tower with sign -->
  <rect x="236" y="30" width="78" height="192" fill="#FFFFFF"/>
  <rect x="236" y="30" width="78" height="192" fill="url(#wallSide)" opacity=".35"/>
  <rect x="244" y="92" width="62" height="96" rx="3" fill="url(#glass)"/>
  <path d="M244 92 L306 92 L244 150 Z" fill="#FFFFFF" opacity=".14"/>
  <rect x="251" y="40" width="48" height="44" rx="10" fill="url(#teal)"/>
  <rect x="270" y="47" width="10" height="30" rx="3" fill="#FFFFFF"/>
  <rect x="260" y="57" width="30" height="10" rx="3" fill="#FFFFFF"/>

  <!-- right wing -->
  <path d="M400 96 L484 110 L484 222 L400 222 Z" fill="url(#wallSide)"/>
  <rect x="406" y="116" width="72" height="98" fill="url(#winSide)"/>

  <!-- entrance canopy -->
  <rect x="222" y="188" width="106" height="8" rx="3" fill="#0F263D"/>
  <rect x="232" y="196" width="4" height="26" fill="#9FB6C4"/>
  <rect x="314" y="196" width="4" height="26" fill="#9FB6C4"/>
  <rect x="250" y="198" width="50" height="24" rx="2" fill="url(#glass)"/>
  <line x1="275" y1="198" x2="275" y2="222" stroke="#DDF3F6" stroke-width="1.5"/>

  <!-- ground -->
  <rect x="0" y="220" width="520" height="30" fill="#E3F1EE"/>
  <rect x="0" y="220" width="520" height="3" fill="#CFE5E0"/>
  <path d="M220 250 L250 222 L300 222 L330 250 Z" fill="#F4FAF9"/>

  <!-- trees -->
  <rect x="24" y="186" width="5" height="36" rx="2" fill="#7A5A44"/>
  <ellipse cx="26" cy="176" rx="22" ry="28" fill="url(#leafDark)"/>
  <ellipse cx="20" cy="170" rx="9" ry="12" fill="#FFFFFF" opacity=".12"/>
  <rect x="176" y="198" width="4" height="24" rx="2" fill="#7A5A44"/>
  <ellipse cx="178" cy="192" rx="16" ry="18" fill="url(#leaf)"/>
  <rect x="368" y="198" width="4" height="24" rx="2" fill="#7A5A44"/>
  <ellipse cx="370" cy="192" rx="16" ry="18" fill="url(#leaf)"/>
  <rect x="495" y="182" width="5" height="40" rx="2" fill="#7A5A44"/>
  <ellipse cx="497" cy="170" rx="22" ry="30" fill="url(#leafDark)"/>

  <!-- shrubs -->
  <ellipse cx="120" cy="222" rx="30" ry="9" fill="#4DB38D"/>
  <ellipse cx="430" cy="222" rx="34" ry="9" fill="#4DB38D"/>
  <ellipse cx="208" cy="223" rx="14" ry="6" fill="#62C29C"/>
  <ellipse cx="344" cy="223" rx="14" ry="6" fill="#62C29C"/>
</svg>
